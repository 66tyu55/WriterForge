name: WF Time Rule Cross-Frame New Character One Shot

on:
  push:
    branches: [feature/wf-xianxia-time-rule-20261113]
    paths:
      - .github/workflows/wf-time-crossframe-new-character-once.yml
      - docs/WF_XIANXIA_TIME_V2_CROSSING_RETEST_20261113.md
      - experiments/wf_xianxia_time_v2_fresh_action_trial_once.py
      - experiments/wf_xianxia_time_v2_fresh_crossover_case_20261113.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-time-crossframe-random-role-20261114-one-shot
  cancel-in-progress: false

jobs:
  real-random-story-check:
    if: >-
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'WF time crossframe: launch frozen 4-call real author trial'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Red-green movement, author window and fresh-case tests
        run: |
          python -m unittest discover -s tests -p 'test_wf_xianxia_time_v2*.py' -v
          python experiments/wf_xianxia_time_v2_fresh_action_trial_once.py --dry-run
      - name: Install local pinned CPU author adapter
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python -m pip install 'llama-cpp-python==0.3.16'
      - name: Download source SHA-verified Qwen2.5-3B model
        run: |
          curl --fail --show-error --location --connect-timeout 30 --max-time 720 \
            --output "$RUNNER_TEMP/wf-time-crossframe-qwen.gguf" \
            "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/254600e47ea694216f6108325376ce5b35d456a1/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          printf '%s  %s\n' \
            '9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94' \
            "$RUNNER_TEMP/wf-time-crossframe-qwen.gguf" | sha256sum --check --status
      - name: Two independent action choices, rule feedback, two real prose
        run: |
          python experiments/wf_xianxia_time_v2_fresh_action_trial_once.py \
            --model "$RUNNER_TEMP/wf-time-crossframe-qwen.gguf" \
            --out "$RUNNER_TEMP/wf-time-crossframe-new-role-results"
      - name: Archive frozen original model turns and rule verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-Time-CrossFrame-New-Role-Four-Original-Model-Turns
          path: ${{ runner.temp }}/wf-time-crossframe-new-role-results/
          if-no-files-found: warn
          retention-days: 90
