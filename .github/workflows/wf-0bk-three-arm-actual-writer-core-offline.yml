name: WF 0.BK TRUE Bare vs AutonomousWriting G vs G+SHADOW Experiment Plumbing OFFLINE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bk-three-arm-actual-writer-core-offline.yml
      - experiments/wf_0bk_actual_writer_three_arm_host_gate.py
      - tests/test_wf_0bk_true_three_arm_author_core.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bk-one-real-core-three-arm-fixture
  cancel-in-progress: true

jobs:
  source-bound-genuine-wf-core-plumbing-no-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No paid model APIs or user-private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install existing project and evidence optional dependencies
        run: python -m pip install -e '.[r2,evidence]'
      - name: RED first GREEN after fix real AutonomousWriting continuity G path
        run: python -m unittest discover -s tests -p 'test_wf_0bk_true_three_arm_author_core.py' -v
      - name: Retrieve archived original 0.AY provider source for unrelated existing regression
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full WriterForge existing regression, zero model calls
        run: python -m unittest discover -s tests -q
