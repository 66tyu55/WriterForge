name: WF 0.CJ Frozen Real Literary Holdout and Abstain - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0cj-real-literary-holdout.yml
      - experiments/wf_0cj_independent_real_classic_holdouts_20261029.json
      - experiments/wf_0cj_independent_real_classic_probe.py
      - tests/test_wf_0cj_literary_task_scope.py
      - writerforge/xuehai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0cj-frozen-real-literary-holdouts
  cancel-in-progress: true

jobs:
  public-classic-real-r2-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Xuehai and R2 SDK; no LLM client
        run: python -m pip install -e '.[r2]'
      - name: WF explicit literary intent vs technical-task regression (source only)
        run: python -m unittest discover -s tests -p test_wf_0cj_literary_task_scope.py -v
      - name: Nine pre-registered genuine literature and non-literature holdouts
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          python -m experiments.wf_0cj_independent_real_classic_probe > "$RUNNER_TEMP/wf0cj-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0cj-result.json").read_text("utf8"))
          assert data["status"]=="WF0CJ_NEW_HOLDOUT_REAL_R2_LITERATURE_DIAGNOSTIC"
          assert data["source_integrity_verified"] is True
          assert data["total_literature_entries"]==126
          assert data["three_part_readings"]==78
          assert data["pre_registered_cases"]==9
          assert data["r2_writes"]==data["canon_writes"]==data["model_requests"]==0
          assert data["criteria_not_tuned_in_this_run"] is True
          assert data["literary_gain_proven"] is False
          for case in data["source_cases"]:
              print("WF0CJ_FROZEN_CASE",json.dumps(case,ensure_ascii=False))
          from collections import Counter
          counter=Counter(c["observed_disposition"] for c in data["source_cases"])
          print("WF0CJ_RESULTS_NO_AUTOMATIC_LITERARY_PROMOTION",json.dumps(dict(counter),sort_keys=True))
          PY
