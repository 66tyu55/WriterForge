name: WF Atria Missing Climax and Psychology — 6000 Token Paired SSE
on:
  push:
    branches: [experiment-seven-literary-scenes-inkstone]
    paths:
      - .github/workflows/wf-atria-two-missing-genres-6000.yml
permissions:
  contents: read
concurrency:
  group: wf-two-missing-genres-6000-once
  cancel-in-progress: false
jobs:
  evidence-first-same-budget-pair:
    if: github.repository == '66tyu55/WriterForge'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scene: [climax, psychology]
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WF_SCENE_CATEGORY: ${{ matrix.scene }}
      WF_BATCH_CONFIRMED_STREAM_MODEL: Atria-Dawn-Preview
      WF_STREAM_OUTPUT_TOKENS: '6000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[r2]'
      - name: Verify fixed seven scenes and source-grounded WF prompts offline
        run: python -m unittest tests.test_seven_literary_scenes_inkstone_ab -q
      - name: SSE paired bare/WF generation with identical 6000-token limit
        run: python -m experiments.seven_literary_scenes_inkstone_ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Atria-Recovery-${{ matrix.scene }}-Same-6000-Originals
          path: wf_inkstone_seven_scene_results/
          retention-days: 14
          if-no-files-found: warn
