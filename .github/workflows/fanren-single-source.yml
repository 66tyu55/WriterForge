name: Modern long novel source study and private R2 recovery proof
on:
  workflow_dispatch:
    inputs:
      work_id:
        description: "Pilot one authorized source at a time"
        type: choice
        options: [fanrenxiuxian]
        required: true
  pull_request:
    paths:
      - 'writerforge/modern_source.py'
      - 'writerforge/cli.py'
      - 'tests/test_modern_source_streaming.py'
      - '.github/workflows/fanren-single-source.yml'

permissions:
  contents: read
concurrency:
  group: writerforge-modern-fanren-private-r2
  cancel-in-progress: false

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test >8 MiB, 2400 synthetic chapters, bounded heap, resumable SQLite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_modern_source_streaming.py' -v

  ingest-one:
    if: github.event_name == 'workflow_dispatch'
    needs: [synthetic-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_URL: ${{ secrets.WRITERFORGE_FANREN_SOURCE_URL }}
      SOURCE_SHA256: ${{ secrets.WRITERFORGE_FANREN_SOURCE_SHA256 }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WriterForge with existing R2 client
        run: python -m pip install -e '.[r2]'
      - name: Download one private-input TXT with hard size and HTTPS bounds
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_URL" || { echo "::error::Missing private TXT source URL; no R2 archive created"; exit 1; }
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from urllib.parse import urlparse
          url=os.environ["SOURCE_URL"]
          parsed=urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("Only explicit HTTPS modern input is accepted")
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"source.txt"
          part=target.with_suffix(".partial")
          sha=hashlib.sha256()
          size=0
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"WriterForge-private-text-study/1"})
              with urllib.request.urlopen(req,timeout=60) as response, part.open("xb") as dest:
                  final=urlparse(response.geturl())
                  if final.scheme!="https" or not final.hostname:
                      raise SystemExit("Non-HTTPS redirect refused")
                  while block:=response.read(1024*1024):
                      size+=len(block)
                      if size>32*1024*1024:
                          raise SystemExit("Modern source exceeds R2-compatible 32 MiB limit")
                      sha.update(block)
                      dest.write(block)
              if not 10*1024*1024<=size<=32*1024*1024:
                  raise SystemExit("Modern TXT size is outside 10..32 MiB source budget")
              expected=os.environ.get("SOURCE_SHA256","").strip().lower()
              if expected and (len(expected)!=64 or
                               any(c not in "0123456789abcdef" for c in expected)
                               or sha.hexdigest()!=expected):
                  raise SystemExit("Pinned original TXT SHA256 mismatch")
              os.replace(part,target)
          finally:
              part.unlink(missing_ok=True)
          print(f"DOWNLOADED TO RUNNER ONLY: {size} bytes; raw source SHA256: {sha.hexdigest()}")
          PY
      - name: Stream original into fresh SQLite chapter transactions (NOT LLM training)
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${SOURCE_SHA256}" ]]; then args+=(--expected-sha256 "${SOURCE_SHA256}"); fi
          python -m writerforge.cli --db "$RUNNER_TEMP/study.sqlite3" learn-modern \
            --work fanrenxiuxian --source "$RUNNER_TEMP/source.txt" \
            --report "$RUNNER_TEMP/study-report.json" "${args[@]}"
      - name: Private R2 upload and clean restore with source + database SHA verification
        shell: bash
        run: |
          set -euo pipefail
          test "$WRITERFORGE_R2_BUCKET" = "writerforge-private-library"
          python -m writerforge.cli --db "$RUNNER_TEMP/study.sqlite3" backup-r2 \
            --library fanrenxiuxian \
            --edition fanrenxiuxian-private-structural-v1 \
            --source "$RUNNER_TEMP/source.txt" \
            --extra report.json="$RUNNER_TEMP/study-report.json"
          python -m writerforge.cli --db "$RUNNER_TEMP/blank.sqlite3" restore-r2 \
            --library fanrenxiuxian --storage-dir "$RUNNER_TEMP/restore"
          python - <<'PY'
          import hashlib, json, os, pathlib, sqlite3
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          report=json.loads((root/"study-report.json").read_text(encoding="utf-8"))
          restores=list((root/"restore"/"fanrenxiuxian").glob("*/study.sqlite3"))
          assert len(restores)==1, "expected one fresh R2 snapshot"
          recovered=restores[0]
          source=recovered.parent/"source.txt"
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest==report["source_raw_sha256"]
          with sqlite3.connect(recovered) as db:
              assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
              rows=db.execute("SELECT COUNT(*) FROM studied_chapters WHERE work_id=?",
                              ("fanrenxiuxian-private-original",)).fetchone()[0]
              assert rows==report["source_chapters"]==report["studied_chapters"]
              source_units=db.execute("SELECT COUNT(*) FROM source_spans").fetchone()[0]
              assert source_units==report["studied_units"]
          assert report["structure_complete"]
          assert report["literary_learning_verified"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("## 凡人修仙传 私有 R2 验收\n")
              summary.write("GitHub Actions direct fetch; SQLite chapter-stream structural study; clean R2 restore\n")
              summary.write(f"Source SHA256: {digest}\n")
              summary.write(f"Studied chapters: {rows}, structural units: {source_units}\n")
              summary.write("No real model training or independent literary criticism performed.\n")
          print(f"FANREN R2 VERIFIED: {rows} chapters, {source_units} source units, source SHA256 {digest}")
          PY
