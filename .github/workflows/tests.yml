name: WriterForge Tests

on:
  push:
    branches: [main, v15-lane-runtime]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run full suite
        run: python -m unittest discover -s tests -q
      - name: Validate packaged browser editor JavaScript syntax
        run: |
          python - <<'PY'
          from importlib import resources
          from pathlib import Path
          html=resources.files("writerforge").joinpath("ui/studio.html").read_text(encoding="utf-8")
          assert html.count("<script>")==1 and html.count("</script>")==1
          source=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/writerforge-studio.js").write_text(source,encoding="utf-8")
          assert 'manuscript.addEventListener("input"' in source
          print("Packaged, event-aware JavaScript extracted.")
          PY
          node --check /tmp/writerforge-studio.js
      - name: Benchmark bounded companion
        run: python eval/companion_benchmark.py
