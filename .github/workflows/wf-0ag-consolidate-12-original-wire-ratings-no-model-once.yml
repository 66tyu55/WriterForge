name: WF 0.AG Consolidate Twelve Real Wires to Three Blind Scores Zero Model Calls ONCE
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AG_OFFLINE_CONSOLIDATE_TWELVE_ORIGINAL_WIRES_ONCE_20261025.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-0ag-offline-12-original-paid-source-wires-once
  cancel-in-progress: false
jobs:
  offline-no-provider-source-hash-and-rater-recovery:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40198761026
          name: WF-0AG-First-Three-PreRegistered-Genres-Real-200to350-Chars-Wires-Scores
          github-token: ${{ github.token }}
          path: wf0ag_first_three_provider_artifact
      - uses: actions/download-artifact@v4
        with:
          run-id: 40199709409
          name: WF-0AG-Three-Diverse-Originals-First-Score-Recovered-Reversed-Real-100Point-Ratings
          github-token: ${{ github.token }}
          path: wf0ag_paid_reverse_three_artifact
      - run: python -m pip install -e '.[r2]'
      - name: Genuine paid source and score recovery unit regressions without any credential
        run: PYTHONPATH=tests python -m unittest tests.test_wf_0ag_three_scores_replay tests.test_wf_0ag_diverse_micro_paired_protocol tests.test_wf_0ag_v96_causal_false_green -q
      - name: Twelve source SHA, frozen prompt SHAs, two orders, original 200-350 characters, no calls
        run: python -m experiments.wf_0ag_twelve_paid_wires_three_score_audit_20261025
      - name: Forbid false green and verify all six original provider rater grades are from true paid originals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('wf_0ag_twelve_original_wire_full_three_score_audit_20261025')
          x=json.loads((p/'STATUS.json').read_text('utf8'))
          assert x['format']=='wf.0ag.true-twelve-original-wires-3x2-genre-ratings.v1'
          assert x['status']=='TWELVE_TRUE_SHA_LOCKED_WIRES_THREE_DOUBLE_BLIND_SCORES_RECOVERED'
          assert x['new_model_calls']==x['new_writer_calls']==x['new_grade_calls']==0
          assert x['R2_reads']==x['R2_writes']==x['Canon_writes']==0
          assert x['Railway_deployments']==0 and not x['main_modified']
          assert x['original_provider_wire_count']==12
          assert not x['independent_human_literary_grades'] and not x['literary_improvement_proven']
          assert set(x['cases'])=={'wuxia_bridge','horror_flashlight','strategy_ledger'}
          assert len(list((p/'provider-originals'/'first-paid-run').glob('*.json')))==9
          assert len(list((p/'provider-originals'/'reverse-paid-run').glob('*.json')))==3
          for key,c in x['cases'].items():
              assert c['valid_original_provider_wire_count']==4
              assert c['new_model_calls_in_this_recovery']==0
              assert all(200<=r['codepoints']<=350 for r in c['author_original_unchanged'].values())
              assert all(0<=t['score_100']<=100 for t in c['first_and_reverse_model_blind_scores'].values())
              print(key,c['WF_minus_bare_points'],c['grade_confidence'],
                    [(v['score_100'],v['two_blind_order_scores'])
                     for v in c['first_and_reverse_model_blind_scores'].values()])
          print('RECOVERED_ALL_TWELVE_TRUE_ORIGINAL_WIRES_NO_PROVIDER')
          PY
      - name: Consolidate all twelve original provider responses and three literature comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AG-ALL-12-True-Original-Wires-Three-Literary-Pairs-Scores-Source-Only
          path: wf_0ag_twelve_original_wire_full_three_score_audit_20261025/
          retention-days: 30
          if-no-files-found: warn
