name: V37 strictly independent L2-only critics on frozen Xi You Ji case one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v37-l2-independent-forensic-once.yml'
permissions:
  contents: read
concurrency:
  group: wf-v37-l2-one-time-no-overwrite
  cancel-in-progress: false
jobs:
  examiner-l2-only:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Fail-closed exact excerpt ids, chronological setup/payoff, privacy, historical immutable source
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v37_L2_forensic.py -q
          python -m unittest discover -s tests -p test_v37_l2_evidence.py -q
          python -m unittest discover -s tests -p test_v36_real_trace_debugger.py -q
      - name: Verify genuine frozen 6-stage lineage and run DeepSeek Pro plus MiniMax L2-only reviewers
        run: python -m scripts.forensic_v37_xiyouji_L2
