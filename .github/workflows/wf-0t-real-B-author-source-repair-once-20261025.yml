name: WF 0.T Real B First-Source Author-Owned Repair and Fresh Downstream
on:
  # A single pre-authorized, bounded follow-up to the frozen 6-wire A/B.
  # No model calls on workflow creation or ordinary code/docs pushes.
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0T_B_REAL_REPAIR_FIRE_ONCE_20261025.txt
      - experiments/WF_0T_B_COMPACT_READER_SOURCE_FINAL_ONCE_20261025.txt

permissions:
  contents: read
  actions: read
concurrency:
  group: wf-0t-authentic-B-source-pair-one-repair-probe
  cancel-in-progress: false

jobs:
  original-real-model-author-revisit:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use only existing WF dependencies; no R2 credentials in this job
        run: python -m pip install -e '.[r2]'
      - name: Download true original B model sources, not artificial A/B outputs
        uses: actions/download-artifact@v4
        with:
          name: WF-0T-Real-Fanren-Staged-A-vs-B-Initial-Pair-20261025
          run-id: 40163959949
          github-token: ${{ github.token }}
          path: wf0t_prior_paired_originals
      - name: Offline authenticate 6 previous provider wire receipts and exact B V96/V114 sources
        run: |
          set -euo pipefail
          PYTHONPATH=tests python -m unittest tests.test_wf_0t_real_B_repair_protocol tests.test_wf_source_guided_repair_contract tests.test_wf_writer_self_revision_loop -q
          python - <<'PY'
          import experiments.wf_0t_real_B_reader_repair_downstream_20261025 as exp
          a,b,x,y,cp1,cp2=exp.read_old_real_sources()
          assert cp2['previous_checkpoint_sha256']==cp1['receipt_sha256']
          assert exp.sha(x['prose'])==exp.PRIOR_B_FIRST
          assert exp.sha(y['prose'])==exp.PRIOR_B_SECOND
          print('SIX PREVIOUS REAL PROVIDER SHA RECEIPTS + TWO B SOURCE SPANS VERIFIED; 0 NEW MODEL CALLS')
          PY
      - name: B-author same DeepSeek read source, decide, optionally V119 edit and regenerate invalidated downstream
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0t_real_B_reader_repair_downstream_20261025
      - name: Verify this is no false real success, limited to 6 new calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("wf0t_real_B_two_source_repair_20261025/STATUS.json").read_text("utf8"))
          assert v['max_new_paid_calls']==6 and v['max_output_reserved']==8000
          assert 0<=v['new_paid_calls']<=6
          assert v['original_six_calls_not_billed_again']
          assert v['original_book_source_never_loaded']
          assert not v['literary_quality_not_verified'] is False
          assert v['canon_writes']==v['R2_writes']==v['Railway_deployments']==0
          assert not v['main_modified'] and v['no_external_critic']
          assert v['prior_run_id']==40163959949
          print("ACTUAL OUTCOME:",v.get('status'))
          print("NEW PROVIDER CALLS:",v['new_paid_calls'])
          print("ACTUAL NOVELIST CHOICE:",v.get('true_author_decision'))
          print("TRUE SOURCE EDIT + FULL FRESH DOWNSTREAM:",v['real_safe_repair_plus_new_downstream'])
          print("LITERARY QUALITY INDEPENDENTLY VERIFIED: NO")
          PY
      - name: Preserve all original model wires, contracts and rejected variants without user book source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0T-Real-B-Writer-Source-Repair-Downstream-20261025
          path: wf0t_real_B_two_source_repair_20261025/
          retention-days: 30
          if-no-files-found: warn
