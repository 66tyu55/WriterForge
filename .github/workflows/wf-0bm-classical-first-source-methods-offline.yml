name: WF 0.BM First Classical Source-Anchored Methods PENDING Only - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bm-classical-first-source-methods-offline.yml
      - experiments/wf_0bm_classical_source_anchored_method_candidates_20261028.json
      - experiments/wf_0bm_stage_first_classical_method_candidates.py
      - tests/test_wf_0bm_classics_source_anchored_pending.py
      - tests/test_wf_0bn_signed_classical_method_admission.py
      - writerforge/xuehai_method_trust.py
      - writerforge/xuehai.py
      - writerforge/db.py
      - tests/fixtures/xiyouji_chapter_001_original_zh.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bm-real-source-methods-pending-only
  cancel-in-progress: true

jobs:
  source-anchored-classical-methods-pending-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse external author-provider and private R2 keys
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","GLM_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install existing WriterForge core only
        run: python -m pip install -e '.[r2,evidence]'
      - name: Real classic source and review-rights staging tests
        run: python -m unittest discover -s tests -p 'test_wf_0bm_classics_source_anchored_pending.py' -v
      - name: External signed RIGHTS + CRAFT classical cards fail-first tests
        run: python -m unittest discover -s tests -p 'test_wf_0bn_signed_classical_method_admission.py' -v
      - name: Actually study local old classical chapter in disposable DB and stage methods
        run: |
          python -m experiments.wf_0bm_stage_first_classical_method_candidates --output "$RUNNER_TEMP/wf0bm-classical-pending.sqlite3"
          python - <<'PY'
          import os,sqlite3
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"wf0bm-classical-pending.sqlite3"
          c=sqlite3.connect(p)
          assert c.execute("SELECT COUNT(*) FROM studied_chapters").fetchone()[0]==1
          assert c.execute("SELECT COUNT(*) FROM xuehai_method_cards").fetchone()[0]==2
          assert c.execute("SELECT COUNT(*) FROM snapshots WHERE status='staging'").fetchone()[0]==1
          assert c.execute("SELECT COUNT(*) FROM xuehai_method_cards WHERE rights_status='RIGHTS_VERIFIED' OR review_status='PILOT_APPROVED'").fetchone()[0]==0
          assert c.execute("SELECT COUNT(*) FROM accepted_prose").fetchone()[0]==0
          print("WF0BM_REAL_LOCAL_CLASSICAL_SOURCE_BUT_METHODS_ONLY_PENDING_GREEN",flush=True)
          c.close()
          PY
      - name: Regression the previous source/author boundaries (no new model)
        run: |
          python -m unittest discover -s tests -p 'test_wf_0bl_xuehai_methods_write.py' -v
          python -m unittest discover -s tests -p 'test_wf_0bl_true_g_author_method_branch.py' -v
          python -m unittest discover -s tests -p 'test_v23_real_learning.py' -v
