name: WF 0.BI Real-Output Independent Reader Packets NO INFERENCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bi-blind-independent-reader-packets.yml
      - experiments/wf_0bi_genuine_blind_review_packet.py
      - tests/test_wf_0bi_genuine_blind_packet.py
      - 'experiments/wf_0bg_local_cpu_actual_outputs_20261027/**'
      - 'experiments/wf_0bh_real_qwen25_3b_outputs_20261027/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bi-two-real-source-reader-packets-only
  cancel-in-progress: true

jobs:
  masked-human-readers-from-ten-source-verified-local-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No paid model APIs or user-private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Existing offline source verification tools only
        run: python -m pip install -e '.[r2,evidence]'
      - name: RED first GREEN after fix - no invented human ratings
        run: python -m unittest discover -s tests -p 'test_wf_0bi_genuine_blind_packet.py' -v
      - name: Generate two opposing-order reader packets and separate curator mapping
        run: |
          python -m experiments.wf_0bi_genuine_blind_review_packet
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("wf0bi_two_independent_reader_packets_UNGRADED")
          data=json.loads((root/"STATUS.json").read_text("utf8"))
          assert data["status"]=="BLIND_REVIEW_AWAITING_HUMAN_READERS"
          assert data["genuine_local_source_pairs"]==5
          assert data["reviewer_packets_created"]==2
          assert data["actual_independent_reader_votes"]==0
          assert data["new_model_calls"]==0
          assert data["literary_quality_proven"] is False
          assert data["auto_promote"] is False
          PY
      - name: Upload reviewer 1 ONLY - do not upload unblinding map here
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BI-HUMAN-READER-ONE-ANONYMOUS-REVIEW
          path: wf0bi_two_independent_reader_packets_UNGRADED/reviewer_one/
          retention-days: 90
      - name: Upload reviewer 2 ONLY - reverse A and B to check order bias
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BI-HUMAN-READER-TWO-REVERSED-ANONYMOUS-REVIEW
          path: wf0bi_two_independent_reader_packets_UNGRADED/reviewer_two/
          retention-days: 90
      - name: Upload curator-only unblinding map - never share with reviewers
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BI-CURATOR-ONLY-HOLD-BACK-UNBLIND-MAPPING
          path: wf0bi_two_independent_reader_packets_UNGRADED/curator_ONLY/
          retention-days: 90
      - name: Retrieve immutable old source artifact for unrelated full-suite tests
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Entire WriterForge regression, no new inference or ratings
        run: python -m unittest discover -s tests -q
