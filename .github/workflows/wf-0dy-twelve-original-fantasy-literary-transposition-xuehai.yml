name: WF 0.DY Twelve Original Fantasy Literary Transpositions - Existing Xuehai No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0dy-twelve-original-fantasy-literary-transposition-xuehai.yml
      - experiments/wf_0dy_twelve_original_xuanhuan_literary_transpositions_readings_20261101.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf0dy-immutable-transposition-333-285
  cancel-in-progress: false

jobs:
  append-and-publish-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      snapshot: ${{ steps.backup.outputs.snapshot }}
      digest: ${{ steps.backup.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WriterForge Xuehai and R2 only
        run: python -m pip install -e '.[r2]'
      - name: Verify pinned original SHA and twelve unchanged continuous fantasy prose texts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from hashlib import sha1
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          p=pack_from(Path("experiments/wf_0dy_twelve_original_xuanhuan_literary_transpositions_readings_20261101.json"))
          assert set(p["sources"])=={"own"}
          assert p["source_scope"]=="ORIGINAL_GENERATED_FOR_WRITERFORGE_USER_PROJECT"
          assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          src=p["sources"]["own"]
          assert src["source_commit"]=="96aa9d1a2e37461fb8578d83919a39d7aabf404f"
          assert src["source_blob_sha1"]=="5cabb6daed7daa22662a3aca8577115e5f2dea49"
          with urlopen(Request(src["url"],headers={"User-Agent":"WF0DY-original-immutable-check/1"}),timeout=50) as fh:
              raw=fh.read(src["source_size_bytes"]+1)
          assert len(raw)==src["source_size_bytes"]
          assert sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==src["source_blob_sha1"]
          target=Path(os.environ["RUNNER_TEMP"])/src["filename"]
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(raw)
          verify_sources(p,Path(os.environ["RUNNER_TEMP"]))
          print("WF0DY_SOURCE_PINNED_TWELVE_CONTINUOUS_ORIGINALS_VERIFIED",flush=True)
          PY
      - name: Append twelve to existing Xuehai copied from immutable R2 old 321
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0dy_twelve_original_xuanhuan_literary_transpositions_readings_20261101.json --source-dir "$RUNNER_TEMP" \
            --db "$RUNNER_TEMP/wf0dy-333.sqlite3" > "$RUNNER_TEMP/wf0dy-stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          audit=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dy-stage.json").read_text("utf8"))
          assert audit["entries"]==333 and audit["full_readings"]==285 and audit["added"]==12
          assert audit["old_content_sha256"]=="3bf201cc1c073308e04d96f5b904ed5812339ec056ede674b6ab0b8b3cc6e71f"
          assert audit["old_r2_modified"] is False and audit["model_calls"]==audit["canon_writes"]==0
          print("WF0DY_321_OLD_ORIGINALS_UNCHANGED_333_285_READABLE",flush=True)
          PY
      - name: Publish to new immutable R2 successor prefix without overwriting ancestors
        id: backup
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0dy_twelve_original_xuanhuan_literary_transpositions_readings_20261101.json \
            --db "$RUNNER_TEMP/wf0dy-333.sqlite3" > "$RUNNER_TEMP/wf0dy-publish.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dy-publish.json").read_text("utf8"))
          assert j["entries"]==333 and j["full_readings"]==285
          assert j["old_prefix_modified"] is False and j["model_calls"]==j["canon_writes"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+j["snapshot"]+"\n")
              f.write("digest="+j["all_content_sha256"]+"\n")
          print("WF0DY_NEW_R2",j["library"],"SNAPSHOT",j["snapshot"],"CONTENT_SHA",j["all_content_sha256"],flush=True)
          PY

  fresh-runner-readonly-cold-recovery:
    needs: append-and-publish-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0DY_SNAPSHOT: ${{ needs.append-and-publish-existing-xuehai.outputs.snapshot }}
      WF0DY_DIGEST: ${{ needs.append-and-publish-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reinstall existing R2 read-only adapter without model
        run: python -m pip install -e '.[r2]'
      - name: Fresh runner cold restore 333 literature and 285 complete readings
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0dy_twelve_original_xuanhuan_literary_transpositions_readings_20261101.json --snapshot "$WF0DY_SNAPSHOT" --digest "$WF0DY_DIGEST" \
            > "$RUNNER_TEMP/wf0dy-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dy-cold.json").read_text("utf8"))
          assert j["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_333_285"
          assert j["entries"]==333 and j["full_readings"]==285 and j["added"]==12
          assert j["r2_writes"]==j["model_calls"]==j["canon_writes"]==0
          print("WF0DY_FRESH_RUNNER_READONLY_COLD_R2_333_285_SUCCESS",flush=True)
          PY
