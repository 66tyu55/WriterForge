name: WF 0.AH Three New Genre Microfiction Paired Once

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AH_FIRST_THREE_FIRE_ONCE_20261025.txt

permissions:
  contents: read

concurrency:
  group: wf-0ah-new-wuxia-xianxia-history-one-shot
  cancel-in-progress: false

jobs:
  three-new-genre-real-samples:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WriterForge dependencies only
        run: python -m pip install -e '.[r2]'
      - name: Assert one-shot sentinel and no R2 or other model secrets
        run: |
          test "$(cat experiments/WF_0AH_FIRST_THREE_FIRE_ONCE_20261025.txt)" = "WF0AH_RUN_ONCE_FROZEN_WUXIA_XIANXIA_HISTORY"
          python - <<'PY'
          import os
          assert not any(os.getenv(k) for k in (
              'WRITERFORGE_R2_ACCOUNT_ID','WRITERFORGE_R2_ACCESS_KEY_ID',
              'DISCOVERY_API_KEY','OPENAI_API_KEY'))
          print('SOURCE GUARD: no R2, Canon or second-model credentials')
          PY
      - name: Run offline preregistration and V96 false green controls BEFORE model
        run: |
          python -m unittest \
            tests.test_wf_0ah_first_three_real_protocol \
            tests.test_wf_0ag_v96_causal_false_green \
            tests.test_wf_0ad_multigenre_real_paired_protocol \
            -q
      - name: Same model equal author completion cap three NEW genres no retry
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0ah_first_three_real_microfiction_20261025
      - name: Verify truthful three-genre source and score result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('wf_0ah_first_three_original_microfiction_20261025/STATUS.json')
          doc = json.loads(path.read_text('utf8'))
          assert doc['format'] == 'wf.0ah.frozen-three-genres-microfiction.v1'
          assert doc['actual_paid_call_reservations'] <= 12
          assert doc['author_max_tokens_each_arm'] == 1700
          assert doc['R2_reads'] == doc['R2_writes'] == doc['canon_writes'] == 0
          assert doc['Railway_deployments'] == 0 and not doc['main_modified']
          assert doc['status'] == 'THREE_REAL_PAIRS_GRADED_WITH_LIMITATIONS', doc['status']
          print('Three source-preserved microfiction pairs and counterbalanced grades produced.')
          for key, row in doc['cases'].items():
              print(key, 'chars', tuple(row['source_evidence'][arm]['source_checks']['hanzi_count'] for arm in ('bare','WF')),
                    'score', row['ratings']['裸模型']['score_100'],
                    row['ratings']['WF辅助']['score_100'],
                    'comparison', row['score_interpretation'],
                    'V96', row['source_evidence']['WF']['source_checks'].get('V96_status'))
          PY
      - name: Retain original supplier envelopes, source audit and raw blind judgments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AH-Three-New-Genre-Bare-vs-WF-Original-Provider-SHA-and-Ratings
          path: wf_0ah_first_three_original_microfiction_20261025/
          retention-days: 90
          if-no-files-found: warn
