name: WF 0.BY Full Xuehai Reading Before Real Author Planning

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0br-classical-readings.yml
      - experiments/wf_0br_classical_original_annotation_reflection_20261028.json
      - experiments/wf_0bs_classical_remaining_18_original_annotation_reflection_20261028.json
      - experiments/wf_0bt_original_eight_close_readings_20261028.json
      - experiments/wf_0bu_remaining_sixteen_original_close_readings_20261028.json
      - experiments/wf_0bv_three_fantasy_classics_six_close_readings_20261028.json
      - experiments/wf_0bw_three_fantasy_classics_six_long_readings_20261029.json
      - experiments/wf_0bx_three_new_fantasy_books_six_close_readings_20261029.json
      - experiments/wf_0by_real_author_preplan_reading_smoke.py
      - writerforge/writing_assist.py
      - writerforge/studio_server.py
      - writerforge/ui/studio.html
      - experiments/wf_0br_stage_classical_readings.py
      - writerforge/xuehai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0br-real-reading-content
  cancel-in-progress: true

jobs:
  full-readings-in-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Fetch only nine pinned public-domain sources
        run: |
          python - <<'PY'
          import json,os
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import Request,urlopen
          meta=json.loads(Path("experiments/wf_0br_classical_original_annotation_reflection_20261028.json").read_text("utf8"))
          for key,source in meta["sources"].items():
              url=source["url"]
              assert url.startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(url,headers={"User-Agent":"WriterForge-original-literary-reading/1"}),timeout=45) as r:
                  raw=r.read(4_000_001)
              assert 100_000<len(raw)<4_000_000
              filename={"xy":"23962-0.txt","hl":"24264-0.txt","sh":"23863-0.txt"}[key]
              (Path(os.environ["RUNNER_TEMP"])/filename).write_bytes(raw)
          fantasy=json.loads(Path("experiments/wf_0bv_three_fantasy_classics_six_close_readings_20261028.json").read_text("utf8"))
          for key,src in fantasy["sources"].items():
              url=src["url"]
              assert url.startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(url,headers={"User-Agent":"WriterForge-public-domain-fantasy-literary-reading/1"}),timeout=45) as r:
                  raw=r.read(3_000_001)
              actual=sha1(b"blob "+str(len(raw)).encode("ascii")+b"\0"+raw).hexdigest()
              assert len(raw)==src["source_size_bytes"]
              assert actual==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(raw)
          newpack=json.loads(Path("experiments/wf_0bx_three_new_fantasy_books_six_close_readings_20261029.json").read_text("utf8"))
          for key,src in newpack["sources"].items():
              url=src["url"]
              assert url.startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(url,headers={"User-Agent":"WriterForge-literary-fantasy-public-domain/1"}),timeout=45) as r:
                  raw=r.read(3_000_001)
              actual=sha1(b"blob "+str(len(raw)).encode("ascii")+b"\0"+raw).hexdigest()
              assert len(raw)==src["source_size_bytes"]
              assert actual==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(raw)
          PY
      - name: Preserve old 108 content entries and read back six new complete fantasy studies
        run: |
          python -m experiments.wf_0br_stage_classical_readings \
            --db "$RUNNER_TEMP/wf0br-30-full-texts.db" \
            --xy "$RUNNER_TEMP/23962-0.txt" \
            --hl "$RUNNER_TEMP/24264-0.txt" \
            --sh "$RUNNER_TEMP/23863-0.txt" \
            --fs "$RUNNER_TEMP/23910-0.txt" \
            --jh "$RUNNER_TEMP/23818-0.txt" \
            --lz "$RUNNER_TEMP/51828-0.txt" \
            --hx "$RUNNER_TEMP/24231-0.txt" \
            --dd "$RUNNER_TEMP/24233-0.txt" \
            --zb "$RUNNER_TEMP/25245-0.txt" \
            --fantasy18 > "$RUNNER_TEMP/wf0br-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0br-result.json").read_text("utf8"))
          assert x["new_books"]==6
          assert x["new_complete_fantasy_readings"]==18
          assert x["old_readings_preserved"]==48
          assert x["previous_fantasy_readings_preserved"]==12
          assert x["additional_long_readings"]==6
          assert x["added_books"]==3
          assert x["added_readings"]==6
          assert x["all_literary_content_entries"]==114
          assert x["all_three_part_readings"]==66
          assert x["new_long_original_characters"]>16000
          assert x["full_fantasy_readback"] is True
          assert x["source_editions_pin_verified"] is True
          assert x["model_calls"]==0
          assert x["method_cards"]==0
          print("WF0BX: 3部新古籍＋6篇真实原文批注心得，原108条完整保存，114内容条目/66三段式逐篇读回",flush=True)
          PY
      - name: Verify actual author model sees whole reading before JSON chapter plan
        run: |
          python -m experiments.wf_0by_real_author_preplan_reading_smoke \
            --db "$RUNNER_TEMP/wf0br-30-full-texts.db" > "$RUNNER_TEMP/wf0by-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0by-result.json").read_text("utf8"))
          assert doc["status"]=="REAL_AUTONOMOUS_WRITER_PREPLAN_FULL_READING_DELIVERED"
          assert doc["real_provider_model_calls"]==0
          assert doc["additional_model_calls"]==0
          assert doc["canon_writes"]==0
          assert doc["models_actual_literary_gain_proven"] is False
          assert [x["author_choice"] for x in doc["baseline_and_reading_prompts_compared"]]==[
              "NOT_ASKED","USE"]
          print("WF0BY: actual AutonomousWriting planning consumed FULL source+annotation+reflection before prose, author USE recorded; baseline unchanged; model mocked/no fees",flush=True)
          PY
