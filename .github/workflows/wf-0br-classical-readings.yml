name: WF 0.BR Literary Readings Original Annotation Reflection

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0br-classical-readings.yml
      - experiments/wf_0br_classical_original_annotation_reflection_20261028.json
      - experiments/wf_0br_stage_classical_readings.py
      - writerforge/xuehai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0br-real-reading-content
  cancel-in-progress: true

jobs:
  full-readings-in-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Fetch exactly three pinned public-domain source texts
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          meta=json.loads(Path("experiments/wf_0br_classical_original_annotation_reflection_20261028.json").read_text("utf8"))
          for key,source in meta["sources"].items():
              url=source["url"]
              assert url.startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(url,headers={"User-Agent":"WriterForge-original-literary-reading/1"}),timeout=45) as r:
                  raw=r.read(4_000_001)
              assert 100_000<len(raw)<4_000_000
              filename={"xy":"23962-0.txt","hl":"24264-0.txt","sh":"23863-0.txt"}[key]
              (Path(os.environ["RUNNER_TEMP"])/filename).write_bytes(raw)
          PY
      - name: Keep all 30 full texts and retrieve complete 3-part readings
        run: |
          python -m experiments.wf_0br_stage_classical_readings \
            --db "$RUNNER_TEMP/wf0br-30-full-texts.db" \
            --xy "$RUNNER_TEMP/23962-0.txt" \
            --hl "$RUNNER_TEMP/24264-0.txt" \
            --sh "$RUNNER_TEMP/23863-0.txt" > "$RUNNER_TEMP/wf0br-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0br-result.json").read_text("utf8"))
          assert x["annotated_classic_entries"]==6
          assert x["original_prose_scenes_kept"]==24
          assert x["original_classical_passages_kept"]==24
          assert x["total_content_entries"]==54
          assert x["original_classic_chars"]>3000
          assert x["model_calls"]==0
          assert all(r["read_complete_three_part_text"] for r in x["read_examples"].values())
          print("WF0BR_CONTENT_GREEN: 24原创＋24古籍原文＋6古籍精读（原文/批注/心得），同一现有学海，全文可读回",flush=True)
          print("6 readings original characters:",x["original_classic_chars"],flush=True)
          print("examples:",json.dumps(x["read_examples"],ensure_ascii=False),flush=True)
          PY
