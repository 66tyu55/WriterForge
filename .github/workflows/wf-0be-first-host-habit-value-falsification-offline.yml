name: WF 0.BE First Host v1-v2 Value Falsification - NO MODEL CALLS

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0be-first-host-habit-value-falsification-offline.yml
      - experiments/wf_0be_v1_v2_falsification_cases_20261027.json
      - experiments/wf_0be_v1_v2_preflight_only.py
      - tests/test_wf_0be_v1_v2_falsification_preflight.py
      - tests/test_wf_0bc_first_host_nutrient_loop.py
      - writerforge/evolution.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0be-first-host-value-falsification
  cancel-in-progress: true

jobs:
  zero-provider-real-v1-v2-falsification-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provider credentials explicitly absent
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENAI_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install offline full-suite dependencies only
        run: python -m pip install -e '.[r2,evidence]'
      - name: RED first GREEN after fix - v1-v2 source locked value and cost probes
        run: python -m unittest discover -s tests -p 'test_wf_0be_v1_v2_falsification_preflight.py' -v
      - name: Source locked existing first-host acquisition regression
        run: python -m unittest discover -s tests -p 'test_wf_0bc_first_host_nutrient_loop.py' -v
      - name: Verify historical 0.AY artifact exists before full source-dependent regression
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full WriterForge test suite no paid inference
        run: python -m unittest discover -s tests -q
      - name: Generate prospective envelopes WITHOUT invoking providers
        run: python -m experiments.wf_0be_v1_v2_preflight_only
      - name: Upload prospective prompts only, not fabricated model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BE-v1-v2-Source-Frozen-UNRUN-Value-Falsification-Pack
          path: wf0be_v1_v2_prospective_preflight/
          retention-days: 90
          if-no-files-found: warn
