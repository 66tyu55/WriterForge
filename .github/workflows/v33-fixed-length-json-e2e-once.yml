name: V33 fixed-length + JSON both-provider real two-exam integration one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v33-fixed-length-json-e2e-once.yml'
permissions:
  contents: read
concurrency:
  group: v33-two-exam-hard-length-json-one-shot
  cancel-in-progress: false
jobs:
  graded-exercise:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [0,1]
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      WF_V33_SLOT: ${{ matrix.slot }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Reprove character bounds, symmetric revision and format-only JSON repair
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v33_exam_contracts.py -q
          python -m unittest discover -s tests -p test_v33_repair_e2e.py -q
          python -m unittest discover -s tests -p test_v32_examiner_blind.py -q
          python -m unittest discover -s tests -p test_v32_exam_audit.py -q
      - name: Same frozen WF memory, hard manuscript length, two anonymous graders
        run: python -m scripts.run_v33_repair_e2e
  independent-r2-readback:
    needs: graded-exercise
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: SHA verify real grades and two dimension reviews, missing results remain unscored
        run: python -m scripts.audit_v33_repair_e2e
