name: Reversible World Causality Skill (offline safety tests)

on:
  push:
    branches:
      - feature/reversible-world-causality-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reversible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-free inverse and adversarial tests
        run: python -m unittest discover -s tests -p 'test_wf_reversible_world*.py' -v
