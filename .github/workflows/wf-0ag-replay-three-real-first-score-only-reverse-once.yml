name: WF 0.AG Complete ONLY Missing Reverse Micro-Genre Ratings ONCE
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AG_REPLAY_9_WIRES_COMPLETE_3_REVERSE_RATINGS_ONCE_20261025.txt
      - experiments/WF_0AG_REPLAY_9_WIRES_FIXED_NOTES_ONCE_20261025.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-0ag-score-only-three-reverse-never-rewrite-authors
  cancel-in-progress: false
jobs:
  recover-first-order-unchanged-and-score-reverse-only:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exactly the first paid 0.AG source archive, never another author
        uses: actions/download-artifact@v4
        with:
          run-id: 40198761026
          name: WF-0AG-First-Three-PreRegistered-Genres-Real-200to350-Chars-Wires-Scores
          github-token: ${{ github.token }}
          path: wf0ag_first_three_provider_artifact
      - run: python -m pip install -e '.[r2]'
      - name: Offline RED evidence plus lossless numerical recovery from nine SHA-locked actual provider wires
        run: |
          PYTHONPATH=tests python -m unittest tests.test_wf_0ag_diverse_micro_paired_protocol tests.test_wf_0ag_three_scores_replay tests.test_wf_0ag_v96_causal_false_green -q
          python - <<'PY'
          from experiments.wf_0ag_replay_three_real_micro_scores_only_20261025 import replay_old_first_once
          recovered,prior,calls=replay_old_first_once()
          assert len(recovered)==len(prior['cases'])==3
          assert len(calls)==prior['actual_model_calls']==9
          assert [recovered[k]['first_ratings']['裸模型']['score'] for k in ('wuxia_bridge','horror_flashlight','strategy_ledger')]==[84,86,73]
          assert [recovered[k]['first_ratings']['WF辅助']['score'] for k in ('wuxia_bridge','horror_flashlight','strategy_ledger')]==[80,83,75]
          print('ALL NINE OLD PROVIDER WIRES VERIFIED; SIX AUTHOR CALLS NOT REPEATED')
          PY
      - name: No reading books, writing R2 or Canon, or extra model credentials
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY","WRITERFORGE_R2_ACCOUNT_ID","WRITERFORGE_R2_ACCESS_KEY_ID","OPENAI_API_KEY","OPENROUTER_API_KEY"))'
      - name: THREE new reversed-order anonymous grade calls maximum, ZERO writer calls, raw wire first
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0ag_replay_three_real_micro_scores_only_20261025
      - name: Check original prose unchanged and publish uncertain scores without false promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('wf_0ag_three_real_score_only_recovery_20261025/STATUS.json').read_text('utf8'))
          assert s['format']=='wf.0ag.real-three-micro-first-ratings-lossless-recovery.v1'
          assert s['replayed_old_first_paid_run']==40198761026
          assert s['old_author_requests_replayed_without_new_call']==6
          assert s['old_rater_requests_replayed_without_new_call']==3
          assert s['new_writer_requests']==0
          assert s['new_reverse_rater_request_cap']==3
          assert 0<s['new_model_calls']<=3
          assert s['R2_reads']==s['R2_writes']==s['Canon_writes']==0
          assert s['Railway_deployments']==0 and not s['main_modified']
          assert s['no_original_prose_changed']
          assert not s['independent_human_grades']
          print('REVERSE-ONLY NEW CALLS:',s['new_model_calls'])
          for k,v in s['cases'].items():
              print(k,'first',v['original_first_order_scores'],
                    'scores',v.get('ratings'),
                    'confidence',v.get('comparison_confidence'))
          assert len(s['cases'])==3
          assert all(v['scores_ready'] for v in s['cases'].values()),'Some ratings missing; archive retains originals, no retry'
          PY
      - name: Preserve nine first provider wires by SHA and three new reverse original wires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AG-Three-Diverse-Originals-First-Score-Recovered-Reversed-Real-100Point-Ratings
          path: wf_0ag_three_real_score_only_recovery_20261025/
          retention-days: 30
          if-no-files-found: warn
