name: V28 random3 ch17 low effort final recovery one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-random3-ch17-low-recovery-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: wf-v28-random3-low-final-only
  cancel-in-progress: false
jobs:
  only-ch17:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WF_SAMPLE_SLOT: '2'
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: No-network tests and 50k retry-safe profile
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v28_random3_ch17_low_recovery.py -q
          python -m unittest discover -s tests -p test_v28_retry_resilient_profile.py -q
          python -m unittest discover -s tests -p test_v28_glm_low_effort.py -q
      - name: Only one ch17 A-B under verified low reasoning effort and 50k profile
        run: python -m scripts.run_wudong_random3_v8_low_effort_ch17
