name: WF Non-Time Grounded Skills Targeted Regression

on:
  push:
    branches:
      - feature/wf-nontime-space-character-world-20261113
    paths:
      - '.agents/skills/wf-world-logic/**'
      - 'tests/test_wf_source_world_logic.py'
      - 'tests/test_wf_source_inverse_frozen_v3.py'
      - 'experiments/wf_non_time_source_inverse_frozen_20261113.json'
      - 'experiments/wf_non_time_source_inverse_local_model_once.py'
      - '.github/workflows/wf-nontime-targeted-ci.yml'

permissions:
  contents: read

jobs:
  genuine-targeted-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-world and frozen inverse preflight only
        run: |
          python -m unittest discover -s tests -p test_wf_source_world_logic.py -v
          python -m unittest discover -s tests -p test_wf_source_inverse_frozen_v3.py -v
          python experiments/wf_non_time_source_inverse_local_model_once.py --dry-run
