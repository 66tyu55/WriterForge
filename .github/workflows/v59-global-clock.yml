name: V59 global recording-clock audit, fail-first and no R2
on:
  push:
    branches: [v59-global-ledger-clock-audit]
    paths:
      - 'writerforge/fact_journal.py'
      - 'writerforge/cli.py'
      - 'tests/test_v59_global_ledger_clock.py'
      - 'scripts/audit_v59_global_clock.py'
      - '.github/workflows/v59-global-clock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-global-recording-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: V54 fact ledger (no training)
        run: python -m unittest discover -s tests -p 'test_v54_consent_fact_core.py' -v
      - name: V55 bitemporal contract
        run: python -m unittest discover -s tests -p 'test_v55_bitemporal_graph.py' -v
      - name: V57 relations contract
        run: python -m unittest discover -s tests -p 'test_v57_relation_foundation.py' -v
      - name: V58 identity disclosure and paging contract
        run: python -m unittest discover -s tests -p 'test_v58_relation_redteam.py' -v
      - name: Freeze V59 fail-first machine receipt
        run: python -m scripts.audit_v59_global_clock
      - name: SHA manifest
        if: always()
        run: sha256sum writerforge/fact_journal.py writerforge/cli.py tests/test_v59_global_ledger_clock.py scripts/audit_v59_global_clock.py
      - name: Preserve every green or red machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V59_Global_Recording_Clock_Audit
          path: v59_relation_regression_receipt.json
          if-no-files-found: warn
          retention-days: 90
