name: V28 Wudong real continuation iteration 04 - one shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-wudong-iteration-04.yml'
permissions:
  contents: read
concurrency:
  group: wf-v28-wudong-real-experiments
  cancel-in-progress: false
jobs:
  continue-actual-novel-not-json:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Validate novel continuation, P0 source isolation, fair length and budgets
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v28_discovery_models.py -v
          python -m unittest discover -s tests -p test_v28_mechanism_boundary.py -v
          python -m unittest discover -s tests -p test_v28_cloud_ab.py -v
      - name: Run bounded REAL source-isolated AB with one prose continuation per draft
        run: |
          set -euo pipefail
          python scripts/run_wudong_discovery_ab.py
