name: WF 0.AL Recover Four Real 0.AJ Author Wires and Score Only Once

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AL_REPLAY_FOUR_ORIGINALS_SCORE_ONLY_ONCE_20261025.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0al-real-four-authors-source-lock-four-new-raters-only
  cancel-in-progress: false

jobs:
  source-only-0aj-authors-and-grades:
    if: >-
      github.repository == '66tyu55/WriterForge' &&
      github.ref_name == 'refactor-unified-scene-delivery-audit' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'experiment(0.AL): FIRE ONLY FOUR RATERS ON FROZEN 0AJ AUTHORS'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WF modules only
        run: python -m pip install -e '.[r2]'
      - name: Strict one-shot marker and no book/R2 or other provider tokens
        run: |
          test "$(cat experiments/WF_0AL_REPLAY_FOUR_ORIGINALS_SCORE_ONLY_ONCE_20261025.txt)" = "WF0AL_FOUR_REAL_ORIGINAL_AUTHOR_WIRES_ONLY_FOUR_NEW_BLIND_RATERS"
          python - <<'PY'
          import os
          assert not any(os.getenv(x) for x in (
              'WRITERFORGE_R2_ACCOUNT_ID','WRITERFORGE_R2_ACCESS_KEY_ID',
              'DISCOVERY_API_KEY','OPENAI_API_KEY','OPENROUTER_API_KEY'))
          PY
      - name: Full zero-model regression including authentic DeepSeek separator repair
        run: python -m unittest discover -s tests -q
      - name: Read original four author provider envelopes, NO author calls
        uses: actions/download-artifact@v4
        with:
          run-id: 40205342567
          name: WF-0AJ-Romance-SpaceDisaster-New-Writer-Wires-Source-Audit-And-Real-Blind-Scores
          github-token: ${{ github.token }}
          path: wf0aj_two_original_author_artifact
      - name: Offline verify four original provider SHA, prose source hashes and exact one field separator
        run: |
          python - <<'PY'
          from experiments.wf_0al_replay_scifi_fullwidth_source_and_two_grades_20261025 import replay_four_original_authors
          cases,manifest,events=replay_four_original_authors()
          assert len(cases)==2 and len(events)==4
          assert cases['romance_photos']['source']['bare']['chars']==195
          assert cases['romance_photos']['source']['WF']['chars']==274
          assert cases['scifi_airlock']['source']['bare']['chars']==216
          assert cases['scifi_airlock']['source']['WF']['chars']==342
          recovered=cases['scifi_airlock']['source']['WF']['original_format_recovery']
          assert recovered and recovered['single_external_separator_only']
          assert recovered['original_prose_unchanged']
          assert cases['scifi_airlock']['WF_source_checks']['V96_causal_relation']['relation_verified'] is False
          print('ALL FOUR REAL AUTHOR SOURCE SHA VERIFIED, 0 MODEL CALLS')
          PY
      - name: Score ONLY the frozen four originals using at most four anonymous calls
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0al_replay_scifi_fullwidth_source_and_two_grades_20261025
      - name: Verify immutable author SHA, correct literary score confidence and no other writes
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          p=Path('wf_0al_0aj_four_original_author_score_only_replay_20261025')
          d=json.loads((p/'STATUS.json').read_text('utf8'))
          assert d['format']=='wf.0al.score-four-true-0aj-author-wires.v1'
          assert d['status']=='FOUR_IMMUTABLE_AUTHORS_TWO_GENRES_BOTH_GRADES_RESTORED'
          assert d['new_author_calls']==0 and 0<d['new_grade_calls']<=4
          assert len(d['original_verified_wire_shas'])==4
          assert d['R2_reads']==d['R2_writes']==d['Canon_writes']==0
          assert d['Railway_deployments']==0 and not d['main_modified']
          assert d['literary_improvement_not_proven']
          for event in d['new_rating_provider_events']:
              if event.get('original_wire_preserved'):
                  path=p/'new-rating-provider-wires'/(event['task']+'.json')
                  assert sha256(path.read_bytes()).hexdigest()==event['raw_provider_sha256']
          for name,c in d['cases'].items():
              assert c['scores_ready'] and c['comparison_confidence'].startswith('NOT_COMPARABLE')
              print(name,'bare',c['ratings']['裸模型']['score_100'],
                    'WF',c['ratings']['WF辅助']['score_100'],
                    'delta',c['WF_minus_bare'],
                    'confidence',c['comparison_confidence'])
          PY
      - name: Preserve all original four malformed/valid wires, two models' manuscripts, rater wires and score failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AL-Four-Immutable-0AJ-Authors-Recovered-SciFi-Wire-Two-Order-Scores
          path: wf_0al_0aj_four_original_author_score_only_replay_20261025/
          retention-days: 90
          if-no-files-found: warn
