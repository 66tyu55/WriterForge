name: Fanren pinned web source to private R2 (NO Google Drive)
on:
  pull_request:
    paths:
      - 'scripts/archive_web_fanren_r2.py'
      - 'tests/test_v31_web_fanren_r2.py'
      - '.github/workflows/fanren-pinned-web-r2.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fanren-pinned-web-r2.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: writerforge-fanren-pinned-web-private-r2
  cancel-in-progress: false

jobs:
  validate-source-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WriterForge for standalone runner script
        run: python -m pip install -e .
      - name: Synthetic private R2 roundtrip tests, no source text in GitHub
        run: python -m unittest discover -s tests -p test_v31_web_fanren_r2.py -v
      - name: Download the ACTUAL 15MB pinned web TXT in GitHub runner
        run: |
          set -euo pipefail
          python scripts/archive_web_fanren_r2.py --validate-only

  new-private-r2-archive:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate-source-and-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing private R2 client
        run: python -m pip install -e '.[r2]'
      - name: PRIVATE R2 upload one NEW pinned web novel and independently verify fresh download
        run: |
          set -euo pipefail
          test "$WRITERFORGE_R2_BUCKET" = 'writerforge-private-library'
          python scripts/archive_web_fanren_r2.py
