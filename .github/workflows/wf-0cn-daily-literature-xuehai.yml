name: WF 0.CN Everyday Literature Added to Existing Xuehai - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0cn-daily-literature-xuehai.yml
      - experiments/wf_0cn_append_daily_classics.py
      - experiments/wf_0cn_five_daily_life_classics_20261029.json
      - tests/test_wf_0cn_author_scope_join.py
      - writerforge/xuehai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0cn-five-public-domain-everyday-prose
  cancel-in-progress: false

jobs:
  append-to-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    outputs:
      snapshot: ${{ steps.publish.outputs.snapshot }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project Xuehai and R2 (no model client)
        run: python -m pip install -e '.[r2]'
      - name: Check linked author-writing intent independently of stored books
        run: python -m unittest discover -s tests -p test_wf_0cn_author_scope_join.py -v
      - name: Fetch only two pinned genuine US public domain originals; verify exact Git blobs
        run: |
          python - <<'PY'
          import os
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import Request,urlopen
          from experiments.wf_0cn_append_daily_classics import load,verify_sources
          assert not any(os.environ.get(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          data=load()
          paths={}
          for key,source in data["sources"].items():
              assert source["url"].startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(source["url"],headers={"User-Agent":"WF0CN-public-source-only/1"}),timeout=45) as response:
                  raw=response.read(source["source_size_bytes"]+1)
              assert len(raw)==source["source_size_bytes"]
              sha=sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert sha==source["source_blob_sha1"]
              paths[key]=Path(os.environ["RUNNER_TEMP"])/source["filename"]
              paths[key].write_bytes(raw)
          verify_sources(data,rl=paths["rl"],zb=paths["zb"])
          print("WF0CN_FIVE_GENUINE_LITERARY_SOURCE_SPANS_VERIFIED",flush=True)
          PY
      - name: Append 5 to a temporary copy of existing 131/83 Xuehai, exercise author selection
        run: |
          python -m experiments.wf_0cn_append_daily_classics stage \
            --db "$RUNNER_TEMP/wf0cn-136.sqlite3" \
            --rl "$RUNNER_TEMP/24032-0.txt" \
            --zb "$RUNNER_TEMP/25245-0.txt" > "$RUNNER_TEMP/wf0cn-stage.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0cn-stage.json").read_text("utf8"))
          assert d["status"]=="WF0CN_DISPOSABLE_EXISTING_XUEHAI_136_88"
          assert d["entries"]==136 and d["full_readings"]==88 and d["new_readings"]==5
          assert not d["old_r2_modified"] and d["model_calls"]==0 and d["canon_writes"]==0
          print("WF0CN_136_CONTENTS_88_THREE_PART_READINGS_EXACT",flush=True)
          print("WF0CN_REAL_AUTHOR_SELECTOR_OBSERVATIONS",json.dumps(d["author_selection_observed"],ensure_ascii=False),flush=True)
          PY
      - name: Publish a new immutable R2 successor, never overwrite the old 131 source
        id: publish
        run: |
          python -m experiments.wf_0cn_append_daily_classics publish \
            --db "$RUNNER_TEMP/wf0cn-136.sqlite3" > "$RUNNER_TEMP/wf0cn-publish.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0cn-publish.json").read_text("utf8"))
          assert r["status"]=="WF0CN_IMMUTABLE_XUEHAI_SUCCESSOR_STORED"
          assert r["entries"]==136 and r["full_readings"]==88
          assert r["old_131_r2_unchanged"] and r["model_calls"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+r["snapshot"]+"\n")
              f.write("digest="+r["complete_content_sha256"]+"\n")
          print("WF0CN_PINNED_SNAPSHOT",r["snapshot"],"CONTENT_SHA",r["complete_content_sha256"],flush=True)
          PY

  independent-cold-restore:
    needs: append-to-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0CN_SNAPSHOT: ${{ needs.append-to-existing-xuehai.outputs.snapshot }}
      WF0CN_DIGEST: ${{ needs.append-to-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing R2 cold-only reader; no model client
        run: python -m pip install -e '.[r2]'
      - name: Independent recovery checks 136/88 plus read-only real author source delivery
        run: |
          python -m experiments.wf_0cn_append_daily_classics cold-restore \
            --snapshot "$WF0CN_SNAPSHOT" --digest "$WF0CN_DIGEST" > "$RUNNER_TEMP/wf0cn-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0cn-cold.json").read_text("utf8"))
          assert r["status"]=="WF0CN_FIVE_REAL_READING_COLD_RESTORE_GREEN"
          assert r["entries"]==136 and r["full_readings"]==88
          assert r["model_calls"]==r["r2_writes"]==r["canon_writes"]==0
          print("WF0CN_SOURCE_ONLY_INDEPENDENT_136_88_COLD_RECOVERY_GREEN",flush=True)
          PY
