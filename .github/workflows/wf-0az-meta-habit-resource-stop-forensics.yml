name: WF 0.AZ Real GLM 429 Host-Resource Dormancy and Portable Habit Provenance OFFLINE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - writerforge/evolution.py
      - tests/test_wf_0az_meta_habit_resource_stop.py
      - tests/test_wf_0ba_optional_habit_dispatch.py
      - tests/test_wf_0ba_portable_habit_candidate_ecology.py
      - tests/test_wf_0bb_signed_lineage_execution.py
      - experiments/wf_0ay_real_two_host_429_source_only_dormancy_20261026.py
      - .github/workflows/wf-0az-meta-habit-resource-stop-forensics.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0az-true-cross-host-429-evidence-only-no-model
  cancel-in-progress: true

jobs:
  real-source-429-offline-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source only - no model key or private R2
        run: python -m pip install -e '.[r2,evidence]'
      - name: Test real provider 429 vs actual habit falsifier
        run: python -m unittest discover -s tests -p 'test_wf_0az_meta_habit_resource_stop.py' -v
      - name: Full WriterForge regression incl portable habit and revised G writer
        run: python -m unittest discover -s tests -q
      - name: Retrieve immutable original 0.AY DeepSeek and GLM source / failed fourth request
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Verify original live provider wires and classify 429 without payment
        run: |
          python -m py_compile experiments/wf_0ay_real_two_host_429_source_only_dormancy_20261026.py
          python -m experiments.wf_0ay_real_two_host_429_source_only_dormancy_20261026
      - name: Preserve forensic findings including RED - zero new provider calls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AZ-True-DeepSeek-GLM-429-Source-Locked-Habit-Dormancy-Evidence
          path: wf_0ay_first_portable_habit_real_transfer_stop_forensics_20261026/
          retention-days: 90
          if-no-files-found: warn
