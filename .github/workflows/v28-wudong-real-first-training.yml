name: V28 Wudong REAL model first-unit training to private R2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-wudong-real-first-training.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v28-wudong-real-training-first-unit-one-work
  cancel-in-progress: false

jobs:
  real-independent-model-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_FLASH_ATTENTION: '1'
      WF_PLANNER_MODEL: qwen2.5:3b
      WF_WRITER_MODEL: qwen2.5:3b
      WF_CRITIC_MODEL: gemma3:4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private R2 client and WriterForge
        run: python -m pip install -e '.[r2]'
      - name: Safe pure offline real-training validation
        run: python tests/test_v28_reverse_real_training.py -v
      - name: Install local Ollama (original text stays on this GitHub runner)
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          (nohup ollama serve >/tmp/writerforge-ollama.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "LOCAL_OLLAMA_SERVER_UNAVAILABLE" >&2
          exit 1
      - name: Pull two distinct actual local LLMs
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama pull gemma3:4b
          ollama list
      - name: REAL novel opening read, isolated original prose generation, independent model criticism and R2 core receipt
        run: |
          set -euo pipefail
          python scripts/run_wudong_real_reverse_training.py
