name: Three independently archived xuanhuan novels to private R2
on:
  pull_request:
    paths:
      - 'scripts/archive_three_xuanhuan_r2.py'
      - 'tests/test_v32_three_xuanhuan_r2.py'
      - '.github/workflows/three-xuanhuan-r2.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/three-xuanhuan-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-sources:
    strategy:
      fail-fast: false
      matrix:
        work: [doupo, wudongqiankun, wanmeishijie]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WriterForge
        run: python -m pip install -e .
      - name: Verify local synthetic failure/success boundaries
        run: python -m unittest discover -s tests -p test_v32_three_xuanhuan_r2.py -v
      - name: Download actual full TXT and check source identity in GitHub runner
        run: |
          set -euo pipefail
          python scripts/archive_three_xuanhuan_r2.py --work ${{ matrix.work }} --validate-only

  store-individual-books:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify-web-sources]
    strategy:
      fail-fast: false
      matrix:
        work: [doupo, wudongqiankun, wanmeishijie]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install -e '.[r2]'
      - name: New verified book upload + independent SHA256 fresh R2 download
        run: |
          set -euo pipefail
          test "$WRITERFORGE_R2_BUCKET" = "writerforge-private-library"
          python scripts/archive_three_xuanhuan_r2.py --work ${{ matrix.work }}
