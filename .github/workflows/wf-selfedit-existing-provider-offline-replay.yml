name: WF Re-Examine Actual Writer Self-Edits - Zero New Model Calls
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-selfedit-existing-provider-offline-replay.yml
permissions:
  contents: read
  actions: read
jobs:
  exact-original-quote-proposal-replay:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure model credentials unavailable for this offline replay
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENAI_API_KEY"))'
      - run: python -m pip install -e '.[r2]'
      - name: Run exact quote recovery and source-provenance adversarial tests
        run: PYTHONPATH=tests python -m unittest tests.test_wf_writer_self_revision_loop -q
      - name: Download exact ORIGINAL model proposals from single paid writer run
        uses: actions/download-artifact@v4
        with:
          run-id: 40068690550
          name: WF-Real-Writer-Self-Edit-First-Originals
          github-token: ${{ github.token }}
          path: wf_old_self_edit_originals
      - name: Apply original model proposals through current V119 and V96 without another model
        run: python -m experiments.wf_self_edit_saved_provider_offline_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Original-Writer-Edits-Zero-Model-Saved-Evidence
          path: wf_exact_quote_offline_selfedit_replay/
          retention-days: 30
          if-no-files-found: warn
