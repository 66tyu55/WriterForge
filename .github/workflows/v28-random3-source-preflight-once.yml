name: V28 random3 later-chapter R2 preflight (zero model) one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-random3-source-preflight-once.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Check old API, deterministic random sample and three-chapter synthetic corpus
        run: |
          python -m unittest discover -s tests -p test_v28_random3_source.py -q
          python -m unittest discover -s tests -p test_v28_chapter2_diagnostic.py -q
      - name: Fresh verify private source and all three pre-chosen real chapter hashes
        run: python -m scripts.probe_wudong_random3_v7_r2
