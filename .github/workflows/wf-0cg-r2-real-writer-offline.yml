name: WF 0.CG Real Existing R2 to Actual Author Preplanning - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0cg-r2-real-writer-offline.yml
      - experiments/wf_0cg_existing_r2_to_real_writer_offline.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-r2-to-author-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse existing Xuehai, Writer and existing R2StudyVault
        run: python -m pip install -e '.[r2]'
      - name: Real R2 cold recovery to actual AutonomousWriting with 12 scripted replies, no LLM calls
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          python -m experiments.wf_0cg_existing_r2_to_real_writer_offline             > "$RUNNER_TEMP/wf0cg-no-model-author-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0cg-no-model-author-receipt.json").read_text("utf8"))
          assert doc["status"]=="WF0CG_EXISTING_R2_LITERATURE_USED_IN_REAL_AUTHOR_PIPELINE_FIXTURE_ONLY"
          assert doc["literary_entries"]==126
          assert doc["complete_three_part_readings"]==78
          assert doc["baseline_USE_SKIP_also_replayed"] is True
          assert [x["choice_from_FIXED_MODEL_REPLY"] for x in doc["two_distinct_scene_author_tests"]]==["USE","SKIP"]
          assert all(x["readings_before_author_planning"] and x["candidate_text_unchanged"] and not x["candidate_author_accepted"]
                     for x in doc["two_distinct_scene_author_tests"])
          assert doc["scripted_author_model_reply_calls"]==12
          assert doc["actual_paid_or_local_model_inferences"]==0
          assert doc["true_literary_skill_gain_demonstrated"] is False
          assert doc["production_railway_touched"] is False
          assert doc["r2_writes"]==0 and doc["canon_writes"]==0
          assert doc["previous_remote_source_unchanged"] is True
          print("WF0CG_EXISTING_PINNED_R2_READINGS_USED_IN_ACTUAL_WRITER_PLAN_AND_PROSE_PATH_NO_MODEL",flush=True)
          print("WF0CG_VIRGIN_R2_SOURCE_SHA_STABLE_TWO_SCENES_USE_SKIP_COMPLETED_ZERO_CANON",flush=True)
          PY
