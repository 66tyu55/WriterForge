name: WF One-Shot Exact Real G Cross-Source Reader MOVE_ON Metadata Replay No Model 20261025
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_REAL_OPERA_CROSS_SOURCE_RECEIPT_ZERO_MODEL_ONCE_20261025.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-opera-cross-source-original-reader-keep-offline-20261025
  cancel-in-progress: false
jobs:
  preserve-old-real-reader-and-author-hypotheses:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use original WF source validation, no model secrets
        run: python -m pip install -e '.[r2]'
      - name: Offline source SHA, prior/current quote and binding guard
        run: PYTHONPATH=tests python -m unittest tests.test_wf_real_opera_cross_source_writer tests.test_wf_writer_source_identity_binding -q
      - name: Download G initial original chapter and its 7 authentic provider wires
        uses: actions/download-artifact@v4
        with:
          name: WF-New-Actual-G-Author-Control-vs-Reader-First-20261025
          run-id: 40110957161
          github-token: ${{ github.token }}
          path: wf_real_opera_previous_20261025
      - name: Download original real signed previous chapter reader/author replies
        uses: actions/download-artifact@v4
        with:
          name: WF-Real-Opera-Signed-Prior-Chapter-Reader-Originals-20261025
          run-id: 40151857245
          github-token: ${{ github.token }}
          path: wf_prior_opera_cross_source_20261025
      - name: Read-only source-authenticated old author MOVE_ON, no new inference
        run: python -m experiments.wf_real_opera_cross_source_zero_model_receipt_20261025
      - name: Keep proven source and unproven reader hypotheses distinct
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('wf_real_opera_cross_source_reader_keep_zero_model_20261025/STATUS.json').read_text('utf8'))
          assert s['new_real_provider_calls']==0
          assert s['old_model_author_action']=='MOVE_ON'
          assert s['source_anchored_prior_current_hypotheses']==3
          assert s['hypotheses_were_not_confirmed_as_story_fact'] is True
          assert s['no_automatic_canon_or_repair'] is True
          assert s['same_old_model_reply_not_rewritten'] is True
          print('REAL OLDER DEEPSEEK CHOSE MOVE_ON; 3 UNCONFIRMED CROSS-CHAPTER ISSUES REMAIN IN REVIEW METADATA')
          PY
      - name: Preserve original model JSON, source hashes and derived metadata separately
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Opera-Real-Cross-Source-Author-MOVE_ON-3-Unverified-Review-Links-20261025
          path: wf_real_opera_cross_source_reader_keep_zero_model_20261025/
          retention-days: 30
          if-no-files-found: warn
