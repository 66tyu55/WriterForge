name: WF V29 real three-topic unreviewed R2 evidence one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-story-context-candidates-r2-once.yml'
permissions:
  contents: read
jobs:
  purely-offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Verify stored report contract and fail-closed negative evidence handling
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v29_original_context_r2_import.py -q
          python -m unittest discover -s tests -p test_v28_story_context_evidence.py -q
      - name: Fresh GET true 3-scenario R2 audit and save immutable unreviewed candidate
        run: python -m scripts.import_v29_original_story_context_r2
