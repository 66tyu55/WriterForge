name: V38 genuine L2 postwriting learning-transfer missing-evidence R2 audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-historical-l2-gate-once.yml'
permissions:
  contents: read
jobs:
  prove-real-learning-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Regression: existing final review gate now checks every learned source-linked angle
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v38_lesson_transfer_bridge.py -q
          python -m unittest discover -s tests -p test_v37_foreshadowing_evidence_gate.py -q
          python -m unittest discover -s tests -p test_v36_real_trace_debugger.py -q
      - name: Actual frozen Xi You Ji historical L2 missing evidence MUST be rejected and privately logged
        run: python -m scripts.audit_v38_actual_l2_gate
