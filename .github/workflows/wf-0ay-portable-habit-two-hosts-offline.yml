name: WF 0.AY Portable Cognitive Habit Two Host Envelopes and Safety OFFLINE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .agents/skills/observe-before-next-choice/**
      - tests/test_wf_0ay_portable_habit_first_life.py
      - tests/test_wf_0av_g_writer_original_prose_at_prose_stage.py
      - writerforge/v98_rolling_causal_planner.py
      - writerforge/writing_assist.py
      - .github/workflows/wf-0ay-portable-habit-two-hosts-offline.yml

permissions:
  contents: read

concurrency:
  group: wf-0ay-portable-habit-offline-safety
  cancel-in-progress: true

jobs:
  verify-host-neutral-habit-and-full-WF:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only development branch source
        run: python -m pip install -e '.[r2,evidence]'
      - name: Compile portable script and original V98/writing modules
        run: |
          python -m py_compile .agents/skills/observe-before-next-choice/scripts/portable.py
          python -m py_compile writerforge/v98_rolling_causal_planner.py writerforge/writing_assist.py
      - name: Verify skill package, frozen capsule, self-contained CLI, two adapters and poisoned-source fail-close
        run: python -m unittest discover -s tests -p 'test_wf_0ay_portable_habit_first_life.py' -v
      - name: Verify original B++ RED repaired without a new model call
        run: python -m unittest discover -s tests -p 'test_wf_0av_g_writer_original_prose_at_prose_stage.py' -v
      - name: All preexisting WriterForge regressions including new tests
        run: python -m unittest discover -s tests -q
      - name: Freeze development capsule digest as transparent CI artifact, not literary proof
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          p=Path(".agents/skills/observe-before-next-choice/capsule.json")
          s=sha256(p.read_bytes()).hexdigest()
          Path("wf_0ay_portable_habit_offline_status.json").write_text(
              json.dumps({"format":"wf.0ay.portable-habit-offline.v1",
                          "capsule_sha256":s,"two_real_models_tested":False,
                          "provider_calls":0,"literary_quality_proven":False,
                          "R2_reads":0,"R2_writes":0,"Canon_writes":0},
                         ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("WF0AY_COGNITIVE_HABIT_UNCHANGED_CORE",s,"ZERO_PROVIDER")
          PY
      - name: Preserve offline status, if available, without user fiction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AY-Portable-Cognitive-Habit-Offline-Digest-Only
          path: wf_0ay_portable_habit_offline_status.json
          retention-days: 90
          if-no-files-found: warn
