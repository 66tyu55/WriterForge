name: V29 real semantic positive-negative anti-regression private R2 backfill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-real-semantic-regression-r2-once.yml'
permissions:
  contents: read
jobs:
  actual-proof-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Assert true-score SHA invariants and no false literary promotion
        run: |
          python -m unittest discover -s tests -p test_v29_semantic_anti_regression.py -q
          python -m unittest discover -s tests -p test_v29_recovered_holdout_audit.py -q
      - name: R2 double-read old/new context observations, zero model calls
        run: python -m scripts.import_v29_semantic_anti_regression_r2
