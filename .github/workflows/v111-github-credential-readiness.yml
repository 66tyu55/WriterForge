name: V111 GitHub independent credential readiness (never paid)
on:
  push:
    branches: [v111-matched-fantasy-chase-wf-vs-github-skill]
    paths:
      - '.github/workflows/v111-github-credential-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK__API__KEY: ${{ secrets.DEEPSEEK__API__KEY }}
      DISCOVERY__API__KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WF_API_TOKEN: ${{ secrets.WF_API_TOKEN }}
      WF_INDEX_UPLOAD_TOKEN: ${{ secrets.WF_INDEX_UPLOAD_TOKEN }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Report ONLY Boolean presence; no network calls, no secret values
        shell: bash
        run: |
          set -euo pipefail
          for key in DEEPSEEK_API_KEY DEEPSEEK__API__KEY DISCOVERY__API__KEY WF_API_TOKEN WF_INDEX_UPLOAD_TOKEN WRITERFORGE_R2_ACCOUNT_ID WRITERFORGE_R2_BUCKET WRITERFORGE_R2_ACCESS_KEY_ID WRITERFORGE_R2_SECRET_ACCESS_KEY; do
            if [[ -n "${!key}" ]]; then
              echo "${key}: AVAILABLE"
            else
              echo "${key}: MISSING"
            fi
          done
          echo "No model or storage request was made."
