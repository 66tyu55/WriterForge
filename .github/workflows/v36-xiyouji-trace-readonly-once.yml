name: V36 actual Xi You Ji prewrite versus draft read-only breakpoint audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v36-xiyouji-trace-readonly-once.yml'
permissions:
  contents: read
jobs:
  provenance-only-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Recheck every synthetic source lesson prewrite draft aftercheck boundary
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v36_real_trace_debugger.py -q
          python -m unittest discover -s tests -p test_v35_xiyouji_observable.py -q
      - name: Fresh GET actual 6 signed original stages and append-only 4 exact-quote reviews
        run: python -m scripts.debug_v36_xiyouji_learning_to_writing
