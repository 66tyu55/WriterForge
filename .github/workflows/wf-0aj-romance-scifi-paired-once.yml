name: WF 0.AJ Romance and Space Disaster Two Original Micro Pairs ONCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AJ_ROMANCE_SCIFI_FIRST_FIRE_ONCE_20261025.txt

permissions:
  contents: read

concurrency:
  group: wf-0aj-romance-scifi-source-locked-micro-two-once
  cancel-in-progress: false

jobs:
  third-batch-two-original-genre-writers:
    if: >-
      github.repository == '66tyu55/WriterForge' &&
      github.ref_name == 'refactor-unified-scene-delivery-audit' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'experiment(0.AJ): FIRE TWO NEW GENRES NO REPEATED AUTHORS'
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WriterForge dependencies only
        run: python -m pip install -e '.[r2]'
      - name: Strict one-shot trigger and no R2 or other provider configuration
        run: |
          test "$(cat experiments/WF_0AJ_ROMANCE_SCIFI_FIRST_FIRE_ONCE_20261025.txt)" = "WF0AJ_ROMANCE_SPACE_DISASTER_TWO_AUTHOR_PAIRS_SOURCE_LOCKED_NO_RETRY"
          python - <<'PY'
          import os
          assert not any(os.getenv(name) for name in (
              'WRITERFORGE_R2_ACCOUNT_ID','WRITERFORGE_R2_ACCESS_KEY_ID',
              'DISCOVERY_API_KEY','OPENAI_API_KEY','OPENROUTER_API_KEY'))
          PY
      - name: Complete 0.AI software RED GREEN and all earlier provenance tests BEFORE a model
        run: python -m unittest discover -s tests -q
      - name: DeepSeek Flash same prompt goal, same author 1400-token output cap, at most eight new calls
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0aj_diverse_micro_paired_20261025
      - name: Check true original SHA, no repeated author and compare two objective ratings
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          d=Path('wf_0aj_diverse_micro_batch3_20261025')
          data=json.loads((d/'STATUS.json').read_text('utf8'))
          assert data['format']=='wf.0aj.third-new-diverse-micro-two-paired.v1'
          assert data['first_batch']==['romance_photos','scifi_airlock']
          assert data['same_model']=='deepseek-flash'
          assert data['same_author_max_tokens']==1400
          assert data['reserved_output_cap']==12000
          assert 0<data['actual_model_calls']<=8
          assert data['R2_reads']==data['R2_writes']==data['Canon_writes']==0
          assert data['Railway_deployments']==0 and not data['main_modified']
          assert data['prior_0AD_0AE_author_calls_repeated']==0
          assert data['no_second_author_call_or_retries']
          for event in data['provider_calls']:
              if event.get('original_wire_preserved'):
                  path=d/'provider-originals'/(event['task']+'.json')
                  assert sha256(path.read_bytes()).hexdigest()==event['raw_provider_sha256']
          for key,row in data['cases'].items():
              print('SCENE',key,'status',row.get('status'),
                    'length',row.get('bare_codepoints'),row.get('WF_codepoints'),
                    'grade WF-minus-bare',row.get('WF_minus_bare'),
                    'comparability',row.get('comparison_confidence'),
                    'V96',row.get('WF_source_checks',{}).get('V96_status'))
          assert len(data['cases'])==2
          assert all(case['original_writer_ready'] for case in data['cases'].values()), \
              'Partial author originals remain signed, no retry'
          assert all(case['scores_ready'] for case in data['cases'].values()), \
              'Original judge errors preserved; never retry authors'
          PY
      - name: Preserve each true DeepSeek provider envelope even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AJ-Romance-SpaceDisaster-New-Writer-Wires-Source-Audit-And-Real-Blind-Scores
          path: wf_0aj_diverse_micro_batch3_20261025/
          retention-days: 90
          if-no-files-found: warn
