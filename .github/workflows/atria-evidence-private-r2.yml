name: WF Preserve Original Atria Evidence to Private R2
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/atria-evidence-private-r2.yml
      - scripts/preserve_atria_artifacts_r2.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-atria-evidence-private-r2
  cancel-in-progress: false
jobs:
  preserve-sealed-originals:
    if: github.repository == '66tyu55/WriterForge'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm no model API credentials present
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY","DEEPSEEK_API_KEY","OPENAI_API_KEY","OPENROUTER_API_KEY"))'
      - name: Install private-storage SDK and GitHub artifact client
        run: python -m pip install -e '.[r2]' requests
      - name: Read nine sealed artifacts and verify new private R2 immutable SHA snapshots
        run: python -m scripts.preserve_atria_artifacts_r2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Atria-Private-R2-Archive-Status-Only
          path: wf_atria_private_evidence_status/STATUS.json
          retention-days: 14
          if-no-files-found: ignore
