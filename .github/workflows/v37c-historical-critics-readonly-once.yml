name: V37c real historical L2 critic replies lossless strict metadata recheck
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v37c-historical-critics-readonly-once.yml'
permissions:
  contents: read
jobs:
  old-original-answers-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Prove no fabricated score, existing raw short uncertainties and exact long citations
        run: python -m unittest discover -s tests -p test_v37c_revalidate.py -q
      - name: Private R2 actual four existing raw reviews strictly revalidate no network model
        run: python -m scripts.revalidate_v37c_l2_historical_reviews
