name: Private reading R2 legacy migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-reading-r2-migration.yml'

permissions:
  contents: read

concurrency:
  group: private-reading-r2-legacy-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R2 client
        run: python -m pip install -e ".[r2]"
      - name: Source R2 object to versioned private archive and recover
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
        run: |
          test "$WRITERFORGE_R2_BUCKET" = "writerforge-private-library"
          python scripts/migrate_uploaded_private_reading.py
