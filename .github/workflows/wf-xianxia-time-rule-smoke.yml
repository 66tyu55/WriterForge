name: WF Xianxia Independent Time Rule Smoke

on:
  push:
    branches: [feature/wf-xianxia-time-rule-20261113, feature/wf-temporal-parameter-original-training-20261113]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  time-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Legacy v1 remains unchanged as historical baseline
        run: python -m unittest discover -s tests -p 'test_wf_xianxia_time_rule.py' -v
      - name: V2 independent-clock and one-parameter ablations
        run: python -m unittest discover -s tests -p 'test_wf_xianxia_time_v2*.py' -v
      - name: V3 original temporal parameter source-mapping regressions
        run: python -m unittest discover -s tests -p 'test_wf_xianxia_time_v3*.py' -v
      - name: V4 event-first parameter ablation and no-future leak regressions
        run: python -m unittest discover -s tests -p 'test_wf_xianxia_time_v4*.py' -v
      - name: Event-first autonomous candidate discovery preflight
        run: |
          python -m unittest discover -s tests -p 'test_wf_time_event_first_autodiscovery.py' -v
          python experiments/wf_time_event_first_autonomous_once.py --dry-run
      - name: Source-local parameter change/revision checks
        run: python -m unittest discover -s tests -p 'test_wf_time_event_source_delta.py' -v
