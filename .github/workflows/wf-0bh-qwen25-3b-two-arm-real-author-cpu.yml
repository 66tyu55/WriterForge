name: WF 0.BH Real Qwen2.5 3B CPU author A/B - SIX new texts NO API

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bh-qwen25-3b-two-arm-real-author-cpu.yml
      - experiments/wf_0bh_stronger_local_writer_once.py
      - tests/test_wf_0bh_stronger_local_author.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bh-qwen-3b-only-six-frozen-cpu-calls
  cancel-in-progress: true

jobs:
  actual-3b-local-author-six-unreviewed-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check no provider tokens and no private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install repository offline tests only
        run: python -m pip install -e '.[r2,evidence]'
      - name: Test fail-first actual strong CPU model boundary and source identity
        run: python -m unittest discover -s tests -p 'test_wf_0bh_stronger_local_author.py' -v
      - name: Install fixed local llama CPP engine, no model provider
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python -m pip install 'llama-cpp-python==0.3.16'
      - name: Download SHA pinned Qwen2.5 3B from fixed Hugging Face commit
        run: |
          curl --fail --show-error --location --connect-timeout 30 --max-time 720 \
            --output "$RUNNER_TEMP/wf0bh-qwen25-3b.gguf" \
            "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/254600e47ea694216f6108325376ce5b35d456a1/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          printf '%s  %s\n' \
            '9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94' \
            "$RUNNER_TEMP/wf0bh-qwen25-3b.gguf" | sha256sum --check --status
      - name: Generate six real original same-model new-task v1-v2 comparisons
        run: |
          python -m experiments.wf_0bh_stronger_local_writer_once \
            --model "$RUNNER_TEMP/wf0bh-qwen25-3b.gguf"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("wf0bh_real_qwen25_3b_three_fresh_pairs/STATUS.json")
          s=json.loads(p.read_text("utf-8"))
          assert s["status"]=="LOCAL_STRONGER_MODEL_COMPLETED_UNGRADED"
          assert s["evidence_class"]=="REAL_LOCAL_OPEN_WEIGHT_GENERATION"
          assert s["completed_calls"]==6 and s["failed_calls"]==0
          assert len(s["records"])==6
          assert s["new_paid_provider_calls"]==0
          assert s["trusted_independent_reader_votes"]==0
          assert s["independent_literary_gain_proven"] is False
          assert s["production_skill_activation"] is False
          print("WF0BH_REAL_3B_AUTHOR_SIX_COMPLETIONS",len(s["records"]),flush=True)
          PY
      - name: Retrieve actual frozen historical source required by old regression
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Whole WriterForge source-locked offline regression
        run: python -m unittest discover -s tests -q
      - name: Preserve COMPLETE originals or documented partial failure; no automatic retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BH-REAL-Qwen25-3B-Six-New-Unreviewed-Writing-Outputs
          path: wf0bh_real_qwen25_3b_three_fresh_pairs/
          if-no-files-found: warn
          retention-days: 90
