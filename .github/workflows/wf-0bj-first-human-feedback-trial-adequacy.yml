name: WF 0.BJ Human Pilot Shows Trial Invalidity - NO MODEL OR READER2

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bj-first-human-feedback-trial-adequacy.yml
      - experiments/wf_0bj_reader_trial_validity_gate.py
      - tests/test_wf_0bj_trial_adequacy_and_single_review_stop.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bj-stop-invalid-human-trial
  cancel-in-progress: true

jobs:
  stop-before-wasting-second-human-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse provider and private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Offline source verifier only
        run: python -m pip install -e '.[r2,evidence]'
      - name: RED first GREEN afterward validate review-trial source adequacy
        run: python -m unittest discover -s tests -p 'test_wf_0bj_trial_adequacy_and_single_review_stop.py' -v
      - name: Audit real model source without second reader or inference
        run: python -m experiments.wf_0bj_reader_trial_validity_gate
      - name: Frozen 0.AY original provider wires for existing unrelated tests
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full existing WriterForge regression - zero new models
        run: python -m unittest discover -s tests -q
      - name: Upload source-only stop, no human votes or model text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BJ-STOP-Invalid-Blind-Trial-Not-v2-Quality-Grade
          path: wf0bj_source_only_trial_stop/
          retention-days: 90
          if-no-files-found: warn
