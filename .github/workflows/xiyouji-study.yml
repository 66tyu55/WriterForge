name: 西遊記原著100回学习验收

on:
  pull_request:
    paths:
      - "writerforge/**"
      - "scripts/xiyouji_pilot.py"
      - ".github/workflows/xiyouji-study.yml"
  push:
    branches: [main]
    paths:
      - "writerforge/**"
      - "scripts/xiyouji_pilot.py"
      - ".github/workflows/xiyouji-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-original-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install WriterForge
        run: python -m pip install -e .
      - name: Download Gutenberg Chinese ORIGINAL and provenance license
        run: |
          python -m writerforge.cli fetch-xiyouji --output "$RUNNER_TEMP/xiyouji_23962_original.txt"
          curl --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/GITenberg/---_23962/master/LICENSE" \
            -o "$RUNNER_TEMP/PROJECT_GUTENBERG_LICENSE.txt"
      - name: Sequentially study all 100 original chapters and reopen the DB
        run: |
          python scripts/xiyouji_pilot.py \
            "$RUNNER_TEMP/xiyouji_23962_original.txt" \
            "$RUNNER_TEMP/xiyouji_studied.sqlite3" \
            "$RUNNER_TEMP/xiyouji_results"
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/xiyouji_studied.sqlite3" status
      - name: Package original source, verified SQLite and trace
        run: |
          mkdir -p "$RUNNER_TEMP/xiyouji_bundle"
          cp "$RUNNER_TEMP/xiyouji_23962_original.txt" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/xiyouji_studied.sqlite3" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/PROJECT_GUTENBERG_LICENSE.txt" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/xiyouji_results/"* "$RUNNER_TEMP/xiyouji_bundle/"
      - uses: actions/upload-artifact@v6
        with:
          name: xiyouji-original-100-chapters-trained-structural
          path: ${{ runner.temp }}/xiyouji_bundle/
          if-no-files-found: error
          retention-days: 30
