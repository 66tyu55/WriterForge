name: 西遊記原著100回学习验收

on:
  pull_request:
    paths:
      - "writerforge/**"
      - "scripts/xiyouji_pilot.py"
      - "scripts/study_release.py"
      - "tests/test_v24_r2_storage.py"
      - ".github/workflows/xiyouji-study.yml"
  push:
    branches: [main]
    paths:
      - "writerforge/**"
      - "scripts/xiyouji_pilot.py"
      - "scripts/study_release.py"
      - "tests/test_v24_r2_storage.py"
      - ".github/workflows/xiyouji-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-original-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install WriterForge
        run: python -m pip install -e .
      - name: Download Gutenberg Chinese ORIGINAL and provenance license
        run: |
          python -m writerforge.cli fetch-xiyouji --output "$RUNNER_TEMP/xiyouji_23962_original.txt"
          curl --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/GITenberg/---_23962/master/LICENSE" \
            -o "$RUNNER_TEMP/PROJECT_GUTENBERG_LICENSE.txt"
      - name: Sequentially study all 100 original chapters and reopen the DB
        run: |
          python scripts/xiyouji_pilot.py \
            "$RUNNER_TEMP/xiyouji_23962_original.txt" \
            "$RUNNER_TEMP/xiyouji_studied.sqlite3" \
            "$RUNNER_TEMP/xiyouji_results"
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/xiyouji_studied.sqlite3" status
      - name: Package original source, verified SQLite and trace
        run: |
          mkdir -p "$RUNNER_TEMP/xiyouji_bundle"
          cp "$RUNNER_TEMP/xiyouji_23962_original.txt" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/xiyouji_studied.sqlite3" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/PROJECT_GUTENBERG_LICENSE.txt" "$RUNNER_TEMP/xiyouji_bundle/"
          cp "$RUNNER_TEMP/xiyouji_results/"* "$RUNNER_TEMP/xiyouji_bundle/"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: xiyouji-original-100-chapters-trained-structural
          path: ${{ runner.temp }}/xiyouji_bundle/
          if-no-files-found: error
          retention-days: 3

  publish-verified-study:
    # PRs NEVER get a write token. Only verified main branch builds may publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: full-original-study
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: writerforge-xiyouji-study-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install WriterForge
        run: python -m pip install -e .
      - name: Retrieve verified temporary study output
        uses: actions/download-artifact@v8
        with:
          name: xiyouji-original-100-chapters-trained-structural
          path: ${{ runner.temp }}/learned/
      - name: Build versioned and checksummed study package
        id: pack
        run: |
          python scripts/study_release.py pack \
            "$RUNNER_TEMP/learned" "$RUNNER_TEMP/release" \
            > "$RUNNER_TEMP/package-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"package-result.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("tag="+data["tag"]+"\n")
          print("Storage release tag:",data["tag"],"archive bytes:",data["compressed_bytes"])
          PY
      - name: Publish content-addressed corpus in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_TAG: ${{ steps.pack.outputs.tag }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/release/xuehai-xiyouji-23962-s1.bundle.zip"
          MANIFEST="$RUNNER_TEMP/release/xuehai-xiyouji-23962-s1.manifest.json"
          if gh release view "$STUDY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This study edition already exists. Keep original assets, never duplicate."
          else
            gh release create "$STUDY_TAG" "$BUNDLE" "$MANIFEST" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "学海原著：西遊記 100回 · 结构化学习 v1" \
              --notes "Project Gutenberg #23962 ORIGINAL Chinese, full license included. Verified 100-chapter structural study only; no language model fine-tuning, no verified literary critique. NEVER publish private manuscripts in this public data release."
          fi
          gh release view "$STUDY_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url: .url, asset_names: [.assets[].name]}'
      - name: Restore files from published Release and verify SQLite
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_TAG: ${{ steps.pack.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered-release"
          gh release download "$STUDY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/recovered-release" \
            --pattern "xuehai-xiyouji-23962-s1.bundle.zip" \
            --pattern "xuehai-xiyouji-23962-s1.manifest.json"
          python scripts/study_release.py verify \
            "$RUNNER_TEMP/recovered-release/xuehai-xiyouji-23962-s1.bundle.zip" \
            "$RUNNER_TEMP/recovered-release/xuehai-xiyouji-23962-s1.manifest.json" \
            "$RUNNER_TEMP/restored-study"
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/restored-study/xiyouji_studied.sqlite3" status
          # Test the exact one-command Python restore used on the author's PC,
          # not just the GitHub CLI artifact download.
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/working-from-release.sqlite3" \
            restore-xiyouji \
            --repo "$GITHUB_REPOSITORY" --tag "$STUDY_TAG" \
            --storage-dir "$RUNNER_TEMP/python-library"
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/working-from-release.sqlite3" status


  # Private backup is IN ADDITION to the existing, allowlisted public-domain
  # Gutenberg Release. Future private manuscripts are never sent to Releases.
  # Secrets are available only on trusted main, NEVER a PR or fork.
  private-r2-study-backup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: full-original-study
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: writerforge-private-r2-study
      cancel-in-progress: false
    steps:
      - name: Check optional Cloudflare R2 connection
        id: r2
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os,sys
          names=(
              "WRITERFORGE_R2_ACCOUNT_ID","WRITERFORGE_R2_BUCKET",
              "WRITERFORGE_R2_ACCESS_KEY_ID","WRITERFORGE_R2_SECRET_ACCESS_KEY"
          )
          configured=[bool(os.getenv(name)) for name in names]
          if any(configured) and not all(configured):
              print("R2 environment is partially configured; please complete all four GitHub Secrets.")
              sys.exit(1)
          ready="true" if all(configured) else "false"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("configured="+ready+"\n")
          print("Cloudflare R2 configured:",ready,
                "(account credentials are never printed)")
          PY
      - name: Show private R2 connection state
        if: steps.r2.outputs.configured != 'true'
        run: |
          {
            echo "### Cloudflare R2: NOT CONNECTED"
            echo ""
            echo "No private R2 upload or restore was performed in this run."
            echo "Check the four Repository Secrets in:"
            echo "Settings > Secrets and variables > Actions > Repository secrets."
            echo "Expected exact names:"
            echo "- WRITERFORGE_R2_ACCOUNT_ID"
            echo "- WRITERFORGE_R2_BUCKET"
            echo "- WRITERFORGE_R2_ACCESS_KEY_ID"
            echo "- WRITERFORGE_R2_SECRET_ACCESS_KEY"
            echo ""
            echo "Secrets in an Environment are not available unless the job binds that Environment."
            echo "Never paste the secret values into an Issue, PR, log, or chat."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: steps.r2.outputs.configured == 'true'
      - uses: actions/setup-python@v7
        if: steps.r2.outputs.configured == 'true'
        with:
          python-version: "3.11"
      - name: Install private R2 SDK
        if: steps.r2.outputs.configured == 'true'
        run: python -m pip install -e '.[r2]'
      - name: Retrieve validated 100-chapter original-text results
        if: steps.r2.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: xiyouji-original-100-chapters-trained-structural
          path: ${{ runner.temp }}/learned/
      - name: Back up verified original study to private Cloudflare R2
        if: steps.r2.outputs.configured == 'true'
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          set -euo pipefail
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/learned/xiyouji_studied.sqlite3" \
            backup-r2 --library xiyouji-23962 \
            --edition gutenberg23962-parser-v1 \
            --source "$RUNNER_TEMP/learned/xiyouji_23962_original.txt" \
            --extra report.json="$RUNNER_TEMP/learned/training_report.json" \
            --extra context.json="$RUNNER_TEMP/learned/verified_draft_context.json" \
            --extra ladder.json="$RUNNER_TEMP/learned/literary_ladder_readiness.json" \
            --extra license.txt="$RUNNER_TEMP/learned/PROJECT_GUTENBERG_LICENSE.txt" \
            --extra status.md="$RUNNER_TEMP/learned/TRAINING_STATUS.md"
      - name: Independently restore from R2 and verify 100 published chapters
        if: steps.r2.outputs.configured == 'true'
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          set -euo pipefail
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/new-working-from-r2.sqlite3" \
            restore-r2 --library xiyouji-23962 \
            --storage-dir "$RUNNER_TEMP/r2-library"
          python -m writerforge.cli \
            --db "$RUNNER_TEMP/new-working-from-r2.sqlite3" status
          python - <<'PY'
          import os,sqlite3
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"new-working-from-r2.sqlite3"
          with sqlite3.connect(path) as con:
              count=con.execute("SELECT COUNT(*) FROM studied_chapters").fetchone()[0]
              assert count == 100, f"R2 restore lost original chapters: {count}"
              assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          print("Private R2 remote round-trip: verified 100/100 original chapters.")
          PY
      - name: Summarize successful private R2 connection
        if: steps.r2.outputs.configured == 'true' && success()
        run: |
          {
            echo "### Cloudflare R2: CONNECTED"
            echo "Verified private upload and remote restore of all 100 original Chinese chapters."
            echo "SQLite quick_check: OK."
            echo "No credentials or secret contents were printed."
          } >> "$GITHUB_STEP_SUMMARY"
