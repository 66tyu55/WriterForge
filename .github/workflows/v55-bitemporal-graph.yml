name: V55 bitemporal fact and bounded graph evidence regression
on:
  push:
    branches: [v55-bitemporal-fact-projection]
    paths:
      - '.github/workflows/v55-bitemporal-graph.yml'
      - 'writerforge/fact_journal.py'
      - 'writerforge/cli.py'
      - 'tests/test_v55_bitemporal_graph.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: No-model source/time/replay/causal-hypothesis and tamper tests
        run: python -m unittest discover -s tests -p test_v55_bitemporal_graph.py -v
      - name: V54 old fact, consent and SQLite integration remains intact
        run: python -m unittest discover -s tests -p test_v54_consent_fact_core.py -q
