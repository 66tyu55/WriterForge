name: WF 0.AG First Three Diverse 200-350-Chinese-Character Author Micro Pairs ONCE
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AG_FIRST_THREE_GENRES_MICRO_ONCE_20261025.txt
permissions:
  contents: read
concurrency:
  group: wf-0ag-real-three-distinct-micro-same-cap-one-run
  cancel-in-progress: false
jobs:
  first-diverse-three-source-locked-micro-writers:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only existing WriterForge dependencies
        run: python -m pip install -e '.[r2]'
      - name: First full no-model source and real-batch protocol regression
        run: >
          PYTHONPATH=tests python -m unittest
          tests.test_wf_0ag_diverse_micro_paired_protocol
          tests.test_wf_0ag_v96_causal_false_green
          tests.test_wf_0ac_multigenre_narrative_stress
          tests.test_wf_0ad_multigenre_real_paired_protocol
          -q
      - name: Do not access copyrighted R2 books, Canon or other provider keys
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY","WRITERFORGE_R2_ACCOUNT_ID","WRITERFORGE_R2_ACCESS_KEY_ID","OPENAI_API_KEY","OPENROUTER_API_KEY"))'
      - name: Exactly the first three preregistered different original tasks, DeepSeek Flash only, 200-350 characters, 12 requests maximum and no retries
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0ag_diverse_micro_paired_20261025
      - name: Strictly expose actual original source, length, scores and limits without declaring literary promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('wf_0ag_diverse_micro_batch1_20261025/STATUS.json').read_text('utf8'))
          assert x['format']=='wf.0ag.first-new-diverse-micro-three-paired.v1'
          assert x['same_model']=='deepseek-flash'
          assert x['same_author_max_tokens']==1400
          assert x['reserved_output_cap']==18000
          assert x['frozen_ten_task_ids'] and len(x['frozen_ten_task_ids'])==10
          assert x['first_batch']==['wuxia_bridge','horror_flashlight','strategy_ledger']
          assert 0<x['actual_model_calls']<=12
          assert x['R2_reads']==x['R2_writes']==x['Canon_writes']==0
          assert x['Railway_deployments']==0 and not x['main_modified']
          assert x['prior_0AD_0AE_author_calls_repeated']==0
          assert x['same_family_rater_not_human'] and x['no_second_author_call_or_retries']
          print('PAID NEW CALLS:',x['actual_model_calls'],'STATUS:',x['status'])
          for k,v in x['cases'].items():
              print(k,v.get('status'),v.get('WF_minus_bare'),
                    v.get('comparison_confidence'),
                    v.get('WF_source_checks',{}).get('V96_causal_relation'))
          assert len(x['cases'])==3,'incomplete three genres: original evidence still uploaded'
          PY
      - name: Preserve provider wire FIRST, all three pairs, blind ratings and any red cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AG-First-Three-PreRegistered-Genres-Real-200to350-Chars-Wires-Scores
          path: wf_0ag_diverse_micro_batch1_20261025/
          retention-days: 30
          if-no-files-found: warn
