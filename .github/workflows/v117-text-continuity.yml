name: V117 pinned Novel Studio longform continuity zero-model gate
on:
  push:
    branches: [v117-novel-studio-longform-continuity]
    paths:
      - .github/workflows/v117-text-continuity.yml
      - writerforge/v117_continuity_trace.py
      - writerforge/v117_continuity_debts.py
      - writerforge/v114_external_story_state.py
      - writerforge/writing_assist.py
      - experiments/v117_novel_studio/**
      - experiments/v117_readonly_original_text_trace.py
      - tests/test_v117_continuity_trace.py
permissions:
  contents: read
concurrency:
  group: wf117-longform-source-only
  cancel-in-progress: false
jobs:
  no-secret-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[r2]'
      - name: Full existing WF suite plus pinned OSS SHA regressions, no API keys
        run: python -m unittest discover -s tests -q
  real-sealed-source-readonly:
    if: github.repository == '66tyu55/WriterForge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify that there is no model call credential
        run: |
          test -z "${DEEPSEEK:-}"
          test -z "${DEEPSEEK_API_KEY:-}"
      - run: python -m pip install -e '.[r2]'
      - name: Real V113 and V114B immutable CAS read-only cold continuity audit
        run: python -m experiments.v117_readonly_original_text_trace
      - uses: actions/upload-artifact@v4
        with:
          name: V117-sealed-real-WF-source-state-cross-chapter-zero-model
          path: wf117_readonly_sealed_trace_audit/AUDIT_SUMMARY_NO_SOURCE_PROSE.json
          retention-days: 30
          if-no-files-found: error
