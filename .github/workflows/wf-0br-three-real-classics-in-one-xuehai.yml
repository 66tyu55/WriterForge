name: WF 0.BR Real Classical and Original Literary Prose in One Xuehai - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0br-three-real-classics-in-one-xuehai.yml
      - experiments/wf_0br_three_classics_contiguous_prose_details_20261028.json
      - experiments/wf_0br_merge_three_classics_with_original_xuehai.py
      - experiments/wf_0bq_full_literary_detail_corpus_A_20261028.json
      - experiments/wf_0bq_full_literary_detail_corpus_B_20261028.json
      - experiments/wf_0bq_stage_original_full_detail_prose.py
      - tests/test_wf_0br_real_three_classics_and_original_prose_in_one_xuehai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0br-real-literary-prose-in-one-xuehai
  cancel-in-progress: true

jobs:
  actual-classical-original-prose-content:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use existing Xuehai without remote author-model packages
        run: python -m pip install -e .
      - name: Fetch only three pinned public-domain classical originals
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from experiments.wf_0br_merge_three_classics_with_original_xuehai import download_only_three_pinned_public_sources
          path=Path(os.environ["RUNNER_TEMP"])/"wf0br-three-original-public-books"
          evidence=download_only_three_pinned_public_sources(source_dir=path)
          assert len(evidence["sources_verified"])==3
          assert evidence["paid_author_model_requests"]==0
          print("WF0BR_THREE_EXACT_PUBLIC_CLASSICAL_SOURCE_FILES_PRESENT",flush=True)
          PY
      - name: Test 48 real full pieces in SAME existing Xuehai and 6 read examples
        env:
          WF0BR_PINNED_PUBLIC_SOURCE_DIR: ${{ runner.temp }}/wf0br-three-original-public-books
        run: python -m unittest discover -s tests -p 'test_wf_0br_real_three_classics_and_original_prose_in_one_xuehai.py' -v
      - name: Actual literary source/content import to one isolated SQLite
        run: |
          python -m experiments.wf_0br_merge_three_classics_with_original_xuehai \
            --db "$RUNNER_TEMP/wf0br-48-texts.sqlite" \
            --source-dir "$RUNNER_TEMP/wf0br-three-original-public-books" \
            --preview-within-disposable-db > "$RUNNER_TEMP/wf0br-source-and-literary-content-receipt.json"
          python - <<'PY'
          from pathlib import Path
          import json,os,sqlite3
          root=Path(os.environ["RUNNER_TEMP"])
          receipt=json.loads((root/"wf0br-source-and-literary-content-receipt.json").read_text("utf8"))
          assert receipt["existing_original_xuanhuan_scenes"]==24
          assert receipt["new_actual_classical_prose_passages"]==24
          assert receipt["total_complete_prose_passages"]==48
          assert receipt["total_prose_chars"]==19834
          assert receipt["new_paid_author_model_requests"]==0
          assert receipt["new_classic_method_cards"]==0
          assert receipt["production_canon_writes"]==0
          assert receipt["real_literary_improvement_proven"] is False
          assert len(receipt["isolated_read_test"]["queries"])==6
          with sqlite3.connect(root/"wf0br-48-texts.sqlite") as con:
              assert con.execute("SELECT COUNT(*) FROM xuehai_entries WHERE source_role='original_complete_scene_unreviewed'").fetchone()[0]==24
              assert con.execute("SELECT COUNT(*) FROM xuehai_entries WHERE source_role='public_domain_continuous_detail_prose_unreviewed'").fetchone()[0]==24
              assert con.execute("SELECT COUNT(*) FROM xuehai_method_cards").fetchone()[0]==0
              assert con.execute("SELECT COUNT(*) FROM accepted_prose").fetchone()[0]==0
          print("WF0BR_REAL_PROSE_3_CLASSICS_24_AND_ORIGINAL_24_IN_ONE_XUEHAI_GREEN",flush=True)
          print("Whole Chinese literary excerpts:",receipt["total_complete_prose_passages"])
          print("Text characters stored:",receipt["total_prose_chars"])
          print("Actual author model requests:",receipt["new_paid_author_model_requests"])
          PY
      - name: Preserve only source and content manifest, not full book or private DB
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BR-48-REAL-LITERARY-PROSE-SOURCE-CONTENT-RECEIPT
          path: ${{ runner.temp }}/wf0br-source-and-literary-content-receipt.json
          retention-days: 7
          if-no-files-found: error
