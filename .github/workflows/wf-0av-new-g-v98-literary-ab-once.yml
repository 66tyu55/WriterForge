name: WF 0.AV NEW Waterworks Same DeepSeek G vs G+V98 Literary A-B ONCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/wf_0av_new_waterworks_g_v98_real_literary_ab_once_20261026.py
      - experiments/WF_0AV_NEW_WATERWORKS_G_V98_LIVE_ONCE_20261026.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0av-fresh-waterworks-only-source-locked-writer-prose-ab
  cancel-in-progress: false

jobs:
  no-model-source-preflight:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WF only
        run: python -m pip install -e '.[r2]'
      - name: Check syntax, source gate and no default G promotion
        run: |
          python -m py_compile experiments/wf_0av_new_waterworks_g_v98_real_literary_ab_once_20261026.py
          python -m experiments.wf_0av_new_waterworks_g_v98_real_literary_ab_once_20261026 --preflight
      - name: Full zero-model regression before charging existing author
        run: python -m unittest discover -s tests -q

  bounded-new-provider-literary-ab:
    needs: [no-model-source-preflight]
    if: >-
      github.repository == '66tyu55/WriterForge' &&
      github.ref_name == 'refactor-unified-scene-delivery-audit' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'experiment(0.AV): CONTINUE FROM EIGHT IMMUTABLE DEEPSEEK AUTHOR WIRES AFTER V98 FIX ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WF without deploying
        run: python -m pip install -e '.[r2]'
      - name: Prove exact one-shot and no R2 or other model credentials
        run: |
          test "$(cat experiments/WF_0AV_NEW_WATERWORKS_G_V98_LIVE_ONCE_20261026.txt)" = "WF0AV_SOURCE_LOCKED_EIGHT_OLD_PROVIDER_WIRES_WRITER_OWNED_V98_NEXT"
          python - <<'PY'
          import os
          assert not any(os.environ.get(k) for k in (
              'WRITERFORGE_R2_ACCOUNT_ID','WRITERFORGE_R2_ACCESS_KEY_ID',
              'OPENAI_API_KEY','DISCOVERY_API_KEY','OPENROUTER_API_KEY'))
          print("0.AV: no R2, other vendor or user original.")
          PY
      - name: Restore original TWO paid DeepSeek response wires from FAILED first run (no reauthor)
        uses: actions/download-artifact@v4
        with:
          run-id: 40283464818
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          github-token: ${{ github.token }}
          path: wf0av_prior_failed_source
      - name: Restore real paragraph THREE, paid once but refused by old V120
        uses: actions/download-artifact@v4
        with:
          run-id: 40285930972
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          github-token: ${{ github.token }}
          path: wf0av_third_paid_source
      - name: Restore original fourth and fifth DeepSeek prose; actual V118 failed only AFTER these
        uses: actions/download-artifact@v4
        with:
          run-id: 40286835621
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          github-token: ${{ github.token }}
          path: wf0av_fifth_paid_source
      - name: Restore sixth true author paragraph from the rejected old scene-delivery gate; no repayment
        uses: actions/download-artifact@v4
        with:
          run-id: 40287701471
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          github-token: ${{ github.token }}
          path: wf0av_sixth_paid_source
      - name: Restore genuine A fifth prose and B author-selected V98 replan from latest RED
        uses: actions/download-artifact@v4
        with:
          run-id: 40294657373
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          github-token: ${{ github.token }}
          path: wf0av_seventh_eighth_source
      - name: Source-only preflight the original paid RED model plan after V96 fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from writerforge.v96_causal_turns import parse_turn_outline
          from writerforge.writing_assist import _normalize_optional_model_craft_labels
          from hashlib import sha256
          root=Path("wf0av_prior_failed_source")
          source=(root/"A"/"original-provider-wires"/"02-paid.json").read_bytes()
          assert sha256(source).hexdigest()=="f7b64df21080e7a196dc9e8babaebe94bb267a232ec1a9e2061c3d4598572ca4"
          original=json.loads(source)["choices"][0]["message"]["content"]
          normalized,receipt=_normalize_optional_model_craft_labels(original)
          turns=parse_turn_outline(normalized)
          assert len(turns)==5 and turns[3]["kind"]=="interiority"
          assert turns[0]["actor"]=="林槐/许照"
          from writerforge.narrative_core import new_graph,schedule
          graph=new_graph(project_id="0av-real-wire-actor-preflight",
                          scene_id="nightvalve",chapter_index=0)
          duet=schedule(graph,project_id="0av-real-wire-actor-preflight",
                        scene_id="nightvalve",chapter_index=1,beat=turns[0])
          inside=schedule(graph,project_id="0av-real-wire-actor-preflight",
                          scene_id="nightvalve",chapter_index=1,beat=turns[3])
          assert duet["ensemble_source_actor_labels"]==["林槐","许照"]
          assert inside["model_calls"]==duet["model_calls"]==0
          assert duet["canon_writes"]==inside["canon_writes"]==0
          from writerforge.v120_plan_prose_gate import compare_plan_to_prose
          third=Path("wf0av_third_paid_source/A/original-provider-wires/03-paid.json").read_bytes()
          assert sha256(third).hexdigest()=="7b776a0277ae8721af6c689b87da7962d9012b24751de1b76454052dc8c62de3"
          authored=json.loads(json.loads(third)["choices"][0]["message"]["content"])
          receipt=compare_plan_to_prose(
              project_id="0av-real-wire-preflight",scene_id="nightvalve",
              beat=turns[0],prose=authored["prose"],cast=("林槐","许照"))
          assert receipt["status"]=="UNPROVEN" and receipt["coverage"]=="NON_STATEFUL_BEAT"
          assert receipt["canon_writes"]==receipt["model_calls"]==0
          print("REAL PROVIDER PLAN/PROSE PASSES V96 CORE V120: NO REWRITE, NO MODEL CALL")
          PY
      - name: Confirm all EIGHT original provider messages; A whole chapter and B real author plan; zero model calls
        run: python -m experiments.wf_0av_new_waterworks_g_v98_real_literary_ab_once_20261026 --source-eight-preflight
      - name: Same DeepSeek Flash authors two G paths with true source locked prefix
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0av_new_waterworks_g_v98_real_literary_ab_once_20261026
      - name: Validate real provider SHA, source progress and cost
        if: success()
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          root=Path("wf_0av_new_waterworks_g_v98_real_literary_ab_20261026")
          data=json.loads((root/"STATUS.json").read_text("utf8"))
          assert data["status"] in (
              "TWO_REAL_AUTHOR_BRANCHES_COMPLETED",
              "TWO_ARMS_TWO_BLIND_ORDER_REPORTS",
              "TWO_ARMS_GRADED_PARTIAL_NO_RETRY")
          assert data["provider_calls"]<=18
          assert data["provider_completion_tokens_reserved"]<=34000
          assert data["total_paid_calls_including_original_red"]<=26
          assert data["total_reserved_tokens_including_original_red"]<=44000
          assert data["R2_reads"]==data["R2_writes"]==data["Canon_writes"]==0
          assert not data["main_modified"] and data["Railway_deployments"]==0
          for side in ("A","B"):
              for row in data[side+"_wire_events"]:
                  if row["paid_call"] and row["saved_before_json_decode"]:
                      p=(root/side/"original-provider-wires"/
                         f"{row['index']:02d}-paid.json")
                      assert sha256(p.read_bytes()).hexdigest()==row["wire_sha256"]
          print("WF0AV VERIFIED ACTUAL NEW AUTHOR AB",data["status"])
          print("WF0AV REPLANS",data["comparison"]["B_actual_source_anchored_replans"])
          print("WF0AV SKIPS",data["comparison"]["B_source_only_skips"])
          print("WF0AV LENGTH COMPARABLE",data["comparison"]["length_comparable"])
          PY
      - name: Keep exact original wires and failure evidence also on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AV-New-Waterworks-Same-DeepSeek-G-Versus-G-V98-Real-Wires-And-Blind-Grades
          path: |
            wf_0av_new_waterworks_g_v98_real_literary_ab_20261026/
            wf0av_source_eight_offline_validation_only/
          retention-days: 90
          if-no-files-found: warn
