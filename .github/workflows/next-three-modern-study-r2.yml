name: WriterForge next three PRIVATE-R2 originals structural study
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/next-three-modern-study-r2.yml'
      - 'writerforge/modern_volumes.py'
      - 'writerforge/modern_source.py'
      - 'scripts/learn_archived_modern_r2.py'
      - 'tests/test_v34_modern_volumes.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: writerforge-next-three-modern-structural-study
  cancel-in-progress: false

jobs:
  test-structural-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - run: python -m unittest discover -s tests -p test_v33_learn_archived_modern_r2.py -v
      - run: python -m unittest discover -s tests -p test_v34_modern_volumes.py -v

  read-structurally-and-fresh-r2-verify:
    needs: test-structural-audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        work: [zhetian, manghuangji, qiumo]
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Restore pinned original from private R2 - audit grammar - sequential SQLite ingestion - fresh R2 recovery
        run: |
          set -euo pipefail
          python scripts/learn_archived_modern_r2.py --work "${{ matrix.work }}"
