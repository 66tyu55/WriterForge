name: V38 original student L2 proof vs independent critics location zero-model crosswalk
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-l2-self-vs-critics-readonly-once.yml'
permissions:
  contents: read
jobs:
  source-and-draft-evidence-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Exact sentence interval source membership and ambiguity hard checks
        run: python -m unittest discover -s tests -p test_v38_student_critic_crosswalk.py -q
      - name: SHA verify same original L2 manuscript, compare self claims and examiner quote IDs
        run: python -m scripts.audit_v38_l2_student_vs_critics
