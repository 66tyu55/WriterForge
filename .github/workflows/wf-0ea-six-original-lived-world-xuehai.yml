name: WF 0.EA Six Original Lived-World Fantasy Readings - Existing Xuehai No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0ea-six-original-lived-world-xuehai.yml
      - experiments/wf_0ea_six_original_xuanhuan_lived_world_readings_20261101.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf0ea-immutable-lived-world-346-298
  cancel-in-progress: false

jobs:
  append-and-publish-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      snapshot: ${{ steps.backup.outputs.snapshot }}
      digest: ${{ steps.backup.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing WriterForge Xuehai and R2
        run: python -m pip install -e '.[r2]'
      - name: Verify exact original prose, frozen SHA and three-part reading data
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from hashlib import sha1
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          p=pack_from(Path("experiments/wf_0ea_six_original_xuanhuan_lived_world_readings_20261101.json"))
          assert set(p["sources"])=={"own"} and p["source_scope"]=="ORIGINAL_GENERATED_FOR_WRITERFORGE_USER_PROJECT"
          assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          src=p["sources"]["own"]
          assert src["source_commit"]=="7fc7659e3f22a8cd00265f6be0993594aa6f454e"
          assert src["source_blob_sha1"]=="a046a5522ca6e5d2e2bb42f0219593ef9ccec31f"
          with urlopen(Request(src["url"],headers={"User-Agent":"WF0EA-original-pinned-check/1"}),timeout=55) as stream:
              raw=stream.read(src["source_size_bytes"]+1)
          assert len(raw)==src["source_size_bytes"]
          assert sha1(b"blob "+str(len(raw)).encode("ascii")+b"\0"+raw).hexdigest()==src["source_blob_sha1"]
          target=Path(os.environ["RUNNER_TEMP"])/src["filename"]
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(raw)
          verify_sources(p,Path(os.environ["RUNNER_TEMP"]))
          print("WF0EA_SIX_PINNED_ORIGINAL_FANTASY_SCENES_AND_FULL_READINGS_VERIFIED",flush=True)
          PY
      - name: Restore immutable 340-entry Xuehai and add six complete literary readings
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0ea_six_original_xuanhuan_lived_world_readings_20261101.json \
            --source-dir "$RUNNER_TEMP" --db "$RUNNER_TEMP/wf0ea-346.sqlite3" \
            > "$RUNNER_TEMP/wf0ea-stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ea-stage.json").read_text("utf8"))
          assert j["entries"]==346 and j["full_readings"]==298 and j["added"]==6
          assert j["old_content_sha256"]=="f1a53e90842ce00c0b08c926393f8376f9ff47974fdecd7b2e46c7e895ec7db5"
          assert j["old_r2_modified"] is False and j["model_calls"]==j["canon_writes"]==0
          print("WF0EA_340_OLD_CONTENT_UNCHANGED_NEW_346_298_THREE_PART_READINGS",flush=True)
          PY
      - name: Publish new immutable R2 successor without modifying old library
        id: backup
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0ea_six_original_xuanhuan_lived_world_readings_20261101.json \
            --db "$RUNNER_TEMP/wf0ea-346.sqlite3" > "$RUNNER_TEMP/wf0ea-publish.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ea-publish.json").read_text("utf8"))
          assert j["entries"]==346 and j["full_readings"]==298 and j["old_prefix_modified"] is False
          assert j["model_calls"]==j["canon_writes"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+j["snapshot"]+"\n")
              f.write("digest="+j["all_content_sha256"]+"\n")
          print("WF0EA_NEW_IMMUTABLE_R2",j["library"],j["snapshot"],"DIGEST",j["all_content_sha256"],flush=True)
          PY

  fresh-runner-readonly-cold-restore:
    needs: append-and-publish-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0EA_SNAPSHOT: ${{ needs.append-and-publish-existing-xuehai.outputs.snapshot }}
      WF0EA_DIGEST: ${{ needs.append-and-publish-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read-only R2 adapter without any model
        run: python -m pip install -e '.[r2]'
      - name: Independently recover 346-entry 298-reading Xuehai on a fresh runner
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0ea_six_original_xuanhuan_lived_world_readings_20261101.json \
            --snapshot "$WF0EA_SNAPSHOT" --digest "$WF0EA_DIGEST" > "$RUNNER_TEMP/wf0ea-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ea-cold.json").read_text("utf8"))
          assert j["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_346_298"
          assert j["entries"]==346 and j["full_readings"]==298 and j["added"]==6
          assert j["r2_writes"]==j["model_calls"]==j["canon_writes"]==0
          print("WF0EA_FRESH_RUNNER_READONLY_COLD_R2_346_298_SUCCESS",flush=True)
          PY
