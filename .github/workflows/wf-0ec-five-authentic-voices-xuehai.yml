name: WF 0.EC Five Authentic Narrative Voices - Existing Xuehai No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0ec-five-authentic-voices-xuehai.yml
      - experiments/wf_0ec_five_authentic_voices_and_reflection_readings_20261102.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf0ec-immutable-human-readings-357-309
  cancel-in-progress: false

jobs:
  append-and-publish-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      snapshot: ${{ steps.backup.outputs.snapshot }}
      digest: ${{ steps.backup.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WF Xuehai R2 adapter only
        run: python -m pip install -e '.[r2]'
      - name: Verify five frozen real literary original sources and old-range non-overlap
        run: |
          python - <<'PY'
          import json,os
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import Request,urlopen
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          path=Path("experiments/wf_0ec_five_authentic_voices_and_reflection_readings_20261102.json")
          p=pack_from(path)
          assert set(p["sources"])=={"lc","ss","rl","hh","dp"}
          assert p["source_scope"]=="GITENBERG_PINNED_REAL_HUMAN_CLASSICS"
          assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          for src in p["sources"].values():
              assert src["source_repo"].startswith("GITenberg/")
              with urlopen(Request(src["url"],headers={"User-Agent":"WF0EC-five-immutable-human-lit/1"}),timeout=65) as f:
                  data=f.read(src["source_size_bytes"]+1)
              assert len(data)==src["source_size_bytes"]
              assert sha1(b"blob "+str(len(data)).encode("ascii")+b"\0"+data).hexdigest()==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(data)
          verify_sources(p,Path(os.environ["RUNNER_TEMP"]))
          examined=0
          duplicates=[]
          for path_old in Path("experiments").glob("wf_0*.json"):
              if path_old==path:
                  continue
              try:
                  old=json.loads(path_old.read_text("utf8"))
              except (ValueError,UnicodeError):
                  continue
              if not isinstance(old,dict) or not isinstance(old.get("items"),list) or not isinstance(old.get("sources"),dict):
                  continue
              for row in old["items"]:
                  if not isinstance(row,dict) or row.get("source_key") not in old["sources"]:
                      continue
                  old_src=old["sources"][row["source_key"]]
                  if not isinstance(old_src,dict) or "original_source_start" not in row or "original_source_end" not in row:
                      continue
                  examined+=1
                  for fresh in p["items"]:
                      new_src=p["sources"][fresh["source_key"]]
                      same=(old_src.get("source_repo")==new_src["source_repo"] and old_src.get("source_blob_sha1")==new_src["source_blob_sha1"])
                      if same and max(row["original_source_start"],fresh["original_source_start"])<min(row["original_source_end"],fresh["original_source_end"]):
                          duplicates.append(str(path_old)+"/"+fresh["id"]+" existing=["+str(row["original_source_start"])+","+str(row["original_source_end"])+") new=["+str(fresh["original_source_start"])+","+str(fresh["original_source_end"])+")")
          if duplicates:
              raise AssertionError("WF0EC_DUPLICATE_ORIGINAL_SPANS "+repr(duplicates))
          print("WF0EC_FIVE_REAL_ORIGINALS_VERIFIED_OLD_SPANS_DISJOINT",examined,flush=True)
          PY
      - name: Restore old immutable 352-entry Xuehai and append five real author readings
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0ec_five_authentic_voices_and_reflection_readings_20261102.json \
            --source-dir "$RUNNER_TEMP" --db "$RUNNER_TEMP/wf0ec-357.sqlite3" > "$RUNNER_TEMP/wf0ec-stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ec-stage.json").read_text("utf8"))
          assert j["entries"]==357 and j["full_readings"]==309 and j["added"]==5
          assert j["old_content_sha256"]=="205ac8c3b4266a780b447ac0b485e85f22b542008b9d51e1eda6452e420f65b4"
          assert j["old_r2_modified"] is False and j["model_calls"]==j["canon_writes"]==0
          print("WF0EC_OLD_352_UNCHANGED_NEW_357_309_COMPLETE_READINGS",flush=True)
          PY
      - name: Publish new isolated immutable R2 successor and verify
        id: backup
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0ec_five_authentic_voices_and_reflection_readings_20261102.json \
            --db "$RUNNER_TEMP/wf0ec-357.sqlite3" > "$RUNNER_TEMP/wf0ec-publish.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ec-publish.json").read_text("utf8"))
          assert j["entries"]==357 and j["full_readings"]==309 and j["old_prefix_modified"] is False
          assert j["model_calls"]==j["canon_writes"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+j["snapshot"]+"\n")
              f.write("digest="+j["all_content_sha256"]+"\n")
          print("WF0EC_NEW_IMMUTABLE_R2",j["library"],"SNAPSHOT",j["snapshot"],"SHA256",j["all_content_sha256"],flush=True)
          PY

  fresh-runner-readonly-cold-restore:
    needs: append-and-publish-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0EC_SNAPSHOT: ${{ needs.append-and-publish-existing-xuehai.outputs.snapshot }}
      WF0EC_DIGEST: ${{ needs.append-and-publish-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read-only R2 adapter
        run: python -m pip install -e '.[r2]'
      - name: Fresh reader independently recover 357-entry 309-reading Xuehai
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0ec_five_authentic_voices_and_reflection_readings_20261102.json \
            --snapshot "$WF0EC_SNAPSHOT" --digest "$WF0EC_DIGEST" > "$RUNNER_TEMP/wf0ec-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ec-cold.json").read_text("utf8"))
          assert j["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_357_309"
          assert j["entries"]==357 and j["full_readings"]==309 and j["added"]==5
          assert j["r2_writes"]==j["model_calls"]==j["canon_writes"]==0
          print("WF0EC_FRESH_RUNNER_READONLY_COLD_R2_357_309_SUCCESS",flush=True)
          PY
