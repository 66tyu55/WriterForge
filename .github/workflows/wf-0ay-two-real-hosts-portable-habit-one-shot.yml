name: WF 0.AY Two True Model Hosts Portable Habit Paired Literary Trial ONCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0ay-two-real-hosts-portable-habit-one-shot.yml
      - experiments/wf_0ay_two_real_hosts_portable_habit_ab_once_20261026.py
      - experiments/wf_0ay_portable_habit_fresh_cross_host_fixtures_20261026.json
      - tests/test_wf_0ay_two_actual_host_trial_protocol.py
      - experiments/WF_0AY_FIRE_TWO_REAL_HOSTS_ONCE_20261026.txt

permissions:
  contents: read

concurrency:
  group: wf-0ay-true-two-hosts-portable-cognitive-habit-one-shot
  cancel-in-progress: false

jobs:
  source-first-zero-provider-full-preflight:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only this development branch
        run: python -m pip install -e '.[r2]'
      - name: Compile and validate real two-provider experiment without secrets
        run: |
          python -m py_compile experiments/wf_0ay_two_real_hosts_portable_habit_ab_once_20261026.py
          python -m unittest discover -s tests -p 'test_wf_0ay_two_actual_host_trial_protocol.py' -v
      - name: Source-first verify exactly two new scenes, source SHA and eight offline prompts
        run: python -m experiments.wf_0ay_two_real_hosts_portable_habit_ab_once_20261026 --preflight
      - name: Full regressions including source-verified G writer and portable capsule
        run: python -m unittest discover -s tests -q
      - name: Preserve all offline experiment prompt receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AY-Two-Distinct-Real-Model-Transfer-Prompt-Preflight-OFFLINE
          path: wf_0ay_portable_habit_real_cross_host_trial_20261026/
          retention-days: 90
          if-no-files-found: warn

  one-shot-real-two-provider-writers:
    needs: [source-first-zero-provider-full-preflight]
    if: >-
      github.repository == '66tyu55/WriterForge' &&
      github.ref_name == 'refactor-unified-scene-delivery-audit' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'experiment(0.AY): FIRE TWO REAL MODELS SAME CAPSULE EIGHT MAX CALLS ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Exact one-shot approved experiment marker required
        run: |
          test "$(cat experiments/WF_0AY_FIRE_TWO_REAL_HOSTS_ONCE_20261026.txt)" = "WF0AY_REAL_DEEPSEEK_AND_DISCOVERY_GLM53_TWO_SCENES_TWO_ARMS_8_CALL_CAP"
          python - <<'PY'
          import os
          assert not any(os.getenv(k) for k in (
            "WRITERFORGE_R2_ACCOUNT_ID","WRITERFORGE_R2_ACCESS_KEY_ID",
            "OPENAI_API_KEY","OPENROUTER_API_KEY"))
          print("Dev branch only, no R2, no Canon, no unrelated provider.")
          PY
      - name: Offline matched original two-case prompts before provider secrets
        run: |
          python -m experiments.wf_0ay_two_real_hosts_portable_habit_ab_once_20261026 --preflight
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("wf_0ay_portable_habit_real_cross_host_trial_20261026")
          a=json.loads((root/"PREFLIGHT.json").read_text("utf8"))
          assert a["real_host_models_called"]==0
          assert a["prepared_control_and_habit_requests"]==8
          assert a["capsule_sha256"]=="42cad98118dea662cea472f708ef1de22f4bb139da3210b1f5c3c1f9ac12664d"
          assert a["same_semantic_habit_core_in_both_adapters"]
          PY
          rm -rf wf_0ay_portable_habit_real_cross_host_trial_20261026
      - name: Original DeepSeek and independent Discovery GLM real paired fiction once only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
          DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
        run: python -m experiments.wf_0ay_two_real_hosts_portable_habit_ab_once_20261026
      - name: Check raw model wire hashes source identity and no fake literary winner
        if: success()
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("wf_0ay_portable_habit_real_cross_host_trial_20261026")
          s=json.loads((root/"STATUS.json").read_text("utf8"))
          assert s["status"]=="EIGHT_REAL_WRITER_RESPONSES_SAVED_NEEDS_INDEPENDENT_READER"
          assert s["model_calls"]==8 and s["per_host_paid_calls"]=={"deepseek":4,"discovery":4}
          assert s["model_output_reserved"]==14400
          assert len(s["completed"])==8 and len(s["events"])==8
          assert s["literary_quality_proven"] is False
          assert s["R2_reads"]==s["R2_writes"]==s["Canon_writes"]==0
          assert s["Railway_deployments"]==0 and not s["main_modified"]
          for event in s["events"]:
            assert event["wire_written_before_decode"]
            src=root/"original-provider-wires"/event["host"]/(event["scene"]+"-"+event["arm"]+".json")
            assert hashlib.sha256(src.read_bytes()).hexdigest()==event["original_wire_sha256"]
          report=json.loads((root/"REAL_TWO_HOSTS_CONTROL_TREATMENT_SOURCE_ONLY.json").read_text("utf8"))
          assert report["literary_quality_still_unproven"] and report["habit_remains_shadow"]
          assert report["independent_reader_scores"] is None
          print("WF0AY TWO TRUE PROVIDERS AND EIGHT REAL UNACCEPTED AUTHORS SAVED",s["capsule_sha256"])
          PY
      - name: Preserve original provider wire before decode and ALL failed and successful authors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          path: wf_0ay_portable_habit_real_cross_host_trial_20261026/
          retention-days: 90
          if-no-files-found: warn
