name: WF 0.DV Ten Craft, Community, Conduct and Refugee Readings - Existing Xuehai No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0dv-ten-craft-community-conduct-refugee-xuehai.yml
      - experiments/wf_0dv_ten_craft_community_conduct_refugee_readings_20261031.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf0dv-immutable-literary-306-258
  cancel-in-progress: false

jobs:
  append-and-publish-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    outputs:
      snapshot: ${{ steps.backup.outputs.snapshot }}
      digest: ${{ steps.backup.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WriterForge Xuehai and R2 only
        run: python -m pip install -e '.[r2]'
      - name: Verify ten immutable public-domain sources and ten literal contiguous originals
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from hashlib import sha1
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          p=pack_from(Path("experiments/wf_0dv_ten_craft_community_conduct_refugee_readings_20261031.json"))
          assert set(p["sources"])=={"rl","ek","lc","fs","ss","sj","hh","th"}
          assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          for src in p["sources"].values():
              assert src["url"].startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(src["url"],headers={"User-Agent":"WF0DV-genuine-original-check/1"}),timeout=65) as stream:
                  raw=stream.read(src["source_size_bytes"]+1)
              assert len(raw)==src["source_size_bytes"]
              assert sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(raw)
          verify_sources(p,Path(os.environ["RUNNER_TEMP"]))
          print("WF0DV_TEN_GENUINE_EDITION_SOURCES_AND_TEN_COMPLETE_CONTIGUOUS_ORIGINALS_VERIFIED",flush=True)
          PY
      - name: Preserve all previous 296 originals and add ten 3-part readings to existing Xuehai
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0dv_ten_craft_community_conduct_refugee_readings_20261031.json \
            --source-dir "$RUNNER_TEMP" --db "$RUNNER_TEMP/wf0dv-306.sqlite3" \
            > "$RUNNER_TEMP/wf0dv-stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dv-stage.json").read_text("utf8"))
          assert j["entries"]==306 and j["full_readings"]==258 and j["added"]==10
          assert j["old_content_sha256"]=="4aea83501d98d853e11d60fc85def48cbf41d86cafe502240e520c6cb1ece76f"
          assert j["old_r2_modified"] is False and j["model_calls"]==j["canon_writes"]==0
          print("WF0DV_296_FROZEN_OLD_LITERATURE_VERIFIED_NEW_306_258_READABLE",flush=True)
          PY
      - name: Publish new immutable R2 successor
        id: backup
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0dv_ten_craft_community_conduct_refugee_readings_20261031.json \
            --db "$RUNNER_TEMP/wf0dv-306.sqlite3" > "$RUNNER_TEMP/wf0dv-publish.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dv-publish.json").read_text("utf8"))
          assert j["entries"]==306 and j["full_readings"]==258 and j["old_prefix_modified"] is False
          assert j["model_calls"]==j["canon_writes"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+j["snapshot"]+"\n")
              f.write("digest="+j["all_content_sha256"]+"\n")
          print("WF0DV_R2_SNAPSHOT",j["library"],j["snapshot"],"CONTENT_SHA",j["all_content_sha256"],flush=True)
          PY

  fresh-runner-readonly-cold-restore:
    needs: append-and-publish-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0DV_SNAPSHOT: ${{ needs.append-and-publish-existing-xuehai.outputs.snapshot }}
      WF0DV_DIGEST: ${{ needs.append-and-publish-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Xuehai and R2 read-only adapter - no model
        run: python -m pip install -e '.[r2]'
      - name: Independently cold recover new 306-entry 258-reading Xuehai
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0dv_ten_craft_community_conduct_refugee_readings_20261031.json \
            --snapshot "$WF0DV_SNAPSHOT" --digest "$WF0DV_DIGEST" > "$RUNNER_TEMP/wf0dv-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dv-cold.json").read_text("utf8"))
          assert j["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_306_258"
          assert j["entries"]==306 and j["full_readings"]==258 and j["added"]==10
          assert j["r2_writes"]==j["model_calls"]==j["canon_writes"]==0
          print("WF0DV_FRESH_RUNNER_READONLY_COLD_RESTORE_306_258_SUCCESS",flush=True)
          PY
