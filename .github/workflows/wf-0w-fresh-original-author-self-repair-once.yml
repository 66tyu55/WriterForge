name: WF 0.W First Genuine Fresh Original Novelist Repair and Regeneration
on:
  # Only the unique approved sentinel below can spend DeepSeek tokens.
  # No models on workflow creation, source changes, docs or regular pushes.
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0W_NEW_ORIGINAL_WRITER_REPAIR_FIRE_ONCE_20261025.txt
permissions:
  contents: read
concurrency:
  group: wf-0w-first-new-original-author-self-repair-20261025
  cancel-in-progress: false
jobs:
  new-original-real-source-guarded-author:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only existing WF software, never read R2 source
        run: python -m pip install -e '.[r2]'
      - name: Assert isolated environment has no R2 or secondary evaluator credentials
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("WRITERFORGE_R2_ACCOUNT_ID","WRITERFORGE_R2_ACCESS_KEY_ID","DISCOVERY_API_KEY","OPENAI_API_KEY","OPENROUTER_API_KEY"))'
      - name: Offline prove same writer source continuation and V122 container/signed multi-chapter boundaries
        run: PYTHONPATH=tests python -m unittest tests.test_wf_0w_fresh_original_real_probe_protocol tests.test_wf_0w_container_multi_chapter_source tests.test_wf_0u_source_attachment_relations -q
      - name: One bounded true DeepSeek novelist progressive manuscript with autonomous source revision
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0w_new_original_autonomous_repair_once_20261025
      - name: Assert no fake literary success, Canon or hidden retry
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('wf_0w_new_original_author_repair_20261025/STATUS.json').read_text('utf8'))
          assert 0<=s['new_model_calls']<=8
          assert s['R2_reads']==s['R2_writes']==s['Canon_writes']==0
          assert not s['new_prose_literary_improvement_independently_verified']
          assert not s.get('main_changed',False)
          assert s.get('Railway_deployments',0)==0
          assert not s.get('actually_safe_revised_prose_and_new_downstream',False) or s['status']=='GENUINE_SAME_AUTHOR_SOURCE_EDIT_AND_FRESH_DOWNSTREAM'
          print('REAL NOVELIST OUTCOME:',s['status'])
          print('NEW REAL MODEL CALLS:',s['new_model_calls'])
          print('SELF-EDIT CHOICE:',s.get('actual_author_choice'))
          print('VALID V119 EDIT + FRESH DOWNSTREAM:',s.get('actually_safe_revised_prose_and_new_downstream'))
          print('INDEPENDENT LITERARY QUALITY PROVED: NO')
          PY
      - name: Preserve true writer original/revised sources, failed gates and provider wires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0W-New-Original-Same-Writer-Real-Source-Revision-20261025
          path: wf_0w_new_original_author_repair_20261025/
          retention-days: 30
          if-no-files-found: warn
