name: V28 Fixed 1M pair v3 private numeric results read
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-fixed-pair-v3-score-read.yml'
permissions:
  contents: read
jobs:
  read-only-r2-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - run: python scripts/audit_discovery_v3_numerical.py
