name: V58 relation network adversarial replay (no R2 or models)
on:
  push:
    branches: [v58-relation-redteam-hardening]
    paths:
      - 'writerforge/fact_journal.py'
      - 'writerforge/cli.py'
      - 'tests/test_v58_relation_redteam.py'
      - 'tests/test_v57_relation_foundation.py'
      - 'tests/test_v55_bitemporal_graph.py'
      - 'scripts/audit_v58_relations.py'
      - '.github/workflows/v58-relation-redteam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v58-real-synthetic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Regression V54 no R2 use
        run: python -m unittest discover -s tests -p 'test_v54_consent_fact_core.py' -v
      - name: Regression V55 bitemporal graph
        run: python -m unittest discover -s tests -p 'test_v55_bitemporal_graph.py' -v
      - name: Regression V57 baseline
        run: python -m unittest discover -s tests -p 'test_v57_relation_foundation.py' -v
      - name: Independent V58 adversarial case receipts
        run: python -m scripts.audit_v58_relations
      - name: SHA manifest of code, CLI, tests and audit
        if: always()
        run: sha256sum writerforge/fact_journal.py writerforge/cli.py tests/test_v58_relation_redteam.py tests/test_v57_relation_foundation.py tests/test_v55_bitemporal_graph.py scripts/audit_v58_relations.py
      - name: Preserve failure or success receipt (never rewrite previous run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V58_Independent_Relation_Redteam_Receipt
          path: v58_relation_regression_receipt.json
          if-no-files-found: warn
          retention-days: 90
