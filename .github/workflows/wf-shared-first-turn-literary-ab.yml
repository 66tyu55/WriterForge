name: WF Same-First-Paragraph Source-Only Literary A/B
on:
  # Original real evidence is saved. Prevent unintended paid experiment replay.
  # Re-run only after an explicit future user request.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-identical-real-first-turn-source-progress-ab
  cancel-in-progress: false
jobs:
  compare-two-second-turns:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        genre: [plot, climax, horror]
    env:
      WF_SHARED_GENRE: ${{ matrix.genre }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[r2]'
      - name: Verify frozen first-turn adapter and non-model literary guards
        run: python -m unittest tests.test_wf_same_real_first_turn_ab tests.test_wf_horror_turn_length_recovery tests.test_wf_source_progression_literary -q
      - name: Download true prior source-writing artifact, not any model simulation
        uses: actions/download-artifact@v4
        with:
          run-id: 39968891775
          name: WF-New-World-${{ matrix.genre }}-Literary-Blind-Originals
          github-token: ${{ github.token }}
          path: wf_prior_holdout_sources/${{ matrix.genre }}
      - name: Check preexisting DeepSeek key before paid second turns
        run: python -c 'import os; assert os.getenv("DEEPSEEK_API_KEY"), "WF_EXISTING_KEY_MISSING"'
      - name: Replay one REAL first turn in both arms, ask for only next real turn
        run: python -m experiments.wf_same_first_turn_literary_ab
      - name: Fail CI on incomplete pair without retrying failed provider call
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('wf_same_first_turn_blind_results')/os.environ['WF_SHARED_GENRE']/'PAIR_STATUS.json'
          data=json.loads(p.read_text('utf8'))
          assert data['actual_new_provider_calls']==2
          assert data['pair_generated'], 'Not a complete candidate pair'
          assert data['same_first_turn_json_and_both_wf_prompts']
          print('REAL SOURCE-LOCKED SECOND-TURN PAIR COMPLETED, literary quality unverified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Same-Real-First-Turn-${{ matrix.genre }}-Blind-Prose
          path: wf_same_first_turn_blind_results/${{ matrix.genre }}/
          retention-days: 30
          if-no-files-found: warn
