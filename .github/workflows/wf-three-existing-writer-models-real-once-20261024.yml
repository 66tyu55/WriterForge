name: WF One-Shot Three Existing Models Real Writer Self-Review 20261024
on:
  # This authorized trial fires ONLY when its unique sentinel is newly
  # committed on the development branch, not on ordinary code/docs changes.
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_3_EXISTING_MODELS_20261024_FIRE_ONCE.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wf-real-three-existing-models-20261024-once
  cancel-in-progress: false
jobs:
  same-model-internal-writer-self-review:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing WF runtime (no R2 secrets)
        run: python -m pip install -e .
      - name: Confirm bounded actor-owned source edit path without models
        run: PYTHONPATH=tests python -m unittest tests.test_wf_three_real_writer_models_bounded tests.test_wf_ai_writer_chooses_when_and_why tests.test_wf_writer_self_revision_loop -q
      - name: One explicit genuine 3-model comparison, max 9 calls total, zero retries
        run: python -m experiments.wf_three_existing_writer_models_real_20261024
      - name: Check genuine attempted counts, no artistic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('wf_three_real_writer_models_20261024/STATUS.json').read_text('utf8'))
          assert report['total_calls_attempted']<=9
          assert report['max_total_provider_calls']==9
          assert report['no_automatic_retry']
          assert report['no_canon_or_R2_writes']
          assert report['models_configured']==['deepseek-flash','glm-5.3','kimi-k2.6']
          print('ACTUAL REAL PROVIDER ATTEMPTS:',report['total_calls_attempted'])
          print('LITERARY MERIT NEEDS HUMAN BLIND REVIEW')
          PY
      - name: Save original unmodified provider wires, full model prose, own decision and V119 outcome even if tests fail
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-3-Existing-Models-Real-Writer-Originals-20261024
          path: wf_three_real_writer_models_20261024/
          retention-days: 30
          if-no-files-found: warn
