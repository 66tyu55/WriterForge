name: WF 0.BZ REAL Two-Scene Three-Arm Literary Reading CPU - NO PAID API

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bz-real-literary-three-arm-cpu.yml
      - experiments/wf_0bz_real_local_literary_three_arm_once.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0bz-one-local-literary-three-arm-trial
  cancel-in-progress: false

jobs:
  real-ungraded-local-author-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strictly forbid paid model and private source credentials
        run: |
          python - <<'PY'
          import os
          keys=("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY",
                "OPENROUTER_API_KEY","ANTHROPIC_API_KEY","GOOGLE_API_KEY",
                "GEMINI_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY")
          assert not any(os.getenv(key) for key in keys)
          print("NO_PAID_API_OR_PRIVATE_R2_CREDENTIALS",flush=True)
          PY
      - name: Existing WriterForge and Xuehai dependencies
        run: python -m pip install -e '.[r2,evidence]'
      - name: Fetch exactly nine SOURCE-PINNED public classics for disposable Xuehai
        run: |
          python - <<'PY'
          import json,os
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import Request,urlopen
          base=Path("experiments")
          bundles=[
              (base/"wf_0br_classical_original_annotation_reflection_20261028.json",
               {"xy":"23962-0.txt","hl":"24264-0.txt","sh":"23863-0.txt"}),
              (base/"wf_0bv_three_fantasy_classics_six_close_readings_20261028.json",None),
              (base/"wf_0bx_three_new_fantasy_books_six_close_readings_20261029.json",None),
          ]
          for pack,oldnames in bundles:
              sources=json.loads(pack.read_text("utf8"))["sources"]
              for key,item in sources.items():
                  url=item["url"]
                  assert url.startswith("https://raw.githubusercontent.com/GITenberg/")
                  with urlopen(Request(url,headers={"User-Agent":"WriterForge-0BZ-source-locked-literary-trial"}),timeout=50) as response:
                      raw=response.read(4_000_001)
                  assert 100_000<len(raw)<4_000_000
                  gitsha=sha1(b"blob "+str(len(raw)).encode("ascii")+b"\0"+raw).hexdigest()
                  assert gitsha==item.get("source_blob_sha1",item.get("git_blob_sha1"))
                  if "source_size_bytes" in item:
                      assert len(raw)==item["source_size_bytes"]
                  filename=oldnames[key] if oldnames else item["filename"]
                  (Path(os.environ["RUNNER_TEMP"])/filename).write_bytes(raw)
          print("PINNED_9_PUBLIC_SOURCES_VERIFIED",flush=True)
          PY
      - name: Restore only the existing 114 literary entries and 66 complete readings
        run: |
          python -m experiments.wf_0br_stage_classical_readings \
            --db "$RUNNER_TEMP/wf0bz-source-114.sqlite" \
            --xy "$RUNNER_TEMP/23962-0.txt" \
            --hl "$RUNNER_TEMP/24264-0.txt" \
            --sh "$RUNNER_TEMP/23863-0.txt" \
            --fs "$RUNNER_TEMP/23910-0.txt" \
            --jh "$RUNNER_TEMP/23818-0.txt" \
            --lz "$RUNNER_TEMP/51828-0.txt" \
            --hx "$RUNNER_TEMP/24231-0.txt" \
            --dd "$RUNNER_TEMP/24233-0.txt" \
            --zb "$RUNNER_TEMP/25245-0.txt" \
            --fantasy18 > "$RUNNER_TEMP/wf0bz-study-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0bz-study-receipt.json").read_text("utf8"))
          assert a["all_literary_content_entries"]==114
          assert a["all_three_part_readings"]==66
          assert a["model_calls"]==0
          print("EXISTING_XUEHAI_114_66_IN_DISPOSABLE_SQLITE",flush=True)
          PY
      - name: Verify both distinct scenes actually have suitable complete readings BEFORE inference
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from writerforge import WriterForgeDB,RuntimeEngine
          from writerforge.xuehai import XuehaiStore
          from experiments.wf_0bz_real_local_literary_three_arm_once import SCENES
          db=WriterForgeDB(Path(os.environ["RUNNER_TEMP"])/"wf0bz-source-114.sqlite")
          rt=RuntimeEngine()
          rt.enter_write(XuehaiStore(db,rt).latest_published())
          for case in SCENES:
              row=XuehaiStore(db,rt).select_literary_reading_for_author(goal=case["goal"],max_chars=4900)
              assert row is not None, "MISSING_RELEVANT_READING_"+case["id"]
              assert all(s in row["complete_reading"] for s in ("【原文】","【批注】","【心得】"))
              print("SCENE_READING_SELECTED",case["id"],row["source"],row["reading_sha256"],flush=True)
          rt.exit()
          db.close()
          PY
      - name: Install existing proven local llama CPP engine
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python -m pip install 'llama-cpp-python==0.3.16'
      - name: Fetch and SHA-verify original Qwen2.5-3B Q4_K_M weights, no model API
        run: |
          curl --fail --show-error --location --connect-timeout 30 --max-time 720 \
            --output "$RUNNER_TEMP/wf0bz-qwen25-3b.gguf" \
            "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/254600e47ea694216f6108325376ce5b35d456a1/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          printf '%s  %s\n' \
            '9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94' \
            "$RUNNER_TEMP/wf0bz-qwen25-3b.gguf" | sha256sum --check --status
      - name: ACTUAL zero-paid model: two scenes x bare / original WF-G / WF-G+full reading
        run: |
          python -m experiments.wf_0bz_real_local_literary_three_arm_once \
            --model "$RUNNER_TEMP/wf0bz-qwen25-3b.gguf" \
            --db "$RUNNER_TEMP/wf0bz-source-114.sqlite" \
            --output "wf0bz_real_local_literary_three_arm"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("wf0bz_real_local_literary_three_arm/STATUS.json").read_text("utf8"))
          assert s["new_paid_model_api_calls"]==0
          assert len(s["results"])==6
          assert s["published_disposable_xuehai_entries"]==114
          assert s["full_three_part_readings"]==66
          assert s["literary_improvement_proven"] is False
          for r in s["results"]:
              print("ACTUAL_SCENE_ARM_STATUS",r["scene"],r["arm"],r["status"],"calls",len(r["calls"]),"tokens",r["total_actual_tokens"],flush=True)
          PY
      - name: Keep ORIGINAL model replies, prompts, outcomes and even parse failures, never auto-repeat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BZ-REAL-LOCAL-TWO-SCENE-THREE-ARM-ORIGINALS
          path: wf0bz_real_local_literary_three_arm/
          if-no-files-found: warn
          retention-days: 90
