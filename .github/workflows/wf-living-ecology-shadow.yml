name: WF living ecology SHADOW isolation
on:
  push:
    branches:
      - experiment/wf-light-continuity-over-sevenskill-20261118
    paths:
      - '.agents/skills/wf-living-ecology/**'
      - 'tests/test_wf_living_ecology_shadow.py'
      - 'tests/test_wf_living_ecology_real_ab_once_20261118.py'
      - 'experiments/wf_living_ecology_real_ab_once_20261118.py'
      - '.github/workflows/wf-living-ecology-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated zero-model tests
        run: python -m unittest discover -s tests -p test_wf_living_ecology_shadow.py -v
      - name: Run real A/B pilot OFFLINE source and paid-gate preflight
        run: |
          python -m unittest discover -s tests -p test_wf_living_ecology_real_ab_once_20261118.py -v
          python -m experiments.wf_living_ecology_real_ab_once_20261118 --dry-run
      - name: Example with no API requests
        run: python .agents/skills/wf-living-ecology/scripts/ecology_shadow.py
