name: V112 native GitHub DEEPSEEK and R2 readiness - zero calls
on:
  push:
    branches: [v112-github-native-matched-deepseek]
    paths:
      - '.github/workflows/v112-secret-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - name: Verify presence only; do not call DeepSeek, R2 or print values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEEPSEEK_API_KEY}" ]]; then echo 'DEEPSEEK: AVAILABLE'; else echo 'DEEPSEEK: MISSING'; fi
          for key in WRITERFORGE_R2_ACCOUNT_ID WRITERFORGE_R2_BUCKET WRITERFORGE_R2_ACCESS_KEY_ID WRITERFORGE_R2_SECRET_ACCESS_KEY; do
            if [[ -n "${!key}" ]]; then echo "${key}: AVAILABLE"; else echo "${key}: MISSING"; fi
          done
          echo 'No external API requests; no paid inference.'
