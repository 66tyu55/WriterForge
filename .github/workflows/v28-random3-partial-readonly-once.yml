name: V28 random3 real scores partial read-only audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-random3-partial-readonly-once.yml'
permissions:
  contents: read
jobs:
  audit-available:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Verify any completed real receipts without making model requests
        run: python -m scripts.audit_random3_partial_readonly
