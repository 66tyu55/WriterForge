name: WF Seven Literary Categories Offline Protocol
on:
  push:
    branches: [experiment-seven-literary-scenes-inkstone]
    paths:
      - .github/workflows/wf-seven-literary-protocol-offline.yml
      - experiments/seven_literary_scenes_inkstone_ab.py
      - tests/test_seven_literary_scenes_inkstone_ab.py
permissions:
  contents: read
concurrency:
  group: wf-seven-literary-offline
  cancel-in-progress: true
jobs:
  no-secrets-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No provider credentials in offline checks
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY", "DEEPSEEK_API_KEY", "OPENAI_API_KEY"))'
      - run: python -m pip install -e '.[r2]'
      - run: python -m unittest tests.test_seven_literary_scenes_inkstone_ab -v
