name: WF 0.AA Two-Stage Blind Literary Reference /100 Pilot
on:
  # Exactly one finite rating run. Ordinary code edits NEVER spend model tokens.
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AA_REFERENCE_SCORE_FIRE_ONCE_20261025.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-0aa-frozen-original-pair-private-source-literary-score
  cancel-in-progress: false
jobs:
  judge-existing-source-pair:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing WF utilities only, not another memory owner
        run: python -m pip install -e '.[r2]'
      - name: Restore exact 0.T A/B provider original artifacts without regenerating stories
        uses: actions/download-artifact@v4
        with:
          run-id: 40163959949
          name: WF-0T-Real-Fanren-Staged-A-vs-B-Initial-Pair-20261025
          github-token: ${{ github.token }}
          path: wf0t_prior_paired_originals
      - name: Preflight rubric and all four original DeepSeek source SHA without paid model
        run: |
          PYTHONPATH=tests python -m unittest tests.test_wf_0aa_literary_reference_score_protocol -q
          python - <<'PY'
          from experiments.wf_0aa_literary_reference_score_20261025 import load_prior_originals
          originals=load_prior_originals()
          assert len(originals)==4
          print('WF 0.AA confirmed four real provider source hashes before rating; ZERO NEW MODEL CALLS')
          PY
      - name: Recheck pinned old private Fanren edition read-only, then 4 capped blinded DeepSeek ratings
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: python -m experiments.wf_0aa_literary_reference_score_20261025
      - name: Make scores visible only if all source/rating guardrails were proven
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('wf_0aa_literary_reference_score_20261025/STATUS.json').read_text('utf8'))
          print('RATING STATUS:',r['status'])
          print('PAID RATING CALLS:',r['paid_rating_calls'])
          assert r['paid_rating_calls']<=4
          assert r['r2_writes']==r['canon_writes']==0
          assert not r['main_modified'] and r['Railway_deployments']==0
          assert r['original_book_prose_in_public_artifacts'] is False
          assert r['cannot_attribute_change_to_WF_in_this_AB_design']
          assert r['score_does_not_prove_similarity_or_novel_quality']
          assert r['status']=='PROVISIONAL_TWO_STAGE_LOW_CONFIDENCE_MODEL_RATINGS',r
          assert set(r['overall_average_scores'])=={'R','A','B'}
          assert all(0<=v<=100 for v in r['overall_average_scores'].values())
          print('PROVISIONAL LOCAL LITERARY SCORE /100:',r['overall_average_scores'])
          print('GAP TO ANONYMOUS REFERENCE:',r['overall_gap_from_reference'])
          PY
      - name: Publish score-only result and score-response SHA, NEVER original book excerpt or judge wire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AA-Source-Pinned-Two-Stage-Reference-Literary-Scores
          path: wf_0aa_literary_reference_score_20261025/STATUS.json
          retention-days: 21
          if-no-files-found: warn
