name: R2 actual bucket read-only verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-verify-bucket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-bucket:
    # Secrets are never available to untrusted pull_request code.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install read-only S3 diagnostics
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Compare configured target with author's visible bucket and list R2 objects
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import boto3
          from botocore.config import Config

          expected = "writerforge-private-library"
          prefix = "writerforge/v1/libraries/xiyouji-23962/"
          names = (
              "WRITERFORGE_R2_ACCOUNT_ID",
              "WRITERFORGE_R2_BUCKET",
              "WRITERFORGE_R2_ACCESS_KEY_ID",
              "WRITERFORGE_R2_SECRET_ACCESS_KEY",
          )
          creds = {name: os.environ.get(name, "") for name in names}
          def result(label, content):
              print(label + ": " + str(content))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("- " + label + ": **" + str(content) + "**\n")
          if not all(creds.values()):
              result("R2 configured", "NO - required GitHub repository secrets are missing")
              sys.exit(1)
          account_id = creds["WRITERFORGE_R2_ACCOUNT_ID"]
          actual_bucket = creds["WRITERFORGE_R2_BUCKET"]
          result("Configured bucket exactly matches screenshot 'writerforge-private-library'",
                 "YES" if actual_bucket == expected else "NO")
          if actual_bucket != expected:
              # Fail closed. Never read or upload into a surprising destination.
              result("Diagnosis", "WRITERFORGE_R2_BUCKET points to another bucket. Fix this ONE secret.")
              sys.exit(2)

          jurisdiction = os.getenv("WRITERFORGE_R2_JURISDICTION") or "default"
          segment = "" if jurisdiction == "default" else jurisdiction + "."
          endpoint = f"https://{account_id}.{segment}r2.cloudflarestorage.com"
          s3 = boto3.client(
              "s3", endpoint_url=endpoint, region_name="auto",
              aws_access_key_id=creds["WRITERFORGE_R2_ACCESS_KEY_ID"],
              aws_secret_access_key=creds["WRITERFORGE_R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4",
                            s3={"addressing_style":"path"},
                            retries={"max_attempts":2,"mode":"standard"},
                            connect_timeout=10,read_timeout=30),
          )
          # R2 S3 ListObjectsV2 is strongly consistent. No dashboard metrics.
          all_objects = s3.list_objects_v2(Bucket=actual_bucket, MaxKeys=1000)
          if all_objects.get("IsTruncated"):
              result("Total inventory", "over 1000 objects; inspection deliberately capped")
          else:
              result("Actual R2 bucket object count (S3 ListObjectsV2)",
                     len(all_objects.get("Contents", [])))
          objects = s3.list_objects_v2(
              Bucket=actual_bucket, Prefix=prefix, MaxKeys=1000,
          )
          if objects.get("IsTruncated"):
              result("Study prefix", "over 1000 objects, aborting bounded check")
              sys.exit(3)
          rows = objects.get("Contents", [])
          total = sum(item["Size"] for item in rows)
          result("Actual study prefix object count", len(rows))
          result("Actual study prefix bytes", total)
          latest = prefix + "latest.json"
          result("Study latest.json exists", "YES" if any(item["Key"] == latest for item in rows) else "NO")
          if not rows or not any(item["Key"] == latest for item in rows):
              result("Diagnosis", "No complete study under EXPECTED bucket and prefix")
              sys.exit(4)
          # Diagnose the ACTUAL source needed by private modern-novel jobs.
          # Scan the WHOLE bucket, not merely "writerforge/" as the failed
          # single_work_runner does. Metadata only: no text or secret output.
          root_key = "WriterForge_PrivateReading_13Works_20261011.sqlite3"
          expected_size = 231878656
          from botocore.exceptions import ClientError
          try:
              root_head = s3.head_object(Bucket=actual_bucket, Key=root_key)
              root_size = int(root_head.get("ContentLength", -1))
          except ClientError as exc:
              error = str(exc.response.get("Error", {}).get("Code", ""))
              if error not in ("404", "NoSuchKey", "NotFound"):
                  raise  # No pretending permission failures are missing files.
              root_size = None
          found_name = 0
          found_size = 0
          source_pointer_books = set()
          listed = 0
          token = None
          for page_number in range(50):
              params = {"Bucket": actual_bucket, "MaxKeys": 1000}
              if token:
                  params["ContinuationToken"] = token
              page = s3.list_objects_v2(**params)
              for obj in page.get("Contents", []):
                  listed += 1
                  key = obj["Key"]
                  if key.rsplit("/", 1)[-1] == root_key:
                      found_name += 1
                  if int(obj["Size"]) == expected_size:
                      found_size += 1
                  fixed_prefix = "writerforge/v1/private-reading/single-works/"
                  if key.startswith(fixed_prefix) and key.endswith("/latest.json"):
                      work_id = key[len(fixed_prefix):-len("/latest.json")]
                      if work_id and "/" not in work_id:
                          source_pointer_books.add(work_id)
              if not page.get("IsTruncated"):
                  break
              token = page.get("NextContinuationToken")
              if not token:
                  raise RuntimeError("R2 inventory pagination incomplete")
          else:
              raise RuntimeError("R2 inventory exceeded 50,000 objects; absence cannot be determined")
          result("Legacy 13-work root source present (exact key and size)",
                 "YES" if root_size == expected_size else "NO")
          result("Legacy source canonical root bytes", root_size)
          result("Legacy source basename matches anywhere in bucket", found_name)
          result("Legacy source expected-size matches anywhere in bucket", found_size)
          result("Legacy source metadata search scanned total objects", listed)
          result("Already archived independent private-book IDs",
                 ",".join(sorted(source_pointer_books)) if source_pointer_books else "NONE")
          if root_size != expected_size:
              result("Legacy source diagnosis",
                     "BLOCKED BEFORE UPLOAD: canonical source missing/wrong size; "
                     "a separate per-book source or restored original is required")
          else:
              result("Legacy source diagnosis",
                     "PRESENT by HEAD; verify pinned SHA256 before attempting migration")
          # No file uploads or deletes are performed by this job.
          result("Result", "CONFIRMED in expected private bucket by direct, read-only R2 listing")
          PY
