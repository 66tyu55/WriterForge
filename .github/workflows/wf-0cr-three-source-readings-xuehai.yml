name: WF 0.CR Three New Genuine Classical Close Readings - No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0cr-three-source-readings-xuehai.yml
      - experiments/wf_0cr_three_fusheng_shishuo_close_readings_20261029.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0cr-fixed-three-public-classic-readings
  cancel-in-progress: false

jobs:
  append-three-to-old-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    outputs:
      snapshot: ${{ steps.publish.outputs.snapshot }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing Xuehai and R2 only - no model client
        run: python -m pip install -e '.[r2]'
      - name: Download two public-domain sources at pinned Git commits
        run: |
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import urlopen,Request
          import os
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          pack=pack_from(Path("experiments/wf_0cr_three_fusheng_shishuo_close_readings_20261029.json"))
          assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          for key,src in pack["sources"].items():
              assert src["url"].startswith("https://raw.githubusercontent.com/GITenberg/")
              with urlopen(Request(src["url"],headers={"User-Agent":"WF-literary-source-verification/1"}),timeout=45) as resp:
                  raw=resp.read(src["source_size_bytes"]+1)
              assert len(raw)==src["source_size_bytes"]
              assert sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(raw)
          verify_sources(pack,Path(os.environ["RUNNER_TEMP"]))
          print("WF0CQ_ALL_FIVE_LITERAL_ORIGINALS_IN_EXACT_PINNED_SOURCES",flush=True)
          PY
      - name: Restore old 145/92 R2 immutably and append three full tripartite readings
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0cr_three_fusheng_shishuo_close_readings_20261029.json \
            --source-dir "$RUNNER_TEMP" --db "$RUNNER_TEMP/wf0cr-148.sqlite3" \
            > "$RUNNER_TEMP/stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"stage.json").read_text("utf8"))
          assert r["status"]=="WF_SOURCE_EXISTING_XUEHAI_APPEND_FIVE"
          assert r["entries"]==148 and r["full_readings"]==100 and r["added"]==3
          assert r["model_calls"]==r["canon_writes"]==0 and r["old_r2_modified"] is False
          print("WF0CQ_ALL_148_AND_100_WITH_PREVIOUS_145_BYTE_UNCHANGED",flush=True)
          PY
      - name: Exercise actual author reading selector (not literary-quality grades)
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from writerforge import WriterForgeDB, RuntimeEngine, XuehaiStore
          db=WriterForgeDB(Path(os.environ["RUNNER_TEMP"])/"wf0cr-148.sqlite3")
          rt=RuntimeEngine()
          store=XuehaiStore(db,rt)
          rt.enter_write(store.latest_published())
          cases=(
              ("quiet-porridge","外门弟子晚归饥饿，另一个人悄悄留了一碗热粥。","怎样写出从一碗粥、留饭和亲友打趣中产生的羞窘与照顾？"),
              ("market-picnic","数人到花田郊游，缺少锅灶却想在野外吃热菜喝热茶。","如何把野游、出钱雇市井摊贩、锅灶、热菜、帮手的劳作写成具体的共同经历？"),
              ("commitment-under-danger","两位修士渡河逃命，曾答应让一个陌生人上船，后遇追兵。","如何写人物承诺的代价，在真正危险到来以后才显出谁愿意遵守先前选择？"),
              ("technical-code","为角色数据系统设计 SQL 表格。","只需输出 SQL 建表代码和 JSON 字段定义，不要小说故事。"),
          )
          out=[]
          try:
              for name,goal,problem in cases:
                  r=store.select_literary_reading_for_author(goal=goal,writing_problem=problem,max_chars=4900)
                  if r is not None:
                      assert all(tag in r["complete_reading"] for tag in ("【原文】","【批注】","【心得】"))
                      row=db.conn.execute("SELECT method_cluster FROM xuehai_entries WHERE id=?",(r["entry_id"],)).fetchone()
                      cluster=row["method_cluster"]
                  else:
                      cluster=None
                  if name=="technical-code":
                      assert cluster is None, "technical task unexpectedly got a literary passage"
                  out.append([name,cluster])
          finally:
              rt.exit();db.close()
          print("WF0CQ_AUTHOR_READ_SOURCE_ONLY_RESULTS",json.dumps(out,ensure_ascii=False),flush=True)
          PY
      - name: Publish NEW immutable R2 successor prefix, old library never modified
        id: publish
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0cr_three_fusheng_shishuo_close_readings_20261029.json \
            --db "$RUNNER_TEMP/wf0cr-148.sqlite3" > "$RUNNER_TEMP/published.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"published.json").read_text("utf8"))
          assert r["status"]=="WF_SOURCE_NEW_IMMUTABLE_R2_SUCCESSOR"
          assert r["entries"]==148 and r["full_readings"]==100 and not r["old_prefix_modified"]
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+r["snapshot"]+"\n")
              f.write("digest="+r["all_content_sha256"]+"\n")
          print("WF0CQ_NEW_IMMUTABLE_R2_SNAPSHOT",r["snapshot"],"CONTENT_SHA",r["all_content_sha256"],flush=True)
          PY

  separate-job-read-only-cold-restore:
    needs: append-three-to-old-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0CQ_SNAPSHOT: ${{ needs.append-three-to-old-xuehai.outputs.snapshot }}
      WF0CQ_DIGEST: ${{ needs.append-three-to-old-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing read-only R2 adapter, no author model
        run: python -m pip install -e '.[r2]'
      - name: Cold read every actual old and new literary passage and all 100 complete readings
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0cr_three_fusheng_shishuo_close_readings_20261029.json \
            --snapshot "$WF0CQ_SNAPSHOT" --digest "$WF0CQ_DIGEST" > "$RUNNER_TEMP/cold.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"cold.json").read_text("utf8"))
          assert r["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_148_100"
          assert r["entries"]==148 and r["full_readings"]==100 and r["added"]==3
          assert r["model_calls"]==r["r2_writes"]==r["canon_writes"]==0
          print("WF0CQ_148_100_INDEPENDENT_READONLY_R2_GREEN",flush=True)
          PY
