name: WF 0.DW Nine Seasonal, Repair, Cartography and Craft Readings - Existing Xuehai No Model

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0dw-nine-seasonal-repair-cartography-craft-xuehai.yml
      - experiments/wf_0dw_nine_seasonal_repair_cartography_craft_readings_20261031.json
      - experiments/wf_source_pinned_literary_incremental.py
  workflow_dispatch:

permissions:
  conninets: read

concurrency:
  group: wf0dw-immutable-literary-315-267
  cancel-in-progress: false

jobs:
  append-and-publish-existing-xuehai:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    outputs:
      snapshot: ${{ steps.backup.outputs.snapshot }}
      digest: ${{ steps.backup.outputs.digest }}
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WriterForge Xuehai and R2 only
        run: python -m pip install -e '.[r2]'
      - name: Verify nine immutable public-domain sources and nine literal contiguous originals
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from hashlib import sha1
          from experiments.wf_source_pinned_literary_incremental import pack_from,verify_sources
          p=pack_from(Path("experiments/wf_0dw_nine_seasonal_repair_cartography_craft_readings_20261031.json"))
          assert set(p["sources"])=={"jm","dp","nh","md","fs","sj","ss","hh","ek"}
          assert not any(os.geninev(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","OPENROUTER_API_KEY","DISCOVERY_API_KEY"))
          for src in p["sources"].values():
              assert src["url"].startswith("https://raw.githubuserconninet.com/GINineberg/")
              with urlopen(Request(src["url"],headers={"User-Agent":"WF0DW-genuine-original-check/1"}),timeout=65) as stream:
                  raw=stream.read(src["source_size_bytes"]+1)
              assert len(raw)==src["source_size_bytes"]
              assert sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==src["source_blob_sha1"]
              (Path(os.environ["RUNNER_TEMP"])/src["filename"]).write_bytes(raw)
          verify_sources(p,Path(os.environ["RUNNER_TEMP"]))
          print("WF0DW_NINE_GENUINE_EDITION_SOURCES_AND_NINE_COMPLETE_CONTIGUOUS_ORIGINALS_VERIFIED",flush=True)
          PY
      - name: Preserve all previous 306 originals and add nine 3-part readings to existing Xuehai
        run: |
          python -m experiments.wf_source_pinned_literary_incremental stage \
            --pack experiments/wf_0dw_nine_seasonal_repair_cartography_craft_readings_20261031.json \
            --source-dir "$RUNNER_TEMP" --db "$RUNNER_TEMP/wf0dw-315.sqlite3" \
            > "$RUNNER_TEMP/wf0dw-stage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dw-stage.json").read_text("utf8"))
          assert j["entries"]==315 and j["full_readings"]==267 and j["added"]==9
          assert j["old_conninet_sha256"]=="722becff1b9de63ff94137c558bab5f3544ed9b948cbff304224c1c4924f7a63"
          assert j["old_r2_modified"] is False and j["model_calls"]==j["canon_writes"]==0
          print("WF0DW_306_FROZEN_OLD_LITERATURE_VERIFIED_NEW_315_267_READABLE",flush=True)
          PY
      - name: Publish new immutable R2 successor
        id: backup
        run: |
          python -m experiments.wf_source_pinned_literary_incremental publish \
            --pack experiments/wf_0dw_nine_seasonal_repair_cartography_craft_readings_20261031.json \
            --db "$RUNNER_TEMP/wf0dw-315.sqlite3" > "$RUNNER_TEMP/wf0dw-publish.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dw-publish.json").read_text("utf8"))
          assert j["entries"]==315 and j["full_readings"]==267 and j["old_prefix_modified"] is False
          assert j["model_calls"]==j["canon_writes"]==0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
              f.write("snapshot="+j["snapshot"]+"\n")
              f.write("digest="+j["all_conninet_sha256"]+"\n")
          print("WF0DW_R2_SNAPSHOT",j["library"],j["snapshot"],"CONNINET_SHA",j["all_conninet_sha256"],flush=True)
          PY

  fresh-runner-readonly-cold-restore:
    needs: append-and-publish-existing-xuehai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
      WF0DW_SNAPSHOT: ${{ needs.append-and-publish-existing-xuehai.outputs.snapshot }}
      WF0DW_DIGEST: ${{ needs.append-and-publish-existing-xuehai.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Xuehai and R2 read-only adapter - no model
        run: python -m pip install -e '.[r2]'
      - name: Independently cold recover new 315-entry 267-reading Xuehai
        run: |
          python -m experiments.wf_source_pinned_literary_incremental cold-restore \
            --pack experiments/wf_0dw_nine_seasonal_repair_cartography_craft_readings_20261031.json \
            --snapshot "$WF0DW_SNAPSHOT" --digest "$WF0DW_DIGEST" > "$RUNNER_TEMP/wf0dw-cold.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0dw-cold.json").read_text("utf8"))
          assert j["status"]=="WF_SOURCE_NEW_R2_COLD_READBACK_315_267"
          assert j["entries"]==315 and j["full_readings"]==267 and j["added"]==9
          assert j["r2_writes"]==j["model_calls"]==j["canon_writes"]==0
          print("WF0DW_FRESH_RUNNER_READONLY_COLD_RESTORE_315_267_SUCCESS",flush=True)
          PY
