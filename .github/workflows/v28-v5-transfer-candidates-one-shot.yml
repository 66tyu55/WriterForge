name: V28 V5 real abstract evidence R2 backfill one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-v5-transfer-candidates-one-shot.yml'
permissions:
  contents: read
jobs:
  abstract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Regression tests without model, before importing preserved candidate evidence
        run: |
          python -m unittest discover -s tests -p test_v28_v5_candidate_import.py -q
          python -m unittest discover -s tests -p test_v28_reverse_ab_candidates.py -q
      - name: Restore genuine v5 receipt then persist bounded candidates with R2 fresh GET
        run: python -m scripts.import_v28_v5_transfer_candidates_r2
