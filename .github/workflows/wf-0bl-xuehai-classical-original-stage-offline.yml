name: WF 0.BL Xuehai Original Xuanhuan Scene Atlas STAGING - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bl-xuehai-classical-original-stage-offline.yml
      - experiments/wf_0bl_stage_original_xuanhuan_xuehai.py
      - experiments/wf_0bl_xuanhuan_original_micro_scenes_20261028.json
      - experiments/wf_0bl_classical_provenance_reference_catalog_20261028.json
      - tests/test_wf_0bl_xuehai_original_scene_atlas_stage.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bl-offline-xuehai-staging-only
  cancel-in-progress: true

jobs:
  first-source-atlas-no-training-or-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No provider or private R2 credentials allowed
        run: python -c 'import os; assert not any(os.getenv(k) for k in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install local existing Xuehai only
        run: python -m pip install -e '.[r2,evidence]'
      - name: Test first original diagnostic scenes and rights provenance
        run: python -m unittest discover -s tests -p 'test_wf_0bl_xuehai_original_scene_atlas_stage.py' -v
      - name: Stage original 16-card candidate atlas with the EXISTING XuehaiStore
        run: |
          python -m experiments.wf_0bl_stage_original_xuanhuan_xuehai --output "$RUNNER_TEMP/wf0bl-diagnostic-only.sqlite3"
          python - <<'PY'
          import os,sqlite3
          from pathlib import Path
          db=Path(os.environ["RUNNER_TEMP"])/"wf0bl-diagnostic-only.sqlite3"
          con=sqlite3.connect(db)
          assert con.execute("SELECT COUNT(*) FROM xuehai_entries").fetchone()[0]==16
          assert con.execute("SELECT COUNT(*) FROM snapshots WHERE status='published'").fetchone()[0]==0
          assert con.execute("SELECT COUNT(*) FROM studied_chapters").fetchone()[0]==0
          print("WF0BL_16_ORIGINAL_STAGE_ONLY_NOT_PUBLISHED_GREEN", flush=True)
          con.close()
          PY
      - name: Retrieve frozen 0.AY source for unrelated existing whole-repo tests
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full WriterForge regression without model calls
        run: python -m unittest discover -s tests -q
