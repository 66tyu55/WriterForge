name: WF 0.AS Six Original DeepSeek Author Self-Review Stage A/B ONCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0AS_SIX_EXISTING_PROSE_ONLY_REVIEW_ONCE_20261026.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0as-six-old-paragraphs-only-review-true-deepseek
  cancel-in-progress: false

jobs:
  original-author-independent-review:
    if: >-
      github.repository == '66tyu55/WriterForge' &&
      github.ref_name == 'refactor-unified-scene-delivery-audit' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'experiment(0.AS): FIRE SIX SAME DEEPSEEK SELF REVIEWS ONLY NO PROSE WRITES'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing WF packages only
        run: python -m pip install -e '.[r2]'
      - name: Exact one-shot and no R2, literature originals or other model credentials
        run: |
          test "$(cat experiments/WF_0AS_SIX_EXISTING_PROSE_ONLY_REVIEW_ONCE_20261026.txt)" = "WF0AS_SIX_AUTHOR_REVIEW_ONLY_NO_NEW_FICTION_SAME_DEEPSEEK"
          python - <<'PY'
          import os
          assert not any(os.getenv(k) for k in (
              'WRITERFORGE_R2_ACCOUNT_ID','WRITERFORGE_R2_ACCESS_KEY_ID',
              'DISCOVERY_API_KEY','OPENAI_API_KEY','OPENROUTER_API_KEY'))
          PY
      - name: Full zero-model suite before any new DeepSeek call
        run: python -m unittest discover -s tests -q
      - name: Retrieve exact old finished G six-turn source and reviewed originals
        uses: actions/download-artifact@v4
        with:
          run-id: 40264287305
          name: WF-0AQ-Real-Eight-Old-G-Responses-Then-New-Author-V119-Source-Closure
          github-token: ${{ github.token }}
          path: wf0as_original_0aq_full_g
      - name: Retrieve earlier first four G supplier original wires and writer prompts
        uses: actions/download-artifact@v4
        with:
          run-id: 40259961845
          name: WF-0AO-Old-Two-Real-DeepSeek-Plans-New-G-Prose-V119-Trace-Source
          github-token: ${{ github.token }}
          path: wf0as_original_0ao_eight
      - name: Source-only preflight checks SIX manuscript SHA and SIX original review envelopes
        run: |
          python - <<'PY'
          from experiments.wf_0as_real_six_same_writer_self_review_once_20261026 import freeze_original_six
          texts,beats,receipts,prompts,schemas=freeze_original_six()
          assert len(texts)==len(beats)==len(receipts)==len(prompts)==6
          assert schemas==['prose_echo','prose_echo','decision','decision','prose_echo','prose_echo']
          print('SHA-VERIFIED ALL SIX AUTHOR PARAGRAPHS AND OLD REVIEWS: valid 2 / 6, prose echoes 4 / 6')
          print('ZERO MODEL CALLS BEFORE THIS POINT.')
          PY
      - name: Only six new original-author REVIEW decisions, never new prose or mandatory revision
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_0as_real_six_same_writer_self_review_once_20261026
      - name: Verify original provider wire and honest, non-literary schema validity comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          base=Path('wf_0as_real_six_same_author_isolated_self_review_20261026')
          s=json.loads((base/'STATUS.json').read_text('utf8'))
          assert s['format']=='wf.0as.real-six-author-self-review-stage-separated.v1'
          assert s['status']=='SIX_REAL_SAME_AUTHOR_REVIEW_DECISIONS_RETAINED',s.get('failure_code')
          assert s['new_model_calls']==len(s['provider_events'])==6
          assert len(s['statuses'])==6
          assert s['previous_real_model_review_valid_count']==2
          assert s['previous_real_model_review_prose_echo_count']==4
          assert s['new_writer_prose_calls']==s['actual_canon_writes']==0
          assert s['R2_reads']==s['R2_writes']==0
          assert s['Railway_deployments']==0 and not s['main_modified']
          assert s['literary_quality_improvement_proven'] is False
          assert s['revision_is_never_forced']
          assert 0<=s['new_valid_decision_count']<=6
          for i,row in enumerate(s['provider_events'],1):
              if row['saved_before_decode']:
                  p=base/'new-provider-originals'/f'self-review-{i:02d}.json'
                  assert sha256(p.read_bytes()).hexdigest()==row['raw_provider_sha256']
          for row in s['statuses']:
              assert row['new_author_prose_generated'] is False
              assert row['new_canon_writes']==0
              print(row['turn_id'], 'old:',row['old_review_schema'],
                    'new:',row['new_review_decision'])
          print('ORIGINAL REVIEW VALID 2/6; ISOLATED REVIEW VALID',
                s['new_valid_decision_count'],'/6')
          print('This measures task schema compliance, NOT literary quality.')
          PY
      - name: Retain original third-party raw replies and all review decision evidence, also failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0AS-Six-Original-DeepSeek-Self-Reviews-Old-Versus-Isolated-Stage-Wires
          path: wf_0as_real_six_same_author_isolated_self_review_20261026/
          retention-days: 90
          if-no-files-found: warn
