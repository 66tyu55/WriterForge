name: WF Seven Genre Literary Writing — Live InkStone A/B Once
on:
  push:
    branches: [experiment-seven-literary-scenes-inkstone]
    paths:
      - .github/workflows/wf-seven-literary-scenes-live.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wf-seven-literary-live-once
  cancel-in-progress: false
jobs:
  seven-synthetic-genres:
    if: github.repository == '66tyu55/WriterForge'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[r2]'
      - name: Validate 7 fixed synthetic prompts with WF source checks offline
        run: python -m unittest tests.test_seven_literary_scenes_inkstone_ab -q
      - name: Run real budgeted InkStone A/B (2 probes + 14 generations maximum)
        run: python -m experiments.seven_literary_scenes_inkstone_ab
      - name: Publish safe reproducibility receipt and original synthetic generations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-7Genres-InkStone-Originals-and-Receipts
          path: wf_inkstone_seven_scene_results/
          retention-days: 7
          if-no-files-found: warn
