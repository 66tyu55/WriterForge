name: WF 0.BG Permanent REAL Local Qwen v1-v2 Source Evidence Audit - NO INFERENCE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bg-permanent-real-local-source-audit-offline.yml
      - experiments/wf_0bg_verify_real_local_value_observations.py
      - 'experiments/wf_0bg_local_cpu_actual_outputs_20261027/**'
      - tests/test_wf_0bg_permanent_real_local_output_source_evidence.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bg-local-open-weight-permanent-evidence-only
  cancel-in-progress: true

jobs:
  source-locked-archived-local-data-and-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No paid provider or private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install project without a local model runtime
        run: python -m pip install -e '.[r2,evidence]'
      - name: Prove REAL local output original byte SHAs and unreviewed cost deltas
        run: python -m unittest discover -s tests -p 'test_wf_0bg_permanent_real_local_output_source_evidence.py' -v
      - name: Materialize source-verified local contrast summary, no model request
        run: python -m experiments.wf_0bg_verify_real_local_value_observations
      - name: Retrieve historical 0.AY original provider artifact for unrelated full-suite source tests
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Entire WriterForge regression - strictly zero model inference
        run: python -m unittest discover -s tests -q
      - name: Keep independent source-verification report not literary scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0BG-Permanent-REAL-Local-Originals-SHA-Cost-Contrast-No-Readers
          path: wf0bg_verified_real_local_two_pair_contrast/
          if-no-files-found: warn
          retention-days: 90
