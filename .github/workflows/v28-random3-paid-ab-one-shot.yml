name: V28 random3 later chapters Flash GLM53 real AB one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-random3-paid-ab-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: wf-v28-random3-one-shot
  cancel-in-progress: false
jobs:
  random-three:
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      WF_SAMPLE_SLOT: ${{ matrix.slot }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Confirm deterministic three-source plan, old model identity and safe caps
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v28_random3_source.py -q
          python -m unittest discover -s tests -p test_v28_random3_runner.py -q
          python -m unittest discover -s tests -p test_v28_discovery_models.py -q
          python -m unittest discover -s tests -p test_v28_cloud_ab.py -q
      - name: One genuine Flash GLM-5.3 AB for the assigned previously verified chapter
        run: python -m scripts.run_wudong_random3_v7
