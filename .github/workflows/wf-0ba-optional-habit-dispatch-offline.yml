name: WF 0.BA Optional Portable Habit Registry-to-Dispatch OFFLINE

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0ba-optional-habit-dispatch-offline.yml
      - tests/test_wf_0ba_optional_habit_dispatch.py
      - tests/test_wf_0ba_portable_habit_candidate_ecology.py
      - tests/test_wf_0bb_signed_lineage_execution.py
      - tests/test_wf_0bc_first_host_nutrient_loop.py
      - tests/test_wf_0bc_live_writer_host_capture.py
      - writerforge/writing_assist.py
      - experiments/wf_0ay_real_two_host_429_source_only_dormancy_20261026.py
      - writerforge/evolution.py
      - writerforge/scheduler.py
      - writerforge/lane_scheduler.py

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0ba-optionally-authorized-habit-regression
  cancel-in-progress: true

jobs:
  zero-model-optional-dispatch-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No provider credentials, no R2 and no model inference
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY","DEEPSEEK_API_KEY","OPENAI_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - run: python -m pip install -e '.[r2,evidence]'
      - name: RED first / GREEN afterward - optional habit actual dispatch
        run: python -m unittest discover -s tests -p 'test_wf_0ba_optional_habit_dispatch.py' -v
      - name: P1 RED first / GREEN afterward - candidate competition and pollution lineage
        run: python -m unittest discover -s tests -p 'test_wf_0ba_portable_habit_candidate_ecology.py' -v
      - name: P2 RED first / GREEN afterward - trusted lineage execution and ancestor quarantine
        run: python -m unittest discover -s tests -p 'test_wf_0bb_signed_lineage_execution.py' -v
      - name: 0.BC RED first / GREEN afterward - first host nutrient source-to-shadow storage
        run: python -m unittest discover -s tests -p 'test_wf_0bc_first_host_nutrient_loop.py' -v
      - name: Capture actual writing-model application SHA receipts without new inference
        run: python -m unittest discover -s tests -p 'test_wf_0bc_live_writer_host_capture.py' -v
      - name: Retrieve immutable 0.AY originals required by 0.BD provenance tests
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full zero-model WriterForge regression
        run: python -m unittest discover -s tests -q
      - name: Studio JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("writerforge/ui/studio.html").read_text(encoding="utf8")
          assert html.count("<script>")==1 and html.count("</script>")==1
          js=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/wf0ba_studio.js").write_text(js,encoding="utf8")
          PY
          node --check /tmp/wf0ba_studio.js
