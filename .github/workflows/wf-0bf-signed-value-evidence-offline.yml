name: WF 0.BF Signed Actual-Output Value Evidence - OFFLINE No Provider

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0bf-signed-value-evidence-offline.yml
      - tests/test_wf_0bf_verified_habit_value_evidence.py
      - writerforge/evolution.py
      - experiments/wf_0be_v1_v2_preflight_only.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wf-0bf-signed-habit-evidence
  cancel-in-progress: true

jobs:
  synthetic-attestation-source-first-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No provider or private R2 credentials
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("OPENAI_API_KEY","DEEPSEEK_API_KEY","DISCOVERY_API_KEY","OPENROUTER_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY"))'
      - name: Install existing evidence verifier
        run: python -m pip install -e '.[r2,evidence]'
      - name: RED first / GREEN afterward signed host and independent reader provenance
        run: python -m unittest discover -s tests -p 'test_wf_0bf_verified_habit_value_evidence.py' -v
      - name: Retrieve original 0.AY wires needed by existing source-first full regression
        uses: actions/download-artifact@v4
        with:
          run-id: 40354436598
          name: WF-0AY-Two-REAL-Model-Hosts-Portable-Habit-Eight-Capped-Original-Wires
          github-token: ${{ github.token }}
          path: wf0ay_real_two_hosts_partial_source
      - name: Full offline regression, no provider or literary evaluation generated
        run: python -m unittest discover -s tests -q
