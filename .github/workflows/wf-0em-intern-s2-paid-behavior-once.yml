name: WF 0.EM bounded Intern-S2 paid multi-perspective writing practice (one shot)

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0em-intern-s2-paid-behavior-once.yml

permissions:
  contents: read

concurrency:
  group: wf-0em-single-paid-intern-s2-habit-practice
  cancel-in-progress: false

jobs:
  precheck-and-one-bounded-paid-practice:
    # A re-run or a later routine edit must NEVER re-buy this batch.
    if: >-
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'WF 0.EM: paid behavior study after verified fixture repair'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WF0EM_PAID_EXPERIMENT: WF0EM_BOUNDED_S2_20261105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing WF model adapter only
        run: python -m pip install -e .
      - name: Offline gated tests, no provider use
        run: |
          python -m unittest discover -s tests -p 'test_wf_0em_intern_s2_behavior_practice.py' -v
          python -m experiments.wf_0em_paid_intern_s2_behavior_practice --dry-run > "$RUNNER_TEMP/wf0em-dry-run.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"wf0em-dry-run.json"
          doc=json.loads(p.read_text("utf8"))
          assert doc["state"]=="OFFLINE_PRECHECK_COMPLETE"
          assert doc["max_provider_wire_calls"]==8
          assert doc["max_reserved_completion_tokens"]==21000
          assert doc["reference_library"]=="wf-0el-xuehai-literary-408-20261103-v1"
          assert not doc["model_weight_training"]
          assert not doc["author_accepted"]
          print("WF0EM_OFFLINE_SOURCE_AND_COST_GATE_SUCCESS",flush=True)
          PY
      - name: One opt-in paid Intern-S2 exercise, all original prose UNACCEPTED
        run: |
          mkdir -p "$RUNNER_TEMP/wf0em-private-synthetic"
          python -m experiments.wf_0em_paid_intern_s2_behavior_practice --live \
            --output-dir "$RUNNER_TEMP/wf0em-private-synthetic"
      - name: Preserve unreviewed synthetic practice and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wf0em-intern-s2-unreviewed-original-exercises
          path: |
            ${{ runner.temp }}/wf0em-dry-run.json
            ${{ runner.temp }}/wf0em-private-synthetic/
          if-no-files-found: ignore
          retention-days: 7
