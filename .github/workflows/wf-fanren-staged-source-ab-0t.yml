name: WF 0.T First Real Staged Fanren Source-Blind A/B
on:
  # Exactly one user-requested paid launch via this unique sentinel.
  # Workflow or code edits alone cannot rerun paid writing.
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_0T_FANREN_STAGED_AB_FIRE_ONCE_20261025.txt
      - experiments/WF_0T_FANREN_STAGED_AB_R2_READONLY_ONCE_20261025.txt

permissions:
  contents: read
concurrency:
  group: wf-0t-one-real-fanren-staged-two-arm-bounded
  cancel-in-progress: false

jobs:
  initial-two-turn-genuine-0t-pair:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies; no R2 credentials
        run: python -m pip install -e '.[r2]'
      - name: Prove source isolation and simulate two writer turns with actual WF reducers, no paid model
        run: >
          PYTHONPATH=tests python -m unittest
          tests.test_wf_fanren_staged_source_ab_0t
          tests.test_wf_source_guided_repair_contract
          tests.test_wf_writer_self_revision_loop -q
      - name: Genuine same-author DeepSeek writing, bounded at 10 calls and two small steps per arm
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
          WRITERFORGE_FANREN_SOURCE_URL: ${{ secrets.WRITERFORGE_FANREN_SOURCE_URL }}
          WRITERFORGE_FANREN_SOURCE_SHA256: ${{ secrets.WRITERFORGE_FANREN_SOURCE_SHA256 }}
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: python -m experiments.wf_fanren_staged_source_ab_0t
      - name: Report actual outcome, never count a simulated or incomplete pair as success
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('wf_fanren_staged_ab_0T/STATUS.json').read_text('utf8'))
          assert data['max_total_paid_calls']==10
          assert data['max_reserved_output_tokens']==14200
          assert data['no_automatic_retries']
          assert data['candidate_not_canon']
          assert data['R2_writes']==0
          assert data['canon_writes']==0
          assert not data['production_main_changed']
          assert data['railway_deployments']==0
          assert not data.get('literary_quality_improvement_proven')
          print('WF0T REAL STATUS:',data['status'])
          print('PAID REQUESTS:',data.get('same_model_actual_provider_calls',data.get('actual_paid_calls',0)))
          print('REAL VALID REPAIR + NEXT WRITER TURN:',data['real_full_repair_accepted'])
          PY
      - name: Preserve original generated excerpts, SHA receipts and failures but never private reference excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WF-0T-Real-Fanren-Staged-A-vs-B-Initial-Pair-20261025
          path: wf_fanren_staged_ab_0T/
          retention-days: 21
          if-no-files-found: warn
