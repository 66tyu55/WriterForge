name: WF Unified Scene Delivery and Progression Audit
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/unified-scene-delivery-audit.yml
      - writerforge/narrative_core.py
      - tests/test_wf_real_pov_unknown_source_leak.py
      - tests/test_wf_three_chapter_real_preflight.py
      - writerforge/writing_assist.py
      - writerforge/studio_server.py
      - writerforge/ui/studio.html
      - tests/test_studio_author_stage_cancel_discard.py
      - tests/test_wf_writer_self_revision_loop.py
      - tests/test_wf_source_guided_repair_contract.py
      - experiments/wf_fanren_staged_source_ab_0t.py
      - experiments/wf_0t_genuine_B2_repair_replay_20261025.py
      - tests/test_wf_fanren_staged_source_ab_0t.py
      - experiments/wf_0t_real_B_reader_repair_downstream_20261025.py
      - tests/test_wf_0t_real_B_repair_protocol.py
      - tests/test_wf_ai_writer_chooses_when_and_why.py
      - tests/test_wf_ai_writer_previous_turn_rewind.py
      - tests/test_wf_discarded_event_state_replay.py
      - tests/test_wf_cross_chapter_candidate_fork.py
      - tests/test_wf_studio_ai_chapter_review_branch.py
      - experiments/wf_three_existing_writer_models_real_20261024.py
      - experiments/wf_two_discovery_thinking_aware_real_20261024.py
      - tests/test_wf_three_real_writer_models_bounded.py
      - tests/test_wf_source_only_original_reread.py
      - tests/test_wf_reader_first_original_author.py
      - tests/test_wf_writer_source_identity_binding.py
      - experiments/wf_real_opera_source_sha_replay_20261025.py
      - experiments/wf_real_opera_cross_source_reader_followup_20261025.py
      - tests/test_wf_real_opera_cross_source_writer.py
      - tests/test_wf_author_prior_source_attribution.py
      - tests/test_wf_reader_source_attribution_G_integration.py
      - experiments/wf_real_opera_author_selected_v119_once_20261025.py
      - tests/test_wf_real_opera_author_chosen_v119.py
      - experiments/wf_real_new_scene_reader_first_control_20261025.py
      - tests/test_wf_real_new_scene_reader_first_control.py
      - experiments/wf_real_deepseek_blind_source_replay_20261024.py
      - experiments/wf_real_deepseek_v116_place_reread_20261024.py
      - writerforge/v116_state_delta.py
      - writerforge/v114_external_story_state.py
      - writerforge/v117_continuity_trace.py
      - writerforge/v119_revision_transaction.py
      - writerforge/v122_item_provenance.py
      - tests/test_wf_0u_source_attachment_relations.py
      - tests/test_wf_0w_container_multi_chapter_source.py
      - tests/test_wf_0x_bug_hunt_state_repair.py
      - experiments/wf_0w_new_original_autonomous_repair_once_20261025.py
      - tests/test_wf_0w_fresh_original_real_probe_protocol.py
      - experiments/wf_0v_real_B_physical_source_replay_20261025.py
      - tests/test_wf_0v_real_B_physical_replay.py
      - writerforge/v96_causal_turns.py
      - writerforge/deepseek_flash_model.py
      - tests/test_wf_scene_format_recovery.py
      - tests/test_wf_source_progression_literary.py
      - tests/test_unified_scene_delivery.py
      - tests/test_unified_prose_replay.py
permissions:
  contents: read
concurrency:
  group: wf-unified-scene-delivery
  cancel-in-progress: true
jobs:
  no-model-complete-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Do not use model credentials
        run: python -c 'import os; assert not any(os.getenv(n) for n in ("DISCOVERY_API_KEY","DEEPSEEK_API_KEY","OPENAI_API_KEY","OPENROUTER_API_KEY"))'
      - run: python -m pip install -e '.[r2]'
      - name: Full WriterForge suite including source-backed scene commitments
        run: python -m unittest discover -s tests -q
      - name: Validate packaged Studio JavaScript without a browser or model
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("writerforge/ui/studio.html").read_text(encoding="utf8")
          assert html.count("<script>")==1 and html.count("</script>")==1
          body=html.split("<script>",1)[1].split("</script>",1)[0]
          assert 'id="ai-chapter-review"' in html
          assert 'id="candidate-branch"' in html
          assert '"/api/autodraft/branch/select"' in body
          Path("/tmp/wf_studio_offline_verify.js").write_text(body,encoding="utf8")
          PY
          node --check /tmp/wf_studio_offline_verify.js
