name: WF Seven Chinese Literary Genres — Atria SSE Paired Originals
on:
  push:
    branches: [experiment-seven-literary-scenes-inkstone]
    paths:
      - .github/workflows/wf-seven-literary-sse-pairs.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wf-seven-literary-sse-one-batch
  cancel-in-progress: false
jobs:
  fixed-scene-original-pair:
    if: github.repository == '66tyu55/WriterForge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scene: [plot, climax, fight, scheme, horror, humor, psychology]
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
      WF_SCENE_CATEGORY: ${{ matrix.scene }}
      WF_BATCH_CONFIRMED_STREAM_MODEL: Atria-Dawn-Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[r2]'
      - name: Verify exact bounded stream protocol and source-grounded packet
        run: python -m unittest tests.test_seven_literary_scenes_inkstone_ab -q
      - name: Generate exactly one bare and one WF-guided synthetic story using Atria SSE
        run: python -m experiments.seven_literary_scenes_inkstone_ab
      - name: Preserve original chapter drafts, prompt hashes and real usage separately
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Atria-Genre-${{ matrix.scene }}-Originals-Receipts
          path: wf_inkstone_seven_scene_results/
          retention-days: 14
          if-no-files-found: warn
