name: V28 GLM53 Discovery low reasoning source-free one-shot probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-glm53-low-effort-probe-once.yml'
permissions:
  contents: read
jobs:
  limited-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify opt-in low reasoning never changes old models
        run: python -m unittest discover -s tests -p test_v28_glm_low_effort.py -q
      - name: One tiny original-only model feature probe no actual novel
        run: python -m scripts.probe_glm53_low_effort_once
