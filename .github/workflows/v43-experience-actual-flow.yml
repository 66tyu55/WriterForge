name: V43 actual WF experience execution and rollback (zero models)
on:
  push:
    branches: [v43-experience-runtime-experiment]
    paths:
      - '.github/workflows/v43-experience-actual-flow.yml'
      - 'writerforge/experience_executor.py'
      - 'writerforge/verified_flow.py'
      - 'tests/test_v43_experience_actual_flow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-real-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual WF (no LLM or private R2 dependencies)
        run: python -m pip install -e .
      - name: Actual production entry point A/B, error cases, rollback, no-model
        run: python -m unittest discover -s tests -p test_v43_experience_actual_flow.py -v
      - name: Ensure existing production tests remain compatible
        run: python -m unittest discover -s tests -p test_v23_real_learning.py -q
