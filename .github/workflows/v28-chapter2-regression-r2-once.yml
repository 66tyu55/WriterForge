name: V28 chapter2 cross-window regression R2 evidence one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-chapter2-regression-r2-once.yml'
permissions:
  contents: read
jobs:
  existing-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Verify no overwrite, old-case score preservation, and locked progression
        run: |
          python -m unittest discover -s tests -p test_v28_cross_window_review.py -q
          python -m unittest discover -s tests -p test_v28_crosswindow_r2_import.py -q
      - name: Fresh-download existing v5 and v6 abstract receipts only; compare and persist candidate
        run: python -m scripts.import_v28_chapter2_regression_evidence_r2
