name: Intern S2 authorized short probe 20261104
on:
  push:
    branches: [probe/intern-s2-short-20261104]
    paths:
      - '.github/workflows/intern-s2-short-20261104.yml'
permissions: {}
concurrency:
  group: intern-s2-short-20261104-one-request
  cancel-in-progress: false
jobs:
  single-synthetic-request:
    if: ${{ github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One synthetic Intern-S2 request capped at 512 output tokens
        env:
          DISCOVERY_API_KEY: ${{ secrets.DISCOVERY__API__KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          """One authorized synthetic Intern-S2 request; never log credentials or prose."""
          import json
          import os
          import ssl
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, build_opener, HTTPSHandler, HTTPRedirectHandler
          
          ENDPOINT = "https://discovery-api.intern-ai.org.cn/v1/chat/completions"
          MODEL = "intern-s2"
          MAX_TOKENS = 512
          MAX_RESPONSE_BYTES = 196608
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("REDIRECT_REFUSED")
          
          
          def run(opener=None):
              result = {
                  "model_requested": MODEL,
                  "max_output_tokens_requested": MAX_TOKENS,
                  "generation_requests_attempted": 0,
                  "automatic_retries": 0,
                  "private_novel_sent": False,
                  "thinking_control_requested": False,
              }
              key = os.environ.get("DISCOVERY_API_KEY", "")
              if not key:
                  return {**result, "status": "SECRET_UNAVAILABLE"}, 2
              payload = {
                  "model": MODEL,
                  "messages": [{"role": "user", "content": "请只回复测试成功这四个汉字，不要解释。"}],
                  "max_tokens": MAX_TOKENS,
                  "stream": False,
              }
              request = Request(
                  ENDPOINT,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              if opener is None:
                  opener = build_opener(NoRedirect(), HTTPSHandler(context=ssl.create_default_context()))
              result["generation_requests_attempted"] = 1
              try:
                  with opener.open(request, timeout=75) as response:
                      result["http_status"] = response.status
                      raw = response.read(MAX_RESPONSE_BYTES + 1)
              except HTTPError as exc:
                  return {**result, "status": "HTTP_ERROR", "http_status": exc.code}, 3
              except (URLError, TimeoutError, OSError, RuntimeError) as exc:
                  return {**result, "status": "TRANSPORT_ERROR", "error_type": type(exc).__name__}, 4
              if len(raw) > MAX_RESPONSE_BYTES:
                  return {**result, "status": "RESPONSE_TOO_LARGE"}, 5
              try:
                  body = json.loads(raw)
              except (ValueError, UnicodeError):
                  return {**result, "status": "INVALID_JSON"}, 5
              if not isinstance(body, dict):
                  return {**result, "status": "INVALID_DOCUMENT"}, 5
              choices = body.get("choices")
              choice = choices[0] if isinstance(choices, list) and choices and isinstance(choices[0], dict) else {}
              message = choice.get("message")
              message = message if isinstance(message, dict) else {}
              output = message.get("content")
              visible = isinstance(output, str) and bool(output.strip())
              finish = choice.get("finish_reason")
              if finish not in ("stop", "length", "content_filter", "tool_calls", None):
                  finish = "unrecognized"
              usage = body.get("usage")
              usage = usage if isinstance(usage, dict) else {}
              clean_usage = {k: v for k, v in usage.items() if k in ("prompt_tokens", "completion_tokens", "total_tokens") and type(v) is int and 0 <= v <= 1000000}
              result.update({
                  "provider_model_matches": body.get("model") == MODEL,
                  "visible_answer": visible,
                  "visible_characters": len(output) if isinstance(output, str) else 0,
                  "expected_synthetic_answer_matched": isinstance(output, str) and output.strip().strip("。.!！") == "测试成功",
                  "finish_reason": finish,
                  "usage": clean_usage,
                  "status": "VISIBLE_ANSWER_COMPLETE" if visible and finish == "stop" else "INCOMPLETE_OR_EMPTY_ANSWER",
              })
              return result, 0 if visible and finish == "stop" else 6
          
          
          if __name__ == "__main__":
              try:
                  result, code = run()
              except Exception as exc:
                  result, code = {"status": "PROBE_EXCEPTION", "error_type": type(exc).__name__, "automatic_retries": 0, "private_novel_sent": False}, 7
              print(json.dumps(result, ensure_ascii=False, indent=2))
              sys.exit(code)
          PYCODE
