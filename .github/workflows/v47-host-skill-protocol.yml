name: V47 actual host-facing WriterForge Skill protocol (no model substitution)
on:
  push:
    branches: [v47-host-skill-execution-protocol]
    paths:
      - '.github/workflows/v47-host-skill-protocol.yml'
      - 'writerforge/skill_host_session.py'
      - 'writerforge/source_study.py'
      - 'writerforge/cli.py'
      - 'tests/test_v47_skill_host_real_api.py'
      - 'SKILL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Genuine WF CLI stage persistence and spoiler boundary; simulated test replies not literary evidence
        run: python -m unittest discover -s tests -p test_v47_skill_host_real_api.py -v
      - name: Existing semantic source study and host API compatibility
        run: python -m unittest discover -s tests -p test_v35_xiyouji_observable.py -q
