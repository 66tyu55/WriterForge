name: Private R2 modern volume-grammar audit (numeric evidence only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-modern-volumes-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-volume-headings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        work: [qiumo, manghuangji]
    env:
      WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
      WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
      WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
      WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
      WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[r2]'
      - name: Identify actual volume header grammar from already archived private book
        run: python scripts/probe_modern_volumes_r2.py --work "${{ matrix.work }}"
