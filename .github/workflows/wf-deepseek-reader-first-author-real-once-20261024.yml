name: WF One-Shot Genuine DeepSeek First-Time Reader Then Own Author Decision 20261024
on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - experiments/WF_DEEPSEEK_READER_FIRST_AUTHOR_FIRE_ONCE_20261024.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: wf-source-verified-deepseek-reader-first-author-20261024
  cancel-in-progress: false
jobs:
  same-AI-reader-vs-author-on-real-prose:
    if: github.repository == '66tyu55/WriterForge' && github.ref_name == 'refactor-unified-scene-delivery-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing WF dependencies only
        run: python -m pip install -e .
      - name: Offline verify same-model reader source citations and G/Studio gates
        run: PYTHONPATH=tests python -m unittest tests.test_wf_reader_first_original_author tests.test_wf_ai_writer_chooses_when_and_why tests.test_wf_writer_self_revision_loop -q
      - name: Read exact real old 451-character manuscript from the original model run
        uses: actions/download-artifact@v4
        with:
          name: WF-3-Existing-Models-Real-Writer-Originals-20261024
          run-id: 40094106486
          github-token: ${{ github.token }}
          path: wf_prior_deepseek_20261024
      - name: Fail closed on prior text or any original provider wire mismatch, before cost
        run: |
          python - <<'PY'
          from experiments.wf_real_deepseek_blind_source_replay_20261024 import (
              verified_prior_source,REAL_PROSE_SHA)
          old=verified_prior_source()
          assert len(old['source'])==451
          assert old['status']['original_prose_sha256']==REAL_PROSE_SHA
          assert old['previous_decision']['decision']=='MOVE_ON'
          print('GENUINE REAL SOURCE AND OLDER ORIGINAL MOVE_ON VERIFIED')
          PY
      - name: One new reader first, same AI chooses author response; optional writer V119 only on real LOOK_BACK
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}
        run: python -m experiments.wf_real_deepseek_reader_first_author_once_20261024
      - name: Respect no literary auto-grades, source lock and hard max model calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('wf_deepseek_reader_first_author_20261024/STATUS.json').read_text('utf8'))
          assert s['source_sha256']=='46334d4e783a32c1def8affeb6eea2b9a4bb6e429e846ef910fb4b44601cd6f7'
          assert 0<=s['new_actual_provider_calls']<=3
          assert s['max_additional_provider_calls']==3
          assert s['new_model_retries']==0
          assert not s['literary_quality_verified']
          assert s['canon_writes']==0 and s['R2_writes']==0
          assert s['reader_hypotheses_unproven']
          print('TRUE READER-REPORT:',s.get('reader_result_status'))
          print('TRUE SAME-AI AUTHOR DECISION:',s.get('same_AI_author_decision'))
          print('TRUE CANDIDATE CHANGED:',s.get('written_candidate_changed'))
          print('TRUE PROVIDER REQUESTS:',s['new_actual_provider_calls'])
          PY
      - name: Keep paid source wires, first reader reconstruction and author choice even if it fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WF-Real-DeepSeek-Reader-First-Then-Author-Originals-20261024
          path: wf_deepseek_reader_first_author_20261024/
          retention-days: 30
          if-no-files-found: warn
