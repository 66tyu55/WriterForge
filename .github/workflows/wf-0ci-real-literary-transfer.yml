name: WF 0.CI Real Classical Literary Transfer via Existing Xuehai - NO MODEL

on:
  push:
    branches: [refactor-unified-scene-delivery-audit]
    paths:
      - .github/workflows/wf-0ci-real-literary-transfer.yml
      - experiments/wf_0ci_real_classical_transfer_red.py
      - writerforge/xuehai.py
      - writerforge/writing_assist.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-0ci-real-classical-transfer
  cancel-in-progress: true

jobs:
  real-classical-source-to-unrelated-fiction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse only existing WriterForge Xuehai and R2 clients
        run: python -m pip install -e '.[r2]'
      - name: Check two actual R2 public-domain classic sources across four different fictional scenes
        env:
          WRITERFORGE_R2_ACCOUNT_ID: ${{ secrets.WRITERFORGE_R2_ACCOUNT_ID }}
          WRITERFORGE_R2_BUCKET: ${{ secrets.WRITERFORGE_R2_BUCKET }}
          WRITERFORGE_R2_ACCESS_KEY_ID: ${{ secrets.WRITERFORGE_R2_ACCESS_KEY_ID }}
          WRITERFORGE_R2_SECRET_ACCESS_KEY: ${{ secrets.WRITERFORGE_R2_SECRET_ACCESS_KEY }}
          WRITERFORGE_R2_JURISDICTION: ${{ vars.WRITERFORGE_R2_JURISDICTION }}
        run: |
          python -m experiments.wf_0ci_real_classical_transfer_red > "$RUNNER_TEMP/wf0ci-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"wf0ci-result.json").read_text("utf8"))
          assert r["source_snapshot_exactly_verified"] is True
          assert r["real_public_domain_works"]==2
          assert r["literary_references_in_source"]==4
          for case in r["cases"]:
              print("WF0CI_CASE",json.dumps(case,ensure_ascii=False))
          assert len(r["cases"])==4
          assert r["model_calls"]==0 and r["r2_writes"]==0
          assert all(case["current_goal_only_meets_registered_reference"]
                     for case in r["cases"]), "WF0CI_REAL_CLASSIC_CRAFT_TRANSFER_RED"
          PY
