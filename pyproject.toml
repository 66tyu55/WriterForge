[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writerforge"
version = "28.0.0rc1"
description = "Executable kernel for the WriterForge literary system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["writerforge*"]

[project.scripts]
writerforge = "writerforge.cli:main"

[project.optional-dependencies]
r2 = ["boto3>=1.34,<2"]
evidence = ["cryptography>=42,<47"]

[tool.setuptools.package-data]
writerforge = ["ui/*.html"]
