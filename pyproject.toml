[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writerforge"
version = "24.0.0"
description = "Executable kernel for the WriterForge literary system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["writerforge*"]

[project.scripts]
writerforge = "writerforge.cli:main"

[project.optional-dependencies]
r2 = ["boto3>=1.34,<2"]
