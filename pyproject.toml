[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writerforge"
version = "19.0.0"
description = "Executable kernel for the WriterForge literary system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["writerforge*"]
